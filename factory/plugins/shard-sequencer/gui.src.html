<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shard Sequencer</title>
<style>
:root{--a:#ff7a45;--a2:#ffd23f;--bg0:#0b0806;--bg1:#1a110b;--ink:#fff1e6;--dim:#a08c7c;--panel:rgba(36,24,16,.62);--stroke:rgba(255,122,69,.18);--track:rgba(255,122,69,.14);--knob:#2a1a10}
/*@@KITCSS@@*/
.stage{position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(1000px 560px at 90% -10%,rgba(255,210,63,.11),transparent 60%),radial-gradient(900px 600px at 0% 100%,rgba(255,122,69,.13),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0) 70%)}
.wrap{max-width:1040px}
.hero{padding:0;overflow:hidden;border-radius:18px}
.seqcard{margin-top:16px;padding:16px 12px 12px}
.tools{display:flex;gap:6px;position:absolute;top:-13px;right:14px}
.tools button.btn{padding:4px 9px;font-size:8.5px;background:var(--bg0)}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:5px}
.stp{display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:0;transition:opacity .15s}
.stp .n{font-size:9px;text-align:center;color:var(--dim);letter-spacing:.05em;padding:2px 0;border-radius:5px;font-variant-numeric:tabular-nums}
.stp.cur .n{color:#0b0806;background:linear-gradient(135deg,var(--a),var(--a2));font-weight:700;box-shadow:0 0 10px var(--a)}
.stp.off{opacity:.3}
.stp .mini{font:inherit;font-size:8.5px;letter-spacing:.04em;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:6px;padding:4px 0;cursor:pointer;text-transform:uppercase}
.stp .mini:hover{color:var(--ink);border-color:var(--a)}
.stp .mini.on{color:#0b0806;background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;font-weight:700}
.lanelbl{display:grid;grid-template-columns:44px 1fr;align-items:center}
.glob{margin-top:16px}
.glob .rowx{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;justify-content:center;padding:6px 0 8px}
.glob .grp{display:flex;flex-direction:column;align-items:center}
.sync{font-size:8.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;text-align:center;margin-top:-2px}
@media (max-width:820px){.steps{grid-template-columns:repeat(8,1fr);row-gap:12px}}
</style>
</head>
<body>
<div class="stage">
  <div class="wrap">
    <header class="top">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M6 30L18 6l6 14z" fill="#ff7a45"/><path d="M22 40l8-30 6 22z" fill="#ffd23f" opacity=".9"/><path d="M30 42l12-20 2 20z" fill="#ff7a45" opacity=".75"/><path d="M4 42h40" stroke="#fff" stroke-opacity=".3"/>
      </svg>
      <div><h1>SHARD SEQUENCER</h1><div class="sub">granular slice &middot; ratchet &middot; glitch &middot; locked to your DAW</div></div>
      <div class="grow"></div>
      <div id="holdSlot"></div>
    </header>
    <div class="card hero" id="hero"></div>
    <div class="card seqcard" id="seq"><div class="ttl">sequence</div><div class="tools" id="tools"></div></div>
    <div class="card glob" id="glob"><div class="ttl">clock &amp; sound</div></div>
    <div class="hint">slice: 1 = oldest &rarr; 16 = newest audio in the capture window &middot; drag the lanes &middot; hold freezes the loop &middot; follows DAW tempo &amp; position</div>
  </div>
</div>
<script>
/*@@KITJS@@*/
</script>
<script>
(function () {
  "use strict";
  VS.define(/*@@PARAMS@@*/[]);
  var G = { TEMPO:0, STEPS:1, DIV:2, SWING:3, CAPT:4, HOLD:5, CHANCE:6, JIT:7, FADE:8, TONE:9, CRUSH:10, SPREAD:11, DUCK:12, MIX:13, LEVEL:14, S0:15 };
  var STEPBEATS = [1, 0.5, 0.25, 0.125, 1 / 3];
  function pct(x) { return Math.round(x * 100) + "%"; }
  function decode(f) { f = Math.round(f); return { rev: f & 1, r: ((f >> 1) & 3) + 1, g: (f >> 3) & 3 }; }

  function build() {
    VS.toggle(document.getElementById("holdSlot"), G.HOLD, "Hold loop", "holdbtn");
    var cv = VS.canvas(document.getElementById("hero"), 230);

    // ---- sequence lanes ----
    var seq = document.getElementById("seq");
    var tools = document.getElementById("tools");
    function mkBtn(lbl, fn) { var b = VS.el("button", "btn", tools, lbl); b.type = "button"; b.addEventListener("click", fn); return b; }
    var PITCHES = [0, 0, 0, 0, -12, 12, 7, -5, 5, 3, -7];
    mkBtn("Random", function () {
      for (var s = 0; s < 16; s++) {
        var b = G.S0 + s * 3, rest = Math.random() < 0.38;
        VS.push(b, rest ? 0 : 1 + Math.floor(Math.random() * 16));
        VS.push(b + 1, Math.random() < 0.6 ? 0 : PITCHES[Math.floor(Math.random() * PITCHES.length)]);
        var f = (Math.random() < 0.18 ? 1 : 0) | ((Math.random() < 0.3 ? 1 + Math.floor(Math.random() * 3) : 0) << 1) | ((Math.random() < 0.5 ? 3 : 1 + Math.floor(Math.random() * 3)) << 3);
        VS.push(b + 2, f);
      }
    });
    mkBtn("Clear", function () { for (var s = 0; s < 16; s++) { VS.push(G.S0 + s * 3, 0); VS.push(G.S0 + s * 3 + 1, 0); VS.push(G.S0 + s * 3 + 2, 24); } });
    mkBtn("Init", function () { for (var s = 0; s < 16; s++) for (var k = 0; k < 3; k++) { var i = G.S0 + s * 3 + k; VS.push(i, VS.defs[i].def); } });

    var grid = VS.el("div", "steps", seq), cols = [];
    for (var s = 0; s < 16; s++) (function (s) {
      var b = G.S0 + s * 3, c = VS.el("div", "stp", grid);
      VS.el("div", "n", c, String(s + 1));
      VS.fader(c, b, { h: 104, fmt: function (x) { return x < 0.5 ? "—" : String(Math.round(x)); }, reset: 0 });
      VS.fader(c, b + 1, { h: 74, bipolar: true, fmt: function (x) { return x === 0 ? "0" : (x > 0 ? "+" : "") + Math.round(x); }, reset: 0 });
      var rv = VS.el("button", "mini", c, "rev"), rt = VS.el("button", "mini", c, "x1"), gt = VS.el("button", "mini", c, "100");
      [rv, rt, gt].forEach(function (x) { x.type = "button"; });
      rv.addEventListener("click", function () { VS.push(b + 2, Math.round(VS.v(b + 2)) ^ 1); });
      rt.addEventListener("click", function () { var d = decode(VS.v(b + 2)); VS.push(b + 2, (Math.round(VS.v(b + 2)) & ~6) | (((d.r) % 4) << 1)); });
      gt.addEventListener("click", function () { var d = decode(VS.v(b + 2)); VS.push(b + 2, (Math.round(VS.v(b + 2)) & ~24) | (((d.g + 1) % 4) << 3)); });
      function paint() { var d = decode(VS.v(b + 2)); rv.classList.toggle("on", !!d.rev); rt.textContent = "x" + d.r; rt.classList.toggle("on", d.r > 1); gt.textContent = String(25 * (d.g + 1)); gt.classList.toggle("on", d.g < 3); }
      VS.listen(b + 2, paint); paint();
      cols.push(c);
    })(s);

    // ---- globals ----
    var g = document.getElementById("glob"), rx = VS.el("div", "rowx", g);
    function grp(lbl) { var d = VS.el("div", "grp", rx); VS.el("div", "lbl", d, lbl); return d; }
    var t1 = VS.el("div", "grp", rx);
    VS.knob(t1, G.TEMPO, { fmt: function (x) { return Math.round(x) + " bpm"; }, label: "Tempo*" });
    var t2 = grp("steps"); VS.stepper(t2, G.STEPS, function (x) { return Math.round(x) + " steps"; });
    var t3 = grp("division"); VS.seg(t3, G.DIV, ["1/4", "1/8", "1/16", "1/32", "1/8T"]);
    VS.knob(VS.el("div", "grp", rx), G.SWING, { fmt: function (x) { return x < 0.01 ? "straight" : pct(x / 0.6); } });
    var t4 = grp("capture (beats)"); VS.seg(t4, G.CAPT, ["1", "2", "4", "8"]);
    var kr = VS.el("div", "row", g); kr.style.paddingTop = "0";
    VS.knob(kr, G.CHANCE, { fmt: pct });
    VS.knob(kr, G.JIT, { fmt: pct, label: "Jitter" });
    VS.knob(kr, G.FADE, { fmt: function (x) { return (0.5 + x * x * 30).toFixed(1) + " ms"; } });
    VS.knob(kr, G.TONE, { fmt: function (x) { return Math.abs(x) < 0.03 ? "flat" : (x < 0 ? "LP " : "HP ") + Math.round(Math.abs(x) * 100); } });
    VS.knob(kr, G.CRUSH, { fmt: function (x) { return x < 0.02 ? "clean" : Math.round(15 - x * 11) + " bit"; } });
    VS.knob(kr, G.SPREAD, { fmt: pct });
    VS.knob(kr, G.DUCK, { fmt: pct });
    VS.knob(kr, G.MIX, { fmt: pct });
    VS.knob(kr, G.LEVEL, { fmt: function (x) { return (x <= 0.001 ? "-inf" : (20 * Math.log10(x)).toFixed(1)) + " dB"; }, label: "Out" });
    VS.el("div", "sync", g, "* free-running tempo — follows the DAW tempo & playhead automatically when it plays");

    // ---------------------------------------------------------------- viz
    var ctx = cv.ctx, ppq = 0, lastStep = -1, curStep = 0, flashes = [];
    function hash(n) { var x = Math.sin(n * 91.7 + 3.1) * 43758.5453; return x - Math.floor(x); }
    function hue(p) { return p > 0 ? 40 - p * 1.1 : 25 + p * 4.2; } // warm for up, toward blue for down
    function frame(t, dt) {
      var W = cv.w(), H = cv.h();
      var tempo = VS.v(G.TEMPO), steps = Math.round(VS.v(G.STEPS)), div = Math.round(VS.v(G.DIV)), swing = VS.v(G.SWING);
      var hold = VS.v(G.HOLD) >= 0.5, chance = VS.v(G.CHANCE), duck = VS.v(G.DUCK), mix = VS.v(G.MIX);
      var sb = STEPBEATS[div];
      ppq += dt * tempo / 60;
      var sp = ppq / sb, pi = Math.floor(sp * 0.5), fr = sp * 0.5 - pi, idx = fr < 0.5 + swing * 0.25 ? pi * 2 : pi * 2 + 1;
      curStep = ((idx % steps) + steps) % steps;
      var st0 = G.S0 + curStep * 3;
      if (idx !== lastStep) {
        lastStep = idx;
        var sl = Math.round(VS.v(st0));
        if (sl > 0) flashes.push({ slice: sl, age: 0, r: decode(VS.v(st0 + 2)).r, pitch: VS.v(st0 + 1) });
      }
      for (var cIdx = 0; cIdx < cols.length; cIdx++) { cols[cIdx].classList.toggle("cur", cIdx === curStep); cols[cIdx].classList.toggle("off", cIdx >= steps); }

      ctx.clearRect(0, 0, W, H);
      var padX = 14, cw = (W - padX * 2) / 16, sy0 = 30, sy1 = 92, ry = H - 34;
      // slice strip
      var scroll = hold ? 0 : t * 24;
      for (var i = 0; i < 16; i++) {
        var x = padX + i * cw, playing = flashes.some(function (f) { return f.slice === i + 1 && f.age < 0.25; });
        ctx.fillStyle = playing ? "rgba(255,210,63,.20)" : "rgba(255,255,255,.035)";
        ctx.strokeStyle = playing ? "rgba(255,210,63,.9)" : "rgba(255,255,255,.10)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x + 1.5, sy0, cw - 3, sy1 - sy0, 6) : ctx.rect(x + 1.5, sy0, cw - 3, sy1 - sy0); ctx.fill(); ctx.stroke();
        var bars = Math.floor((cw - 8) / 3);
        for (var k = 0; k < bars; k++) {
          var c = (i * bars + k) + Math.floor(scroll), amp = (0.25 + 0.75 * hash(c)) * (0.5 + 0.5 * Math.sin(c * 0.11 + i * 0.3));
          var bh = Math.max(1.5, amp * (sy1 - sy0 - 18) * 0.5);
          ctx.fillStyle = hold ? "rgba(191,224,255," + (playing ? 0.95 : 0.5) + ")" : "hsla(" + (18 + i * 2.5) + ",92%,66%," + (playing ? 1 : 0.55) + ")";
          ctx.fillRect(x + 4 + k * 3, (sy0 + sy1) / 2 - bh, 2, bh * 2);
        }
        ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.font = "8px ui-sans-serif,system-ui"; ctx.textAlign = "center";
        ctx.fillText(String(i + 1), x + cw / 2, sy1 - 4);
      }
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.textAlign = "left"; ctx.font = "9px ui-sans-serif,system-ui";
      ctx.fillText("capture window — oldest → newest" + (hold ? "  ·  HELD LOOP" : ""), padX, 18);
      // step row + arcs
      for (var s = 0; s < 16; s++) {
        var b = G.S0 + s * 3, sl2 = Math.round(VS.v(b)), pit = VS.v(b + 1), dc = decode(VS.v(b + 2));
        var sx = padX + s * cw + cw / 2, active = s < steps, isCur = s === curStep;
        if (sl2 > 0 && active) {
          var tx = padX + (sl2 - 1) * cw + cw / 2;
          var al = (isCur ? 0.95 : 0.34) * (0.35 + 0.65 * chance);
          ctx.strokeStyle = "hsla(" + hue(pit) + ",95%,62%," + al + ")";
          ctx.lineWidth = 1 + (dc.g + 1) * 0.8 + (isCur ? 1.2 : 0);
          ctx.setLineDash(dc.rev ? [4, 3] : []);
          ctx.beginPath(); ctx.moveTo(sx, ry - 10); ctx.bezierCurveTo(sx, (ry + sy1) / 2 + 10, tx, (ry + sy1) / 2 - 10, tx, sy1 + 2); ctx.stroke();
          ctx.setLineDash([]);
          if (dc.r > 1) { ctx.fillStyle = "hsla(" + hue(pit) + ",95%,70%," + al + ")"; for (var r = 0; r < dc.r; r++) { ctx.beginPath(); ctx.arc(sx - 6 + r * 4, ry - 16 - 0, 1.6, 0, 6.283); ctx.fill(); } }
        }
        ctx.fillStyle = !active ? "rgba(255,255,255,.05)" : (sl2 > 0 ? (isCur ? "#ffd23f" : "rgba(255,122,69,.85)") : "rgba(255,255,255,.12)");
        ctx.beginPath(); ctx.arc(sx, ry, isCur ? 7 : 5, 0, 6.283); ctx.fill();
        if (isCur && sl2 > 0) { ctx.strokeStyle = "rgba(255,210,63,.55)"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(sx, ry, 11 + (t * 30 % 6), 0, 6.283); ctx.stroke(); }
      }
      // flashes
      for (var fi = flashes.length - 1; fi >= 0; fi--) {
        var f = flashes[fi]; f.age += dt; if (f.age > 0.6) { flashes.splice(fi, 1); continue; }
        var fx = padX + (f.slice - 1) * cw + cw / 2, fa = 1 - f.age / 0.6;
        ctx.strokeStyle = "hsla(" + hue(f.pitch) + ",100%,70%," + fa * 0.8 + ")"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(fx, (sy0 + sy1) / 2, 6 + f.age * 46, 0, 6.283); ctx.stroke();
      }
      // duck meter
      ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.textAlign = "right"; ctx.font = "9px ui-sans-serif,system-ui";
      ctx.fillText("preview clock · " + Math.round(tempo) + " bpm · " + (["1/4", "1/8", "1/16", "1/32", "1/8T"][div]) + (chance < 0.99 ? " · " + pct(chance) + " chance" : ""), W - padX, 18);
    }
    return frame;
  }
  var frameFn = null;
  VS.boot(function () { frameFn = build(); }, function (t, dt) { if (frameFn) frameFn(t, dt); });
})();
</script>
</body>
</html>
