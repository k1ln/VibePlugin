<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aleatora</title>
<style>
  :root{ --bg:#07090d; --line:#1f2a36; --ink:#e3edf6; --ink2:#8ea3b8; --muted:#56687b; --ice:#7fd3ff; --ice2:#c8f0ff; --red:#ff5a5a; --accent:#7fd3ff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;user-select:none}
  #fit{position:absolute;left:0;top:0;transform-origin:0 0}
  .inst{width:1040px;padding:16px 18px;border-radius:12px;background:linear-gradient(180deg,#0f1620,#080b10 60%);box-shadow:0 0 0 1px #000,inset 0 1px 0 rgba(160,220,255,.07)}
  .top{display:flex;align-items:flex-end;gap:16px;margin-bottom:12px}
  .brand b{display:block;font-size:28px;letter-spacing:.42em;font-weight:200;color:var(--ice2)}
  .brand span{display:block;font-size:10px;letter-spacing:.3em;color:var(--ink2);text-transform:uppercase;margin-top:6px}
  .row{display:flex;gap:10px;align-items:stretch;margin-bottom:10px}
  .row > .grp{flex:1 1 auto}
  .grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(10,20,30,.45)}
  .gt{font-size:9.5px;letter-spacing:.26em;color:var(--ink2);text-transform:uppercase;margin-bottom:6px}
  .knobs{display:flex;gap:2px;flex-wrap:wrap;align-items:flex-end}
  .k-wrap{display:flex;flex-direction:column;align-items:center;width:60px}
  .k{cursor:ns-resize;display:block;touch-action:none}
  .k-tick{stroke:#2e4153;stroke-width:3}
  .k-skirt{fill:#05080c;stroke:#2b3d4f;stroke-width:2}
  .k-cap{fill:#101a24}
  .k-needle{stroke:var(--ice);stroke-width:7;stroke-linecap:round}
  .k-label{font-size:9px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase;margin-top:1px;text-align:center}
  .k-val{font-size:9.5px;color:var(--ice);min-height:11px}
  .sel{display:flex;flex-direction:column}
  .sel-label{font-size:9px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;margin-bottom:4px}
  .sel-row{display:flex;border:1px solid #2b3d4f;border-radius:6px;overflow:hidden}
  .sel-btn{border:0;background:rgba(0,0,0,.35);color:#8ea3b8;font:600 10px/1 inherit;padding:7px 8px;cursor:pointer;border-right:1px solid #1f2a36}
  .sel-btn:last-child{border-right:0}
  .sel-btn.on{background:var(--ice);color:#04121b}
  .tog{border:1px solid #2b3d4f;background:rgba(0,0,0,.35);color:var(--ink);font:600 10.5px/1 inherit;padding:8px 12px;border-radius:6px;cursor:pointer;letter-spacing:.12em}
  .tog.on{background:#1b6fa0;border-color:var(--ice);color:#fff;box-shadow:0 0 14px rgba(127,211,255,.35)}
  .score{position:relative;height:210px;border-radius:9px;background:repeating-linear-gradient(0deg,rgba(127,211,255,.05) 0 1px,transparent 1px 21px),#04070b;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .rise{height:6px;border-radius:3px;background:#0b141d;margin-top:8px;overflow:hidden}
  .rise i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1b6fa0,var(--ice2))}
  .foot{color:var(--muted);font-size:10px;line-height:1.45;margin-top:4px}
  .arts{display:flex;gap:4px;flex-wrap:wrap}
  .art{border:1px solid #2b3d4f;border-radius:6px;background:rgba(0,0,0,.35);color:#8ea3b8;font:600 10px/1 inherit;padding:7px 8px;cursor:pointer}
  .art.on{background:var(--ice);color:#04121b;border-color:var(--ice)}
</style>
</head>

<div id="fit"><div class="inst" id="u"></div></div>
<script>
/* =====================================================================
   drums/ui/kit.js — shared panel components for the drum machines.
   Inlined into every gui.html by build.mjs (a plugin GUI is one file).

   Contract with the host (src/BridgeShim.h):
     · window.vstai.setParam(i, v) sends ACTUAL values (spec min..max).
     · on ready, every param's current value is pushed once;
     · window.vstai.onParam(cb) repaints controls when the DAW / a restored
       session changes a value — draw only, never push back;
     · window.vstai.onDisplay(cb) delivers the engine's 16 display floats.
   ===================================================================== */
var Kit = (function () {
  var PD = {};            // index -> {name,min,max,def,step}
  var vals = {};
  var listeners = {};
  var displayFns = [];

  function has(fn) { return window.vstai && typeof window.vstai[fn] === "function"; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function el(tag, cls, parent, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function svg(tag, attrs, parent) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function define(list) {
    list.forEach(function (p) { PD[p.index] = p; vals[p.index] = p.def; });
  }
  function get(i) { return vals[i]; }
  function norm(i) { var p = PD[i]; return (vals[i] - p.min) / ((p.max - p.min) || 1); }
  function quant(i, v) {
    var p = PD[i];
    v = clamp(v, p.min, p.max);
    if (p.step) v = Math.round((v - p.min) / p.step) * p.step + p.min;
    return v;
  }
  function notify(i) { var ls = listeners[i]; if (ls) for (var j = 0; j < ls.length; j++) ls[j](vals[i]); }
  // User change: store, send to the engine, repaint.
  function set(i, v) {
    v = quant(i, v);
    if (v === vals[i]) return;
    vals[i] = v;
    if (has("setParam")) window.vstai.setParam(+i, v);
    notify(i);
  }
  function listen(i, fn) { (listeners[i] = listeners[i] || []).push(fn); fn(vals[i]); }
  function onDisplay(fn) { displayFns.push(fn); }

  function ready() {
    for (var i in vals) if (has("setParam")) window.vstai.setParam(+i, vals[i]);
    if (has("onParam")) window.vstai.onParam(function (i, v) {
      if (!(i in PD)) return;
      vals[i] = quant(i, +v);
      notify(i);
    });
    if (has("onDisplay")) window.vstai.onDisplay(function (d) {
      for (var j = 0; j < displayFns.length; j++) { try { displayFns[j](d); } catch (e) {} }
    });
  }
  function start() { if (has("onReady")) window.vstai.onReady(ready); else ready(); }

  function note(n, vel) {
    if (!has("noteOn")) return;
    window.vstai.noteOn(n, vel == null ? 0.7 : vel);
    setTimeout(function () { if (has("noteOff")) window.vstai.noteOff(n); }, 60);
  }

  // ---- drag helper: vertical drag, shift = fine --------------------------
  function dragValue(target, i, sens) {
    var startY = 0, startN = 0, active = false;
    function move(e) {
      if (!active) return;
      var dy = startY - e.clientY;
      var k = (e.shiftKey ? 0.2 : 1) * (sens || 1) / 160;
      var p = PD[i];
      set(i, p.min + clamp(startN + dy * k, 0, 1) * (p.max - p.min));
    }
    function up() { active = false; window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); }
    target.addEventListener("pointerdown", function (e) {
      e.preventDefault(); active = true; startY = e.clientY; startN = norm(i);
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
    });
    target.addEventListener("wheel", function (e) {
      e.preventDefault();
      var p = PD[i], stepN = p.step ? p.step / (p.max - p.min) : 0.01;
      set(i, p.min + clamp(norm(i) + (e.deltaY < 0 ? 1 : -1) * stepN * (e.shiftKey ? 1 : 2), 0, 1) * (p.max - p.min));
    }, { passive: false });
    target.addEventListener("dblclick", function () { set(i, PD[i].def); });
  }

  // ---- knob --------------------------------------------------------------
  // opts: {label, cap (css colour), size, fmt(v) -> string, sub}
  function knob(parent, i, opts) {
    opts = opts || {};
    var size = opts.size || 44;
    var wrap = el("div", "k-wrap" + (opts.cls ? " " + opts.cls : ""), parent);
    var s = svg("svg", { width: size, height: size, viewBox: "0 0 100 100", class: "k" }, wrap);
    // scale ticks
    for (var t = 0; t <= 10; t++) {
      var a = (-135 + t * 27) * Math.PI / 180;
      svg("line", { x1: 50 + 44 * Math.sin(a), y1: 50 - 44 * Math.cos(a), x2: 50 + 49 * Math.sin(a), y2: 50 - 49 * Math.cos(a), class: "k-tick" }, s);
    }
    svg("circle", { cx: 50, cy: 50, r: 38, class: "k-skirt" }, s);
    svg("circle", { cx: 50, cy: 50, r: 30, class: "k-cap", style: opts.cap ? "fill:" + opts.cap : "" }, s);
    var needle = svg("line", { x1: 50, y1: 50, x2: 50, y2: 18, class: "k-needle" }, s);
    if (opts.label) el("div", "k-label", wrap, opts.label);
    var readout = el("div", "k-val", wrap, "");
    function draw() {
      var th = (-135 + 270 * norm(i)) * Math.PI / 180;
      needle.setAttribute("x2", 50 + 32 * Math.sin(th));
      needle.setAttribute("y2", 50 - 32 * Math.cos(th));
      readout.textContent = opts.fmt ? opts.fmt(vals[i]) : "";
    }
    listen(i, draw);
    dragValue(s, i, opts.sens);
    wrap.title = (PD[i] && PD[i].name) || "";
    return wrap;
  }

  // ---- multi-position selector (values = option index + min) -------------
  // opts: {label, options:[...labels], cls}
  function selector(parent, i, opts) {
    var wrap = el("div", "sel" + (opts.cls ? " " + opts.cls : ""), parent);
    if (opts.label) el("div", "sel-label", wrap, opts.label);
    var row = el("div", "sel-row", wrap);
    var btns = opts.options.map(function (lab, j) {
      var b = el("button", "sel-btn", row, lab);
      b.type = "button";
      b.addEventListener("click", function () { set(i, PD[i].min + j * (PD[i].step || 1)); });
      return b;
    });
    listen(i, function (v) {
      var j = Math.round((v - PD[i].min) / (PD[i].step || 1));
      btns.forEach(function (b, k) { b.classList.toggle("on", k === j); });
    });
    return wrap;
  }

  // ---- one bit of a packed switch word ------------------------------------
  function bitSwitch(parent, i, bit, offLabel, onLabel, cls) {
    var b = el("button", "bit" + (cls ? " " + cls : ""), parent);
    b.type = "button";
    var a = el("span", "bit-a", b, offLabel), c = el("span", "bit-b", b, onLabel);
    b.addEventListener("click", function () { set(i, Math.round(vals[i]) ^ (1 << bit)); });
    listen(i, function (v) { var on = (Math.round(v) >> bit) & 1; b.classList.toggle("on", !!on); });
    return b;
  }

  function toggle(parent, i, label, cls) {
    var b = el("button", "tog" + (cls ? " " + cls : ""), parent, label);
    b.type = "button";
    b.addEventListener("click", function () { set(i, vals[i] > 0.5 ? 0 : 1); });
    listen(i, function (v) { b.classList.toggle("on", v > 0.5); });
    return b;
  }

  function pad(parent, noteNum, label, cls) {
    var b = el("button", "pad" + (cls ? " " + cls : ""), parent, label);
    b.type = "button";
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); note(noteNum, e.shiftKey ? 1.0 : 0.62); b.classList.add("hit"); setTimeout(function () { b.classList.remove("hit"); }, 90); });
    return b;
  }

  // A 16-bit step row stored in one parameter.
  function rowBit(i, step) { return (Math.round(vals[i]) >> step) & 1; }
  function toggleStep(i, step) { set(i, Math.round(vals[i]) ^ (1 << step)); }

  return {
    define: define, get: get, set: set, listen: listen, onDisplay: onDisplay, start: start,
    knob: knob, selector: selector, bitSwitch: bitSwitch, toggle: toggle, pad: pad, note: note,
    rowBit: rowBit, toggleStep: toggleStep, el: el, svg: svg, PD: PD
  };
})();

</script>
<script>
(function () {
  var DEFS = [{"index":0,"key":"ART","name":"Articulation","min":0,"max":7,"def":0,"step":1},{"index":1,"key":"PLAYERS","name":"Density","min":1,"max":6,"def":5,"step":1},{"index":2,"key":"SECTION","name":"Register","min":0,"max":4,"def":0,"step":1},{"index":3,"key":"CLUSTER","name":"Cluster Width","min":0,"max":300,"def":60,"step":0},{"index":4,"key":"QUARTER","name":"Quarter-tone Grid","min":0,"max":1,"def":1,"step":1},{"index":5,"key":"SWARM","name":"Swarm Range","min":0,"max":12,"def":0.6,"step":0},{"index":6,"key":"SWARM_SPEED","name":"Swarm Speed","min":0,"max":1,"def":0.3,"step":0},{"index":7,"key":"SWARM_GLIDE","name":"Swarm Glide","min":0,"max":1,"def":0.5,"step":0},{"index":8,"key":"RISE","name":"Rise","min":-24,"max":24,"def":0,"step":0},{"index":9,"key":"RISE_TIME","name":"Rise Time","min":0.5,"max":30,"def":8,"step":0},{"index":10,"key":"SCRATCH","name":"Scratch","min":0,"max":1,"def":0.15,"step":0},{"index":11,"key":"SHIMMER","name":"Shimmer","min":0,"max":1,"def":0.3,"step":0},{"index":12,"key":"PULSE","name":"Pulse Depth","min":0,"max":1,"def":0,"step":0},{"index":13,"key":"PULSE_DIV","name":"Pulse Rate","min":0,"max":5,"def":2,"step":1},{"index":14,"key":"CHAOS","name":"Chaos","min":0,"max":1,"def":0.35,"step":0},{"index":15,"key":"DYN","name":"Dynamics","min":0,"max":1,"def":0.55,"step":0},{"index":16,"key":"EXPR","name":"Expression","min":0,"max":1,"def":0.85,"step":0},{"index":17,"key":"VIB","name":"Vibrato","min":0,"max":1,"def":0.3,"step":0},{"index":18,"key":"ATTACK","name":"Attack","min":0,"max":1,"def":0.6,"step":0},{"index":19,"key":"RELEASE","name":"Release","min":0,"max":1,"def":0.55,"step":0},{"index":20,"key":"FORCE","name":"Bow Pressure","min":0,"max":1,"def":0.5,"step":0},{"index":21,"key":"POSITION","name":"Bow Position","min":0,"max":1,"def":0.5,"step":0},{"index":22,"key":"BRIGHT","name":"Brightness","min":0,"max":1,"def":0.5,"step":0},{"index":23,"key":"TREM_RATE","name":"Tremolo Speed","min":0,"max":1,"def":0.6,"step":0},{"index":24,"key":"HUMAN","name":"Humanize","min":0,"max":1,"def":0.8,"step":0},{"index":25,"key":"FREEZE","name":"Freeze","min":0,"max":1,"def":0,"step":1},{"index":26,"key":"HALL_SIZE","name":"Hall Size","min":0,"max":1,"def":0.8,"step":0},{"index":27,"key":"HALL_TONE","name":"Hall Tone","min":0,"max":1,"def":0.45,"step":0},{"index":28,"key":"DRY","name":"Dry","min":0,"max":1,"def":0.55,"step":0},{"index":29,"key":"WET","name":"Wet","min":0,"max":1,"def":0.7,"step":0},{"index":30,"key":"WIDTH","name":"Width","min":0,"max":1,"def":0.9,"step":0},{"index":31,"key":"MASTER","name":"Master","min":0,"max":1,"def":0.7,"step":0}];
  Kit.define(DEFS);
  var P = {}; DEFS.forEach(function (d) { P[d.key] = d.index; });
  var el = Kit.el, u = document.getElementById("u");
  var pct = function (v) { return Math.round(v * 100) + ""; };

  var top = el("div", "top", u);
  var br = el("div", "brand", top); br.innerHTML = "<b>ALEATORA</b><span>Aleatoric string textures</span>";
  var sp = el("div", "", top); sp.style.flex = "1";
  Kit.selector(top, P.SECTION, { label: "Register", options: ["Auto", "Violins", "Violas", "Celli", "Basses"] });
  Kit.knob(top, P.CHAOS, { label: "Chaos", size: 48, fmt: pct });
  Kit.knob(top, P.MASTER, { label: "Master", size: 44, fmt: pct });

  var row = el("div", "row", u);
  var sg = el("div", "grp", row); sg.style.flex = "2 1 0";
  el("div", "gt", sg, "Swarm · each line is one player's pitch");
  var score = el("div", "score", sg);
  var cv = el("canvas", "", score);
  var rise = el("div", "rise", sg), riseBar = el("i", "", rise);

  var ag = el("div", "grp", row); ag.style.flex = "1 1 0";
  el("div", "gt", ag, "Articulation · C0 – G0");
  var arts = el("div", "arts", ag);
  var NAMES = ["Sustain", "Tremolo", "Pizz", "Spiccato", "Marcato", "Harmonics", "Sul pont", "Col legno"];
  var artBtns = NAMES.map(function (n, i) { var b = el("button", "art", arts, n); b.type = "button"; b.addEventListener("click", function () { Kit.set(P.ART, i); }); return b; });
  var showArt = function (i) { artBtns.forEach(function (b, k) { b.classList.toggle("on", k === i); }); };
  Kit.listen(P.ART, showArt);
  var dk = el("div", "knobs", ag); dk.style.marginTop = "10px";
  Kit.knob(dk, P.PLAYERS, { label: "Density", sens: 0.5, fmt: function (v) { return v + " pl."; } });
  Kit.knob(dk, P.DYN, { label: "Dynamics", fmt: pct }); Kit.knob(dk, P.EXPR, { label: "Expression", fmt: pct });
  Kit.knob(dk, P.VIB, { label: "Vibrato", fmt: pct });
  var fz = el("div", "", ag); fz.style.marginTop = "10px";
  Kit.toggle(fz, P.FREEZE, "FREEZE").title = "Hold the hall's tail indefinitely";

  var row2 = el("div", "row", u);
  var cg = el("div", "grp", row2); el("div", "gt", cg, "Cluster");
  var ck = el("div", "knobs", cg);
  Kit.knob(ck, P.CLUSTER, { label: "Width", fmt: function (v) { return "±" + Math.round(v) + " c"; } });
  Kit.toggle(ck, P.QUARTER, "¼-TONE").style.margin = "0 4px 16px";
  var wg = el("div", "grp", row2); el("div", "gt", wg, "Swarm");
  var wk = el("div", "knobs", wg);
  Kit.knob(wk, P.SWARM, { label: "Range", fmt: function (v) { return "±" + v.toFixed(1) + " st"; } });
  Kit.knob(wk, P.SWARM_SPEED, { label: "Speed", fmt: function (v) { return (0.1 * Math.pow(80, v)).toFixed(2) + " Hz"; } });
  Kit.knob(wk, P.SWARM_GLIDE, { label: "Glide", fmt: pct });
  var rg = el("div", "grp", row2); el("div", "gt", rg, "Rise / fall");
  var rk = el("div", "knobs", rg);
  Kit.knob(rk, P.RISE, { label: "Amount", fmt: function (v) { return (v > 0 ? "+" : "") + v.toFixed(1) + " st"; } });
  Kit.knob(rk, P.RISE_TIME, { label: "Time", fmt: function (v) { return v.toFixed(1) + " s"; } });
  var tg = el("div", "grp", row2); el("div", "gt", tg, "Texture");
  var tk = el("div", "knobs", tg);
  Kit.knob(tk, P.SCRATCH, { label: "Scratch", fmt: pct }); Kit.knob(tk, P.SHIMMER, { label: "Shimmer", fmt: pct });
  Kit.knob(tk, P.PULSE, { label: "Pulse", fmt: pct });
  Kit.selector(tk, P.PULSE_DIV, { label: "Rate", options: ["¼", "⅛", "⅛T", "1/16", "1/16T", "1/32"] });

  var row3 = el("div", "row", u);
  var bg = el("div", "grp", row3); el("div", "gt", bg, "Bow");
  var bk = el("div", "knobs", bg);
  Kit.knob(bk, P.FORCE, { label: "Pressure", fmt: pct }); Kit.knob(bk, P.POSITION, { label: "Tasto–pont", fmt: pct });
  Kit.knob(bk, P.BRIGHT, { label: "Bright", fmt: pct }); Kit.knob(bk, P.ATTACK, { label: "Attack", fmt: pct });
  Kit.knob(bk, P.RELEASE, { label: "Release", fmt: pct }); Kit.knob(bk, P.TREM_RATE, { label: "Trem.", fmt: pct }); Kit.knob(bk, P.HUMAN, { label: "Humanize", fmt: pct });
  var hg = el("div", "grp", row3); el("div", "gt", hg, "Space");
  var hk = el("div", "knobs", hg);
  Kit.knob(hk, P.HALL_SIZE, { label: "Size", fmt: pct }); Kit.knob(hk, P.HALL_TONE, { label: "Tone", fmt: pct });
  Kit.knob(hk, P.DRY, { label: "Dry", fmt: pct }); Kit.knob(hk, P.WET, { label: "Wet", fmt: pct }); Kit.knob(hk, P.WIDTH, { label: "Width", fmt: pct });

  el("div", "foot", u, "Each key is a cluster of bowed-string players. Swarm sends every player wandering after its own pitch; Rise glides the whole mass over seconds; Scratch is real overpressure in the bow model; Pulse follows your DAW. Keyswitches C0–G0; CC1 dynamics, CC11 expression.");

  // ---- the swarm scope: trails of each player's pitch offset -------------
  var ctx = cv.getContext("2d"), W = 0, H = 0, hist = [];
  function size() { var r = cv.getBoundingClientRect(); W = cv.width = Math.max(10, Math.round(r.width)); H = cv.height = Math.max(10, Math.round(r.height)); }
  size();
  var COLORS = ["#7fd3ff", "#a7e3ff", "#58b8f0", "#c8f0ff", "#3f9bd6", "#e3f6ff"];
  function drawScope() {
    if (!ctx) return;
    ctx.fillStyle = "rgba(4,7,11,0.28)"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(127,211,255,0.10)"; ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    for (var j = 0; j < 6; j++) {
      ctx.beginPath(); var started = false;
      for (var k = 0; k < hist.length; k++) {
        var v = hist[k][j]; if (v < -2) { started = false; continue; }
        var x = W - (hist.length - k) * 4, y = H / 2 - v * (H * 0.42);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = COLORS[j]; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  Kit.onDisplay(function (d) {
    hist.push([d[5], d[6], d[7], d[8], d[9], d[10]]);
    if (hist.length > Math.ceil(W / 4) + 2) hist.shift();
    drawScope();
    riseBar.style.width = Math.round(d[2] * 100) + "%";
    showArt(Math.round(d[0]));
  });
  drawScope();

  var fitEl = document.getElementById("fit");
  function fit() {
    var w = u.offsetWidth, h = u.offsetHeight, s = Math.min(window.innerWidth / w, window.innerHeight / h);
    fitEl.style.transform = "scale(" + s + ")";
    fitEl.style.left = Math.max(0, (window.innerWidth - w * s) / 2) + "px";
    fitEl.style.top = Math.max(0, (window.innerHeight - h * s) / 2) + "px";
  }
  window.addEventListener("resize", function () { fit(); size(); }); fit();
  Kit.start();
})();
</script>
