<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Silverbox Toms — test bench</title><style>
  :root{--ac:#e5531a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:13px ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e7eef6;
    background:radial-gradient(130% 100% at 50% -20%,#171f2d,#070a0f 72%);display:flex;flex-direction:column;align-items:center;gap:13px;padding:18px}
  .top{display:flex;align-items:center;gap:11px;width:100%;max-width:1000px}
  .top .led{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
  .top b{font-size:15px;letter-spacing:.05em;color:var(--ac)}
  .top .sub{font-size:11px;color:#7c8aa3;margin-left:auto}
  iframe{width:100%;max-width:1000px;height:600px;border:0;background:transparent;display:block}
  .bar{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:11px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px 16px;
    box-shadow:0 16px 40px rgba(0,0,0,.4)}
  canvas{width:100%;height:74px;display:block;border-radius:10px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.06)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{font:inherit;color:#06080c;background:var(--ac);border:0;border-radius:10px;padding:9px 17px;font-weight:800;cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}
  button.off{background:#28313f;color:#e7eef6}
  select,input[type=file]{font:inherit;color:#e7eef6;background:#10151e;border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:7px 9px}
  label{display:flex;gap:8px;align-items:center;color:#aeb9cc}
  .st{font-size:12px;color:#8da0bd;min-height:16px}
  .krow{display:flex;gap:8px;align-items:center;color:#aeb9cc;font-size:12px}
  .krow .klabel{font-weight:600;letter-spacing:.03em}
  .krow .oct{padding:4px 13px;font-size:16px;line-height:1;background:#28313f;color:#e7eef6;border-radius:8px}
  .krow .octval{min-width:22px;text-align:center;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
  .krow .khint{margin-left:4px;color:#7c8aa3;font-size:11px}
  .kb{display:flex;gap:3px;flex-wrap:wrap}
  .kb .key{width:30px;height:80px;border-radius:0 0 7px 7px;background:linear-gradient(#f4f7fb,#cdd5e0);
    border:1px solid #2a3344;cursor:pointer;color:#1a2230;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;transition:.08s}
  .kb .key.bk{background:linear-gradient(#2b3340,#10151d);color:#9fb0c8;height:52px;width:22px;margin:0 -12px;z-index:2}
  .kb .key.dn{background:linear-gradient(var(--ac),#fff);color:#06080c;transform:translateY(2px)}
  </style></head><body>

  gf.srcdoc="<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Drum voice<\/title>\n<style>\n  :root{ --bg:#0f0f10; --panel:#1c1c1d; --panel2:#262628; --line:#343437; --ink:#ece6d6; --ink2:#a7a194; --muted:#6f6b63;\n         --accent:#f08a24; --accent2:#f2d23c; --cap:#2c2c2f; --skirt:#0c0c0d; --needle:#efe9d8; --pad:#e2382a; --padInk:#fff; }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.3 \"Helvetica Neue\",Helvetica,Arial,sans-serif;overflow:hidden;user-select:none}\n  #fit{position:absolute;left:0;top:0;transform-origin:0 0}\n  .unit{width:640px;padding:14px 16px 14px;background:linear-gradient(180deg,var(--panel2),var(--panel) 45%);border-radius:10px;box-shadow:0 0 0 1px #000,inset 0 1px 0 rgba(255,255,255,.08)}\n  .head{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}\n  .head b{white-space:nowrap;font-size:21px;letter-spacing:.06em;font-weight:800}\n  .head b i{font-style:normal;color:var(--accent)}\n  .head span{white-space:nowrap;color:var(--ink2);font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding-bottom:3px}\n  .meter{margin-left:auto;flex:0 1 120px;min-width:36px;height:8px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden;align-self:center}\n  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fbf5a,var(--accent2) 70%,#e2382a)}\n  .body{display:flex;gap:12px;align-items:stretch}\n  .sections{display:flex;flex-wrap:wrap;gap:8px;flex:1;align-content:flex-start}\n  .sec{flex:1 1 auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px;background:rgba(0,0,0,.16)}\n  .sec-title{font-size:9.5px;letter-spacing:.18em;color:var(--ink2);text-transform:uppercase;margin-bottom:4px;text-align:center}\n  .row{display:flex;gap:4px;align-items:flex-end;justify-content:center;flex-wrap:wrap}\n  .pads{display:flex;flex-direction:column;justify-content:center;gap:8px;width:150px}\n  .pad{flex:1 1 0;min-height:58px;max-height:120px;border:0;border-radius:8px;background:var(--pad);color:var(--padInk);font:800 12px/1.1 inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;\n       box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 2px 0 #000;position:relative;padding:8px}\n  .pad small{display:block;font-weight:600;font-size:9.5px;opacity:.75;letter-spacing:.04em;margin-top:3px;text-transform:none}\n  .pad .fl{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.35)}\n  .pad.hit{filter:brightness(1.25)}\n  .hint{margin-top:10px;color:var(--muted);font-size:10px;line-height:1.45}\n  /* kit controls */\n  .k-wrap{display:flex;flex-direction:column;align-items:center;width:58px}\n  .k{cursor:ns-resize;display:block;touch-action:none}\n  .k-tick{stroke:var(--muted);stroke-width:3}\n  .k-skirt{fill:var(--skirt);stroke:rgba(255,255,255,.12);stroke-width:2}\n  .k-cap{fill:var(--cap)}\n  .k-needle{stroke:var(--needle);stroke-width:7;stroke-linecap:round}\n  .k-label{font-size:9.5px;letter-spacing:.07em;color:var(--ink2);text-transform:uppercase;margin-top:1px;text-align:center}\n  .k-val{font-size:9.5px;color:var(--accent);min-height:11px;font-variant-numeric:tabular-nums}\n  .sel{display:flex;flex-direction:column;align-items:center;padding:0 2px 12px}\n  .sel-label{font-size:9.5px;letter-spacing:.12em;color:var(--ink2);text-transform:uppercase;margin-bottom:3px}\n  .sel-row{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:5px;overflow:hidden}\n  .sel-btn{border:0;background:rgba(0,0,0,.35);color:var(--ink2);font:700 10.5px/1 inherit;padding:6px 8px;cursor:pointer}\n  .sel-btn.on{background:var(--accent);color:#16110a}\n  .bit{margin:0 3px 12px;display:flex;border:1px solid rgba(255,255,255,.18);border-radius:4px;overflow:hidden;background:rgba(0,0,0,.35);cursor:pointer;padding:0;font:inherit;align-self:center}\n  .bit span{padding:4px 7px;font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.05em}\n  .bit .bit-a{background:rgba(255,255,255,.1);color:var(--ink)}\n  .bit.on .bit-a{background:transparent;color:var(--muted)}\n  .bit.on .bit-b{background:rgba(255,255,255,.1);color:var(--accent)}\n  .tog{border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:var(--ink);font:700 10px/1 inherit;padding:7px 9px;border-radius:5px;cursor:pointer;letter-spacing:.05em;margin:0 3px 12px;align-self:center}\n  .tog.on{background:var(--accent);border-color:var(--accent);color:#16110a}\n<\/style>\n<script>window.vstai={onReady:function(f){f()},setParam:function(i,v){parent.postMessage({t:\"p\",i:i,v:v},\"*\")},noteOn:function(n,v){parent.postMessage({t:\"on\",id:n,v:v},\"*\")},noteOff:function(id){parent.postMessage({t:\"off\",id:id},\"*\")}};<\/script><\/head>\n<body>\n<div id=\"fit\"><div class=\"unit\" id=\"u\"><\/div><\/div>\n<script>\n/* =====================================================================\n   drums/ui/kit.js — shared panel components for the drum machines.\n   Inlined into every gui.html by build.mjs (a plugin GUI is one file).\n\n   Contract with the host (src/BridgeShim.h):\n     · window.vstai.setParam(i, v) sends ACTUAL values (spec min..max).\n     · on ready, every param's current value is pushed once;\n     · window.vstai.onParam(cb) repaints controls when the DAW / a restored\n       session changes a value — draw only, never push back;\n     · window.vstai.onDisplay(cb) delivers the engine's 16 display floats.\n   ===================================================================== */\nvar Kit = (function () {\n  var PD = {};            // index -> {name,min,max,def,step}\n  var vals = {};\n  var listeners = {};\n  var displayFns = [];\n\n  function has(fn) { return window.vstai && typeof window.vstai[fn] === \"function\"; }\n  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }\n  function el(tag, cls, parent, text) {\n    var e = document.createElement(tag);\n    if (cls) e.className = cls;\n    if (text != null) e.textContent = text;\n    if (parent) parent.appendChild(e);\n    return e;\n  }\n  function svg(tag, attrs, parent) {\n    var e = document.createElementNS(\"http://www.w3.org/2000/svg\", tag);\n    for (var k in attrs) e.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(e);\n    return e;\n  }\n\n  function define(list) {\n    list.forEach(function (p) { PD[p.index] = p; vals[p.index] = p.def; });\n  }\n  function get(i) { return vals[i]; }\n  function norm(i) { var p = PD[i]; return (vals[i] - p.min) / ((p.max - p.min) || 1); }\n  function quant(i, v) {\n    var p = PD[i];\n    v = clamp(v, p.min, p.max);\n    if (p.step) v = Math.round((v - p.min) / p.step) * p.step + p.min;\n    return v;\n  }\n  function notify(i) { var ls = listeners[i]; if (ls) for (var j = 0; j < ls.length; j++) ls[j](vals[i]); }\n  // User change: store, send to the engine, repaint.\n  function set(i, v) {\n    v = quant(i, v);\n    if (v === vals[i]) return;\n    vals[i] = v;\n    if (has(\"setParam\")) window.vstai.setParam(+i, v);\n    notify(i);\n  }\n  function listen(i, fn) { (listeners[i] = listeners[i] || []).push(fn); fn(vals[i]); }\n  function onDisplay(fn) { displayFns.push(fn); }\n\n  function ready() {\n    for (var i in vals) if (has(\"setParam\")) window.vstai.setParam(+i, vals[i]);\n    if (has(\"onParam\")) window.vstai.onParam(function (i, v) {\n      if (!(i in PD)) return;\n      vals[i] = quant(i, +v);\n      notify(i);\n    });\n    if (has(\"onDisplay\")) window.vstai.onDisplay(function (d) {\n      for (var j = 0; j < displayFns.length; j++) { try { displayFns[j](d); } catch (e) {} }\n    });\n  }\n  function start() { if (has(\"onReady\")) window.vstai.onReady(ready); else ready(); }\n\n  function note(n, vel) {\n    if (!has(\"noteOn\")) return;\n    window.vstai.noteOn(n, vel == null ? 0.7 : vel);\n    setTimeout(function () { if (has(\"noteOff\")) window.vstai.noteOff
