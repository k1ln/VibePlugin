<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism Shift</title>
<style>
:root{--a:#ff9ecf;--a2:#ffd479;--bg0:#0a0610;--bg1:#170d24;--ink:#fbeef6;--dim:#9c8aa8;--panel:rgba(30,18,44,.62);--stroke:rgba(255,158,207,.17);--track:rgba(255,158,207,.13);--knob:#231433}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg0);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas{display:block}
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:18px 20px 22px}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
header.top .mark{width:40px;height:40px;flex:0 0 auto;filter:drop-shadow(0 0 8px var(--a))}
header.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.12em;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .sub{margin-top:3px;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
header.top .grow{flex:1}
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:12px 12px 8px;position:relative;backdrop-filter:blur(10px)}
.card>.ttl{position:absolute;top:-7px;left:14px;padding:0 7px;font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--a);background:var(--bg0);border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:2px 4px;justify-content:center;align-items:flex-start}
.knob{width:76px;text-align:center;padding:2px 0 4px;touch-action:none}
.knob svg{display:block;margin:0 auto;cursor:ns-resize;touch-action:none}
.knob .nm{margin-top:1px;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.knob .vl{font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:1px;min-height:13px}
.knob:hover .nm,.knob.drag .nm{color:var(--a)}
.knob .trk{stroke:var(--track);fill:none}
.knob .arc{stroke:var(--a);fill:none;filter:drop-shadow(0 0 3px var(--a))}
.knob .body{fill:var(--knob);stroke:rgba(255,255,255,.07)}
.knob .cap{fill:rgba(255,255,255,.05)}
.knob .ptr{stroke:var(--a2);stroke-linecap:round}
.knob .dot{fill:var(--a)}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.seg button.opt,button.btn{font:inherit;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 8px;cursor:pointer;transition:all .12s}
.seg button.opt:hover,button.btn:hover{color:var(--ink)}
.seg button.opt.on{color:#0b0b12;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 0 10px -2px var(--a);font-weight:700}
button.btn{border-color:var(--stroke);background:rgba(255,255,255,.03)}
button.btn.on{color:#0b0b12;background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;font-weight:700;box-shadow:0 0 14px -2px var(--a)}
.lbl{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 4px 2px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper .v{min-width:56px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.stepper button{width:22px;height:22px;padding:0;font-size:13px;line-height:1;border-radius:6px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer}
.stepper button:hover{border-color:var(--a);color:var(--a)}
.hint{margin-top:10px;text-align:center;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:.6}

.stage{position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(1000px 560px at 15% -10%,rgba(255,158,207,.15),transparent 60%),radial-gradient(900px 600px at 95% 100%,rgba(127,227,255,.11),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0) 70%)}
.hero{padding:0;overflow:hidden;border-radius:18px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;margin:0 0 14px}
.bar .grp{display:flex;flex-direction:column}
.voices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.voices .card{padding:12px 6px 6px}
.voices .ivrow{display:flex;justify-content:center;margin:4px 0 2px}
.voices .row{gap:0 0}
.voices .knob{width:68px}
.glob{margin-top:16px}
.glob .row{justify-content:space-between}
.lockw{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px}
@media (max-width:860px){.voices{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.voices{grid-template-columns:1fr}}
.dotv{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--a);margin-right:6px;box-shadow:0 0 8px var(--a)}
</style>
</head>
<body>
<div class="stage">
  <div class="wrap">
    <header class="top">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 5L44 41H4Z" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>
        <path d="M2 26L18 24" stroke="#fff" stroke-width="2"/>
        <path d="M30 26L46 14" stroke="#ff9ecf" stroke-width="2"/><path d="M30 28L46 24" stroke="#ffd479" stroke-width="2"/><path d="M30 30L46 34" stroke="#7fe3ff" stroke-width="2"/><path d="M29 32L45 44" stroke="#b79cff" stroke-width="2"/>
      </svg>
      <div><h1>PRISM SHIFT</h1><div class="sub">pitch-tracking granular harmonizer</div></div>
      <div class="grow"></div>
      <div id="modeSlot"></div>
    </header>
    <div class="bar">
      <div class="grp"><div class="lbl">key</div><div id="keySlot"></div></div>
      <div class="grp"><div class="lbl">scale</div><div id="scaleSlot"></div></div>
    </div>
    <div class="card hero" id="hero"></div>
    <div class="voices" id="voices"></div>
    <div class="card glob" id="glob"><div class="ttl">engine</div></div>
    <div class="hint">the keyboard previews a demo melody through your current settings &middot; drag knobs vertically &middot; double-click = reset</div>
  </div>
</div>
<script>
var VS = (function () {
  "use strict";
  var defs = {}, vals = {}, listeners = {};
  function define(list) {
    for (var k = 0; k < list.length; k++) {
      var p = list[k];
      defs[p.index] = { i: p.index, name: p.name, min: p.min, max: p.max, def: p.default, step: p.step || 0 };
      vals[p.index] = p.default;
    }
  }
  function v(i) { return vals[i]; }
  function fire(i) { var l = listeners[i]; if (l) for (var k = 0; k < l.length; k++) l[k](); }
  function listen(i, f) { (listeners[i] = listeners[i] || []).push(f); }
  function clampv(i, x) {
    var d = defs[i]; x = Math.max(d.min, Math.min(d.max, x));
    if (d.step) x = Math.round(x / d.step) * d.step;
    return x;
  }
  function push(i, x) {
    x = clampv(i, +x); vals[i] = x;
    if (window.vstai && typeof window.vstai.setParam === "function") window.vstai.setParam(i, x);
    fire(i);
  }
  function el(tag, cls, parent, txt) {
    var e = document.createElement(tag); if (cls) e.className = cls;
    if (txt != null) e.textContent = txt; if (parent) parent.appendChild(e); return e;
  }
  var NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e); return e;
  }
  function polar(cx, cy, r, deg) { var a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  function arc(cx, cy, r, d0, d1) {
    if (Math.abs(d1 - d0) < 0.05) d1 = d0 + 0.05;
    var lo = Math.min(d0, d1), hi = Math.max(d0, d1);
    var p0 = polar(cx, cy, r, lo), p1 = polar(cx, cy, r, hi);
    return "M" + p0[0].toFixed(2) + " " + p0[1].toFixed(2) + " A" + r + " " + r + " 0 " + ((hi - lo) > 180 ? 1 : 0) + " 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2);
  }

  // ---- knob ----
  function knob(parent, idx, opts) {
    opts = opts || {};
    var d = defs[idx], size = opts.size || 60;
    var bipolar = d.min < 0 && d.max > 0 && opts.center !== false;
    var box = el("div", "knob", parent);
    var s = svgEl("svg", { viewBox: "0 0 100 100", width: size, height: size }, box);
    var A0 = -135, A1 = 135;
    svgEl("path", { "class": "trk", d: arc(50, 50, 41, A0, A1), "stroke-width": 6, "stroke-linecap": "round" }, s);
    var av = svgEl("path", { "class": "arc", d: "", "stroke-width": 6, "stroke-linecap": "round" }, s);
    svgEl("circle", { "class": "body", cx: 50, cy: 50, r: 28 }, s);
    svgEl("circle", { "class": "cap", cx: 50, cy: 43, r: 26 }, s);
    var ptr = svgEl("line", { "class": "ptr", x1: 50, y1: 50, x2: 50, y2: 30, "stroke-width": 4 }, s);
    svgEl("circle", { "class": "dot", cx: 50, cy: 50, r: 3 }, s);
    var nm = el("div", "nm", box, opts.label || d.name);
    var vl = el("div", "vl", box);
    var fmt = opts.fmt || function (x) { return (Math.round(x * 100) / 100) + ""; };
    function paint() {
      var x = vals[idx], t = (x - d.min) / (d.max - d.min);
      t = Math.max(0, Math.min(1, t));
      var deg = A0 + t * (A1 - A0), t0 = bipolar ? A0 + 0.5 * (A1 - A0) : A0;
      av.setAttribute("d", arc(50, 50, 41, t0, deg));
      var tip = polar(50, 50, 21, deg);
      ptr.setAttribute("x2", tip[0].toFixed(2)); ptr.setAttribute("y2", tip[1].toFixed(2));
      vl.textContent = fmt(x);
    }
    listen(idx, paint); paint();
    var drag = false, lastY = 0;
    s.addEventListener("pointerdown", function (e) {
      drag = true; lastY = e.clientY; box.classList.add("drag");
      try { s.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    });
    s.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var dy = lastY - e.clientY; lastY = e.clientY;
      var span = d.max - d.min, sens = d.step ? d.step / 8 : span / 170;
      var cur = acc[idx] == null ? vals[idx] : acc[idx];
      cur = Math.max(d.min, Math.min(d.max, cur + dy * sens * (e.shiftKey ? 0.2 : 1)));
      acc[idx] = cur; push(idx, cur);
    });
    function end() { drag = false; acc[idx] = null; box.classList.remove("drag"); }
    s.addEventListener("pointerup", end); s.addEventListener("pointercancel", end);
    s.addEventListener("dblclick", function () { push(idx, d.def); });
    s.addEventListener("wheel", function (e) {
      var span = d.max - d.min, st = d.step || span * 0.02;
      push(idx, vals[idx] - Math.sign(e.deltaY) * st); e.preventDefault();
    }, { passive: false });
    return box;
  }
  var acc = {};

  // ---- segmented selector (values min..min+n-1) ----
  function seg(parent, idx, labels, cls) {
    var d = defs[idx], box = el("div", "seg" + (cls ? " " + cls : ""), parent), btns = [];
    labels.forEach(function (lb, k) {
      var b = el("button", "opt", box, lb); b.type = "button";
      b.addEventListener("click", function () { push(idx, d.min + k); });
      btns.push(b);
    });
    function paint() { var cur = Math.round(vals[idx] - d.min); btns.forEach(function (b, k) { b.classList.toggle("on", k === cur); }); }
    listen(idx, paint); paint(); return box;
  }
  function toggle(parent, idx, label, cls) {
    var b = el("button", "btn " + (cls || ""), parent, label); b.type = "button";
    b.addEventListener("click", function () { push(idx, vals[idx] >= 0.5 ? 0 : 1); });
    function paint() { b.classList.toggle("on", vals[idx] >= 0.5); }
    listen(idx, paint); paint(); return b;
  }
  function stepper(parent, idx, fmt, alsoIdx) {
    var box = el("div", "stepper", parent), m = el("button", "", box, "−"), lab = el("div", "v", box), p = el("button", "", box, "+");
    m.type = "button"; p.type = "button";
    m.addEventListener("click", function () { push(idx, vals[idx] - 1); });
    p.addEventListener("click", function () { push(idx, vals[idx] + 1); });
    function paint() { lab.textContent = fmt ? fmt(vals[idx]) : vals[idx]; }
    listen(idx, paint); if (alsoIdx != null) listen(alsoIdx, paint); paint(); return box;
  }

  function boot(build, loop) {
    function ready() {
      build();
      for (var i in vals) if (window.vstai && window.vstai.setParam) window.vstai.setParam(+i, vals[i]);
      if (window.vstai && window.vstai.onParam) window.vstai.onParam(function (i, x) {
        if (!(i in vals)) return; vals[i] = +x; fire(i);
      });
      if (loop) { var last = 0; (function frame(t) { var dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t; try { loop(t / 1000, dt); } catch (e) { console.error(e); } requestAnimationFrame(frame); })(0); }
    }
    if (window.vstai && typeof window.vstai.onReady === "function") window.vstai.onReady(ready); else ready();
  }

  // canvas helper: crisp DPR-aware sizing; returns {c,ctx,w(),h()}
  function canvas(parent, h) {
    var c = el("canvas", "", parent); c.style.width = "100%"; c.style.height = h + "px";
    var ctx = c.getContext("2d"), W = 1, H = h, dpr = 1;
    function fit() { dpr = Math.min(2, window.devicePixelRatio || 1); W = Math.max(1, c.clientWidth); c.width = Math.floor(W * dpr); c.height = Math.floor(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    fit(); window.addEventListener("resize", fit);
    return { c: c, ctx: ctx, w: function () { return c.clientWidth || W; }, h: function () { return H; }, fit: fit };
  }
  return { define: define, v: v, push: push, listen: listen, el: el, svgEl: svgEl, knob: knob, seg: seg, toggle: toggle, stepper: stepper, boot: boot, canvas: canvas, defs: defs };
})();

</script>
<script>
(function () {
  "use strict";
  VS.define([{"name":"Mode","index":0,"min":0,"max":1,"default":1,"step":1},{"name":"Key","index":1,"min":0,"max":11,"default":0,"step":1},{"name":"Scale","index":2,"min":0,"max":7,"default":0,"step":1},{"name":"Correct","index":3,"min":0,"max":1,"default":0},{"name":"Main","index":4,"min":0,"max":1.5,"default":0},{"name":"Dry","index":5,"min":0,"max":1.5,"default":0.8},{"name":"Size","index":6,"min":0,"max":1,"default":0.5},{"name":"Glide","index":7,"min":0,"max":1,"default":0.15},{"name":"Lock","index":8,"min":0,"max":1,"default":1,"step":1},{"name":"Humanize","index":9,"min":0,"max":1,"default":0.25},{"name":"Feedback","index":10,"min":0,"max":1,"default":0},{"name":"Tracking","index":11,"min":0,"max":1,"default":0.5},{"name":"Level","index":12,"min":0,"max":1.5,"default":0.9},{"name":"V1 Level","index":13,"min":0,"max":1,"default":0.7},{"name":"V1 Interval","index":14,"min":-12,"max":12,"default":2,"step":1},{"name":"V1 Fine","index":15,"min":-50,"max":50,"default":0},{"name":"V1 Pan","index":16,"min":-1,"max":1,"default":-0.6},{"name":"V1 Delay","index":17,"min":0,"max":1,"default":0.05},{"name":"V2 Level","index":18,"min":0,"max":1,"default":0.6},{"name":"V2 Interval","index":19,"min":-12,"max":12,"default":4,"step":1},{"name":"V2 Fine","index":20,"min":-50,"max":50,"default":0},{"name":"V2 Pan","index":21,"min":-1,"max":1,"default":0.6},{"name":"V2 Delay","index":22,"min":0,"max":1,"default":0.1},{"name":"V3 Level","index":23,"min":0,"max":1,"default":0.4},{"name":"V3 Interval","index":24,"min":-12,"max":12,"default":-7,"step":1},{"name":"V3 Fine","index":25,"min":-50,"max":50,"default":0},{"name":"V3 Pan","index":26,"min":-1,"max":1,"default":-0.2},{"name":"V3 Delay","index":27,"min":0,"max":1,"default":0},{"name":"V4 Level","index":28,"min":0,"max":1,"default":0},{"name":"V4 Interval","index":29,"min":-12,"max":12,"default":7,"step":1},{"name":"V4 Fine","index":30,"min":-50,"max":50,"default":0},{"name":"V4 Pan","index":31,"min":-1,"max":1,"default":0.2},{"name":"V4 Delay","index":32,"min":0,"max":1,"default":0}]);
  var P = { MODE:0, KEY:1, SCALE:2, CORR:3, MAIN:4, DRY:5, SIZE:6, GLIDE:7, LOCK:8, HUM:9, FB:10, TRACK:11, LEVEL:12, V0:13 };
  var SCN = [7, 7, 7, 7, 7, 7, 7, 5];
  var SC = [[0,2,4,5,7,9,11],[0,2,3,5,7,8,10],[0,2,3,5,7,9,10],[0,2,4,5,7,9,10],[0,2,4,6,7,9,11],[0,1,3,5,7,8,10],[0,2,3,5,7,8,11],[0,3,5,7,10]];
  var NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var VCOL = ["#ff9ecf", "#ffd479", "#7fe3ff", "#b79cff"];
  function pct(x) { return Math.round(x * 100) + "%"; }

  // same ladder maths as the DSP
  function ladder(idx, key, sc) {
    var n = SCN[sc], o = Math.floor(idx / n), k = idx - o * n;
    return key + o * 12 + SC[sc][k];
  }
  function nearestIdx(m, key, sc) {
    var n = SCN[sc], o = Math.floor((m - key) / 12), best = o * n, bd = 1e9;
    for (var i = (o - 1) * n; i < (o + 2) * n; i++) { var d = Math.abs(ladder(i, key, sc) - m); if (d < bd) { bd = d; best = i; } }
    return best;
  }
  function ordName(n) { return n === 1 ? "Unison" : n === 8 ? "Octave" : n + (n === 2 ? "nd" : n === 3 ? "rd" : "th"); }
  function ivName(x) {
    x = Math.round(x);
    if (VS.v(P.MODE) >= 0.5) { if (x === 0) return "Unison"; return ordName(Math.abs(x) + 1) + (x > 0 ? " ↑" : " ↓"); }
    return (x > 0 ? "+" : "") + x + " st";
  }

  function build() {
    VS.seg(document.getElementById("modeSlot"), P.MODE, ["Chromatic", "Diatonic"]);
    VS.seg(document.getElementById("keySlot"), P.KEY, NAMES);
    VS.seg(document.getElementById("scaleSlot"), P.SCALE, ["Major", "Minor", "Dorian", "Mixo", "Lydian", "Phryg", "Harm min", "Pent min"]);
    var cv = VS.canvas(document.getElementById("hero"), 270);

    var vbox = document.getElementById("voices");
    for (var v = 0; v < 4; v++) {
      (function (v) {
        var b = P.V0 + v * 5;
        var c = VS.el("div", "card", vbox); c.style.setProperty("--a", VCOL[v]); c.style.setProperty("--a2", VCOL[v]);
        var t = VS.el("div", "ttl", c); t.innerHTML = '<span class="dotv"></span>voice ' + (v + 1);
        var ir = VS.el("div", "ivrow", c); ir.style.paddingTop = "6px";
        VS.stepper(ir, b + 1, ivName, P.MODE);
        var r = VS.el("div", "row", c);
        VS.knob(r, b, { fmt: pct, label: "Level", size: 50 });
        VS.knob(r, b + 2, { fmt: function (x) { return (x > 0 ? "+" : "") + Math.round(x) + " ct"; }, label: "Fine", size: 50 });
        VS.knob(r, b + 3, { fmt: function (x) { return Math.abs(x) < 0.04 ? "C" : (x < 0 ? "L" : "R") + Math.round(Math.abs(x) * 100); }, label: "Pan", size: 50 });
        VS.knob(r, b + 4, { fmt: function (x) { return Math.round(x * 300) + " ms"; }, label: "Delay", size: 50 });
      })(v);
    }
    var g = document.getElementById("glob");
    var gr = VS.el("div", "row", g); gr.style.paddingTop = "6px";
    VS.knob(gr, P.CORR, { fmt: function (x) { return x < 0.03 ? "natural" : pct(x); } });
    VS.knob(gr, P.MAIN, { fmt: pct, label: "Main (tuned)" });
    VS.knob(gr, P.DRY, { fmt: pct });
    VS.knob(gr, P.SIZE, { fmt: function (x) { return Math.round(15 * Math.pow(8, x)) + " ms"; }, label: "Grain" });
    VS.knob(gr, P.GLIDE, { fmt: function (x) { var m = x * x * 500; return m < 1 ? "off" : Math.round(m) + " ms"; } });
    VS.knob(gr, P.HUM, { fmt: pct, label: "Humanize" });
    VS.knob(gr, P.FB, { fmt: pct });
    VS.knob(gr, P.TRACK, { fmt: pct, label: "Tracking" });
    VS.knob(gr, P.LEVEL, { fmt: function (x) { return (x <= 0.001 ? "-inf" : (20 * Math.log10(x)).toFixed(1)) + " dB"; }, label: "Out" });
    var lw = VS.el("div", "lockw", gr); VS.toggle(lw, P.LOCK, "Lock"); VS.el("div", "lbl", lw, "period-locked").style.marginTop = "5px";

    // ---------------------------------------------------------------- viz
    var ctx = cv.ctx;
    var LOW = 48, HIGH = 83; // C3..B5
    var melody = [0, 2, 4, 3, 2, 1, 4, 5, 4, 2, 0, -1, 1, 2, 3, 1], mi = 0, mt = 0.0;
