<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Colossus — test bench</title><style>
  :root{--ac:#ff5a2a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:13px ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e7eef6;
    background:radial-gradient(130% 100% at 50% -20%,#171f2d,#070a0f 72%);display:flex;flex-direction:column;align-items:center;gap:13px;padding:18px}
  .top{display:flex;align-items:center;gap:11px;width:100%;max-width:1000px}
  .top .led{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
  .top b{font-size:15px;letter-spacing:.05em;color:var(--ac)}
  .top .sub{font-size:11px;color:#7c8aa3;margin-left:auto}
  iframe{width:100%;max-width:1000px;height:600px;border:0;background:transparent;display:block}
  .bar{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:11px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px 16px;
    box-shadow:0 16px 40px rgba(0,0,0,.4)}
  canvas{width:100%;height:74px;display:block;border-radius:10px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.06)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{font:inherit;color:#06080c;background:var(--ac);border:0;border-radius:10px;padding:9px 17px;font-weight:800;cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}
  button.off{background:#28313f;color:#e7eef6}
  select,input[type=file]{font:inherit;color:#e7eef6;background:#10151e;border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:7px 9px}
  label{display:flex;gap:8px;align-items:center;color:#aeb9cc}
  .st{font-size:12px;color:#8da0bd;min-height:16px}
  .krow{display:flex;gap:8px;align-items:center;color:#aeb9cc;font-size:12px}
  .krow .klabel{font-weight:600;letter-spacing:.03em}
  .krow .oct{padding:4px 13px;font-size:16px;line-height:1;background:#28313f;color:#e7eef6;border-radius:8px}
  .krow .octval{min-width:22px;text-align:center;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
  .krow .khint{margin-left:4px;color:#7c8aa3;font-size:11px}
  .kb{display:flex;gap:3px;flex-wrap:wrap}
  .kb .key{width:30px;height:80px;border-radius:0 0 7px 7px;background:linear-gradient(#f4f7fb,#cdd5e0);
    border:1px solid #2a3344;cursor:pointer;color:#1a2230;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;transition:.08s}
  .kb .key.bk{background:linear-gradient(#2b3340,#10151d);color:#9fb0c8;height:52px;width:22px;margin:0 -12px;z-index:2}
  .kb .key.dn{background:linear-gradient(var(--ac),#fff);color:#06080c;transform:translateY(2px)}
  </style></head><body>

  gf.srcdoc="<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Colossus<\/title>\n<style>\n  :root{ --bg:#070506; --line:#2e1d1c; --ink:#f4e9e4; --ink2:#b69a92; --muted:#6f5752; --ember:#ff5a2a; --ember2:#ffb38a; --accent:#ff5a2a; }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.35 \"Helvetica Neue\",Helvetica,Arial,sans-serif;overflow:hidden;user-select:none}\n  #fit{position:absolute;left:0;top:0;transform-origin:0 0}\n  .inst{width:1060px;padding:16px 18px;border-radius:12px;background:radial-gradient(900px 300px at 50% -20%,#4a1712 0%,#1a0b0a 50%,#0b0606 100%);box-shadow:0 0 0 1px #000,inset 0 1px 0 rgba(255,160,120,.08)}\n  .top{display:flex;align-items:flex-end;gap:16px;margin-bottom:12px}\n  .brand b{display:block;font-size:34px;letter-spacing:.3em;font-weight:900;color:#fff;text-shadow:0 0 22px rgba(255,90,42,.45)}\n  .brand span{display:block;font-size:10px;letter-spacing:.34em;color:var(--ink2);text-transform:uppercase;margin-top:4px}\n  .row{display:flex;gap:10px;align-items:stretch;margin-bottom:10px}\n  .row > .grp{flex:1 1 auto}\n  .grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(0,0,0,.3)}\n  .gt{font-size:9.5px;letter-spacing:.26em;color:var(--ink2);text-transform:uppercase;margin-bottom:6px}\n  .knobs{display:flex;gap:2px;flex-wrap:wrap;align-items:flex-end}\n  .k-wrap{display:flex;flex-direction:column;align-items:center;width:62px}\n  .k{cursor:ns-resize;display:block;touch-action:none}\n  .k-tick{stroke:#553430;stroke-width:3}\n  .k-skirt{fill:#0a0505;stroke:#4a2a26;stroke-width:2}\n  .k-cap{fill:#1d1110}\n  .k-needle{stroke:var(--ember2);stroke-width:7;stroke-linecap:round}\n  .k-label{font-size:9px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase;margin-top:1px;text-align:center}\n  .k-val{font-size:9.5px;color:var(--ember);min-height:11px}\n  .k-wrap.big{width:78px}\n  .sel{display:flex;flex-direction:column}\n  .sel-label{font-size:9px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;margin-bottom:4px}\n  .sel-row{display:flex;border:1px solid #4a2a26;border-radius:6px;overflow:hidden;flex-wrap:wrap}\n  .sel-btn{border:0;background:rgba(0,0,0,.4);color:#c9aba2;font:700 10px/1 inherit;padding:7px 9px;cursor:pointer;border-right:1px solid #2e1d1c}\n  .sel-btn:last-child{border-right:0}\n  .sel-btn.on{background:var(--ember);color:#1a0703}\n  .tog{border:1px solid #4a2a26;background:rgba(0,0,0,.4);color:var(--ink);font:800 11px/1 inherit;padding:10px 16px;border-radius:6px;cursor:pointer;letter-spacing:.2em}\n  .tog.on{background:var(--ember);border-color:var(--ember2);color:#1a0703;box-shadow:0 0 18px rgba(255,90,42,.5)}\n  .steps{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-top:8px}\n  .st{height:30px;border-radius:4px;background:#1a0f0e;border:1px solid #2e1d1c;position:relative}\n  .st.hit{background:#5a221a} .st.acc{background:#a8371f}\n  .st.now{box-shadow:0 0 0 2px #fff inset}\n  .st.off{opacity:.25}\n  .foot{color:var(--muted);font-size:10px;line-height:1.45}\n  .meter{width:12px;height:60px;border-radius:3px;background:#120807;position:relative;overflow:hidden;border:1px solid #2e1d1c;align-self:center}\n  .meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#7a2414,var(--ember2))}\n<\/style>\n<script>window.vstai={onReady:function(f){f()},setParam:function(i,v){parent.postMessage({t:\"p\",i:i,v:v},\"*\")},noteOn:function(n,v){parent.postMessage({t:\"on\",id:n,v:v},\"*\")},noteOff:function(id){parent.postMessage({t:\"off\",id:id},\"*\")}};<\/script><\/head>\n<body>\n<div id=\"fit\"><div class=\"inst\" id=\"u\"><\/div><\/div>\n<script>\n/* =====================================================================\n   drums/ui/kit.js — shared panel components for the drum machines.\n   Inlined into every gui.html by build.mjs     } else { running=false; this.textContent='▶ Start audio'; this.className='off'; disconnectSrc(); st('stopped'); }
  });
  
  var KB=document.getElementById('kb'), KEYS=[['C',60,0],['C#',61,1],['D',62,0],['D#',63,1],['E',64,0],['F',65,0],['F#',66,1],['G',67,0],['G#',68,1],['A',69,0],['A#',70,1],['B',71,0],['C',72,0],['C#',73,1],['D',74,0]];
  var KMAP={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,o:73,l:74};
  var oct=0;                                              // octave offset (−4..+4), applied at note-on
  function hz(m){return 440*Math.pow(2,(m-69)/12);}
  function setOct(o){ oct=o<-4?-4:(o>4?4:o); var ov=document.getElementById('octval'); if(ov)ov.textContent=(4+oct); }
  function down(m,el){ ensure().then(function(){ if(ctx.state==='suspended')ctx.resume(); if(ex&&ex.noteOn) ex.noteOn(m,hz(m),0.9); }); if(el)el.classList.add('dn'); }
  function up(m,el){ if(ex&&ex.noteOff) ex.noteOff(m); if(el)el.classList.remove('dn'); }
  KEYS.forEach(function(k){ var el=document.createElement('div'); el.className='key'+(k[2]?' bk':''); el.textContent=k[0];
    el.addEventListener('pointerdown',function(e){e.preventDefault();el._n=k[1]+oct*12;down(el._n,el);});
    el.addEventListener('pointerup',function(){up(el._n,el);}); el.addEventListener('pointerleave',function(){if(el.classList.contains('dn'))up(el._n,el);});
    KB.appendChild(el); });
  document.getElementById('octdn').addEventListener('click',function(){setOct(oct-1);});
  document.getElementById('octup').addEventListener('click',function(){setOct(oct+1);});
  var held={};                                            // base note -> actual note played (so releases survive an octave change)
  window.addEventListener('keydown',function(e){ if(e.repeat)return;
    if(e.key==='z'||e.key==='Z'){setOct(oct-1);return;} if(e.key==='x'||e.key==='X'){setOct(oct+1);return;}
    var b=KMAP[e.key]; if(b&&!held[b]){var m=b+oct*12;held[b]=m;down(m,null);} });
  window.addEventListener('keyup',function(e){ var b=KMAP[e.key]; if(b&&held[b]!=null){up(held[b],null);held[b]=null;} });
  setOct(0);
  
  </script></body></html>
