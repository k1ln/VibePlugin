<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duo Synth — test bench</title><style>
  :root{--ac:#e8a33d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:13px ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e7eef6;
    background:radial-gradient(130% 100% at 50% -20%,#171f2d,#070a0f 72%);display:flex;flex-direction:column;align-items:center;gap:13px;padding:18px}
  .top{display:flex;align-items:center;gap:11px;width:100%;max-width:1000px}
  .top .led{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
  .top b{font-size:15px;letter-spacing:.05em;color:var(--ac)}
  .top .sub{font-size:11px;color:#7c8aa3;margin-left:auto}
  iframe{width:100%;max-width:1000px;height:600px;border:0;background:transparent;display:block}
  .bar{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:11px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px 16px;
    box-shadow:0 16px 40px rgba(0,0,0,.4)}
  canvas{width:100%;height:74px;display:block;border-radius:10px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.06)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{font:inherit;color:#06080c;background:var(--ac);border:0;border-radius:10px;padding:9px 17px;font-weight:800;cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}
  button.off{background:#28313f;color:#e7eef6}
  select,input[type=file]{font:inherit;color:#e7eef6;background:#10151e;border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:7px 9px}
  label{display:flex;gap:8px;align-items:center;color:#aeb9cc}
  .st{font-size:12px;color:#8da0bd;min-height:16px}
  .krow{display:flex;gap:8px;align-items:center;color:#aeb9cc;font-size:12px}
  .krow .klabel{font-weight:600;letter-spacing:.03em}
  .krow .oct{padding:4px 13px;font-size:16px;line-height:1;background:#28313f;color:#e7eef6;border-radius:8px}
  .krow .octval{min-width:22px;text-align:center;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
  .krow .khint{margin-left:4px;color:#7c8aa3;font-size:11px}
  .kb{display:flex;gap:3px;flex-wrap:wrap}
  .kb .key{width:30px;height:80px;border-radius:0 0 7px 7px;background:linear-gradient(#f4f7fb,#cdd5e0);
    border:1px solid #2a3344;cursor:pointer;color:#1a2230;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;transition:.08s}
  .kb .key.bk{background:linear-gradient(#2b3340,#10151d);color:#9fb0c8;height:52px;width:22px;margin:0 -12px;z-index:2}
  .kb .key.dn{background:linear-gradient(var(--ac),#fff);color:#06080c;transform:translateY(2px)}
  </style></head><body>

  gf.srcdoc="<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Duo Synth<\/title>\n<style>\n  :root{ --ac:#e8a33d; --ac2:#f0c674; --ink:#e9ecef; --lgnd:#c9ccd1; --pnl1:#232427; --pnl2:#141517; --gold:#caa14a; }\n  *{box-sizing:border-box; -webkit-user-select:none; user-select:none}\n  html,body{margin:0;min-height:100%}\n  body{font:11px/1.3 ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;color:var(--ink);\n    background:radial-gradient(120% 90% at 50% -10%,#1c1d20 0%,#090a0b 68%,#040405 100%);\n    display:flex;align-items:flex-start;justify-content:center;padding:14px 6px}\n  .box{max-width:1320px;width:100%;border-radius:9px;overflow:hidden;\n    background:linear-gradient(180deg,#101113,#0a0a0c);\n    box-shadow:0 26px 60px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);\n    border:1px solid #000}\n  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 16px 7px;\n    background:linear-gradient(180deg,#1a1b1e,#0d0e10);border-bottom:2px solid #000}\n  .brand{display:flex;flex-direction:column;gap:1px;min-width:210px}\n  .brand .r{font-size:8.5px;letter-spacing:.30em;font-weight:700;color:var(--ac);text-transform:uppercase}\n  .brand .n{font-size:26px;font-weight:800;font-style:italic;letter-spacing:.01em;color:#f3f4f6;line-height:.95}\n  .brand .n b{color:var(--ac)}\n  .brand .s{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#8b9096}\n  .led{margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac);align-self:center}\n  .rack{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;padding:8px 12px 14px}\n  .sec{display:flex;flex-direction:column;gap:5px;background:linear-gradient(180deg,#26272b,#191a1d);border-radius:6px;padding:6px 8px 8px;\n    border:1px solid #050506;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}\n  .sec .h{font-size:8px;letter-spacing:.12em;font-weight:800;color:var(--ac);text-transform:uppercase;text-align:center;white-space:nowrap}\n  .sec.mod{border:1px solid rgba(232,163,61,.35)}\n  .sec.mod .h{color:var(--ac2)}\n  .row{display:flex;gap:6px;align-items:flex-end}\n  /* vertical fader */\n  .fd{display:flex;flex-direction:column;align-items:center;gap:3px;width:30px}\n  .fd .track{width:9px;height:92px;border-radius:5px;position:relative;cursor:ns-resize;touch-action:none;\n    background:linear-gradient(90deg,#0c0d0f,#242629 55%,#0c0d0f);border:1px solid #000;\n    box-shadow:inset 0 0 3px rgba(0,0,0,.8)}\n  .fd .mid{position:absolute;left:-3px;right:-3px;top:50%;height:1px;background:rgba(255,255,255,.14)}\n  .fd .cap{position:absolute;left:50%;width:22px;height:14px;margin-left:-11px;border-radius:3px;\n    background:linear-gradient(180deg,#4a4d52,#1a1c1f);border:1px solid #000;\n    box-shadow:0 2px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.22)}\n  .fd .cap:after{content:\"\";position:absolute;left:2px;right:2px;top:50%;height:2px;margin-top:-1px;background:var(--ac2);border-radius:1px}\n  .fd .lb{font-size:7px;letter-spacing:.01em;color:var(--lgnd);text-transform:uppercase;font-weight:700;text-align:center;line-height:1.05;min-height:15px}\n  /* rotary knob (controllers) */\n  .kn{display:flex;flex-direction:column;align-items:center;gap:3px;width:44px}\n  .kn .dial{width:34px;height:34px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;\n    background:radial-gradient(60% 60% at 40% 32%,#46494e,#191a1d 74%,#0b0c0e);\n    border:2px solid #050506;box-shadow:0 2px 5px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.16)}\n  .kn .notch{position:absolute;left:50%;top:3px;width:2.5px;height:12px;margin-left:-1.25px;\n    background:var(--ac2);border-radius:2px;transform-origin:50% 14px;box-shadow:0 0 5px rgba(240,198,116,.8)}\n  .kn .lb{font-size:7px;color:var(--lgnd);text-transform:uppercase;font-weight:700;text-align:center;line-height:1.05;min-height:15px}\n  /* switch 2oct<\/span>\n  <\/div>\n<\/div>\n<script>\n(function(){\n  \"use strict\";\n  // ---- param table (mirror of spec.json) --------------------------------\n  var PD = {};\n  function d(i,mn,mx,df){ PD[i]={min:mn,max:mx,def:df}; }\n  d(0,-1,1,0); d(1,-1,1,0); d(2,-1,1,0); d(3,-1,1,.04);\n  d(4,0,1,.8); d(5,0,1,.7); d(6,0,1,0);\n  d(7,0,1,.35);\n  d(8,0,1,.5); d(9,0,1,.5); d(10,0,1,0);\n  d(11,0,1,.5); d(12,0,1,.3); d(13,0,1,0); d(14,0,1,0);\n  d(15,0,1,.02); d(16,0,1,.4); d(17,0,1,.7); d(18,0,1,.25);\n  d(19,0,1,.02); d(20,0,1,.3);\n  d(21,0,1,.08); d(22,-1,1,0); d(23,0,1,0); d(24,-1,1,0); d(25,0,1,.8);\n  d(26,0,1,0); d(27,0,1,0); d(28,0,1,0); d(29,0,1,0); d(30,0,1,0); d(31,0,1,.3); d(32,0,1,.3);\n  d(33,0,1,.5); d(34,0,1,.5);\n  d(35,0,255,0); d(36,0,127,0);\n  d(37,0,2,1); d(38,0,2,0); d(39,0,2,0);\n\n  var vals = {}; for (var k in PD) vals[k] = PD[k].def;\n  var listeners = {};\n  var V = window.vstai;\n\n  function push(i, v){\n    vals[i] = v;\n    if (V && V.setParam) V.setParam(+i, v);\n    var ls = listeners[i]; if (ls) for (var j=0;j<ls.length;j++) ls[j]();\n  }\n  function listen(i, fn){ (listeners[i] = listeners[i] || []).push(fn); }\n  function el(tag, cls, parent){ var e=document.createElement(tag); if(cls)e.className=cls; if(parent)parent.appendChild(e); return e; }\n\n  // ---- vertical fader ---------------------------------------------------\n  function fader(parent, idx, label, fmt){\n    var p = PD[idx];\n    var box = el(\"div\",\"fd\",parent);\n    var track = el(\"div\",\"track\",box);\n    if (p.min < 0) el(\"div\",\"mid\",track);            // centre mark for bipolar\n    var cap = el(\"div\",\"cap\",track);\n    var lb = el(\"div\",\"lb\",box); lb.textContent = label;\n    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }\n    function paint(){ cap.style.bottom = (norm()*(92-14)) + \"px\"; if(fmt) lb.setAttribute(\"title\",fmt(vals[idx])); }\n    function setN(nn){\n      nn = nn<0?0:(nn>1?1:nn);\n      var v = p.min + (p.max-p.min)*nn;\n      // snap discrete selectors (0..N-1) but leave bipolar continuous faders smooth\n      if (p.min >= 0 && p.max-p.min >= 2 && (p.max-p.min)%1===0) v = Math.round(v);\n      push(idx, v); paint();\n    }\n    track.addEventListener(\"pointerdown\", function(e){ track._d=1; track.setPointerCapture(e.pointerId);\n      var r=track.getBoundingClientRect(); setN(1-(e.clientY-r.top)/r.height); e.preventDefault(); });\n    track.addEventListener(\"pointermove\", function(e){ if(!track._d)return; var r=track.getBoundingClientRect(); setN(1-(e.clientY-r.top)/r.height); });\n    track.addEventListener(\"pointerup\", function(){ track._d=0; });\n    track.addEventListener(\"pointercancel\", function(){ track._d=0; });\n    track.addEventListener(\"dblclick\", function(){ push(idx,p.def); paint(); });\n    track.addEventListener(\"wheel\", function(e){ e.preventDefault(); setN(norm()+(e.deltaY<0?0.04:-0.04)); }, {passive:false});\n    listen(idx, paint); paint();\n    return box;\n  }\n\n  // ---- rotary knob ------------------------------------------------------\n  function knob(parent, idx, label, fmt){\n    var p = PD[idx];\n    var box = el(\"div\",\"kn\",parent);\n    var dial = el(\"div\",\"dial\",box);\n    var notch = el(\"div\",\"notch\",dial);\n    var lb = el(\"div\",\"lb\",box); lb.textContent = label;\n    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }\n    function paint(){ notch.style.transform = \"translateX(-50%) rotate(\" + (-135 + norm()*270) + \"deg)\"; if(fmt) lb.setAttribute(\"title\",fmt(vals[idx])); }\n    function setN(nn){\n      nn = nn<0?0:(nn>1?1:nn);\n      var v = p.min + (p.max-p.min)*nn;\n      if (p.min >= 0 && p.max-p.min >= 2 && (p.max-p.min)%1===0) v = Math.round(v);\n      push(idx, v); paint();\n    }\n    var last=0;\n    dial.addEventListener(\"pointerdown\", function(e){ dial._d=1; last=e.clientY; dial.setPointerCapture(e.pointerId); e.preventDefault(); });\n    dial.addEventListener(\"pointermove\", function(e){ if(!dial._d)return; var dy=last-e.clientY; last=e.clientY; setN(norm()+dy/160); });\n    dial.addEventListener(\"pointerup\", function(){ dial._d=0; });\n    dial.addEventListener(\"pointercancel\", function(){ dial._d=0; });\n    dial.addEventListener(\"dblclick\", function(){ push(idx,p.def); paint(); });\n    dial.addEventListener(\"wheel\", function(e){ e.preventDefault(); setN(norm()+(e.deltaY<0?0.05:-0.05)); }, {passive:false});\n    listen(idx, paint); paint();\n    return box;\n  }\n\n  // ---- N-way selector (standalone int param; opts top->bottom = high->low) --\n  function selector(parent, idx, label, opts){\n    var box = el(\"div\",\"sw\",parent);\n    var stk = el(\"div\",\"stk\",box);\n    var cells = [];\n    for (var i=0;i<opts.length;i++){\n      var v = opts.length-1-i;\n      var c = el(\"div\",\"\",stk); c.textContent = opts[i]; c.dataset.v = v; cells.push(c);\n      (function(val){ c.addEventListener(\"click\", function(){ push(idx, val); paint(); }); })(v);\n    }\n    var lb = el(\"div\",\"lb\",box); lb.textContent = label;\n    function paint(){ var cur=Math.round(vals[idx]); for(var i=0;i<cells.length;i++) cells[i].classList.toggle(\"on\", +cells[i].dataset.v===cur); }\n    listen(idx, paint); paint();\n    return box;\n  }\n\n  // ---- single-bit rocker inside a packed mask param ---------------------\n  // opts = [offText(bit=0), onText(bit=1)] shown top=on, bottom=off\n  function bitSw(parent, maskIdx, bit, label, opts){\n    var box = el(\"div\",\"sw\",parent);\n    var stk = el(\"div\",\"stk\",box);\n    var c1 = el(\"div\",\"\",stk); c1.textContent = opts[1];   // top = bit set\n    var c0 = el(\"div\",\"\",stk); c0.textContent = opts[0];   // bottom = bit clear\n    var lb = el(\"div\",\"lb\",box); lb.textContent = label;\n    function cur(){ return (Math.round(vals[maskIdx])>>bit)&1; }\n    function set(v){ var m=Math.round(vals[maskIdx]); m = v ? (m|(1<<bit)) : (m & ~(1<<bit)); push(maskIdx, m); }\n    c1.addEventListener(\"click\", function(){ set(1); });\n    c0.addEventListener(\"click\", function(){ set(0); });\n    function paint(){ var b=cur(); c1.classList.toggle(\"on\",b===1); c0.classList.toggle(\"on\",b===0); }\n    listen(maskIdx, paint); paint();\n    return box;\n  }\n\n  // a mod-matrix slot = amount fader + a two-position source rocker under it\n  function modSlot(parent, label, idx, bit, opts){\n    var slot = el(\"div\",\"modslot\",parent);\n    fader(slot, idx, label);\n    bitSw(slot, 36, bit, \"src\", opts);\n    return slot;\n  }\n\n  function section(parent, title, cls){ var s=el(\"div\",\"sec\"+(cls?\" \"+cls:\"\"),parent); el(\"div\",\"h\",s).textContent=title; var r=el(\"div\",\"row\",s); return r; }\n\n  var pct = function(v){ return Math.round(v*100)+\"\"; };\n  var cents = function(v){ return (v>=0?\"+\":\"\")+Math.round(v*50)+\"c\"; };\n  var oct2 = function(v){ return (v>=0?\"+\":\"\")+(v*2).toFixed(2)+\"oct\"; };\n\n  var rack = document.getElementById(\"rack\");\n\n  // VCO 1  (mask 35: b1 square, b4 LF)\n  var vco1 = section(rack,\"VCO 1\");\n  fader(vco1,0,\"Coarse\",oct2); fader(vco1,1,\"Fine\",cents); fader(vco1,33,\"PW\",pct);\n  bitSw(vco1,35,1,\"Wave\",[\"SAW\",\"SQR\"]);\n  bitSw(vco1,35,4,\"Range\",[\"AUD\",\"LF\"]);\n\n  // VCO 2  (mask 35: b2 square, b5 sync)\n  var vco2 = section(rack,\"VCO 2\");\n  fader(vco2,2,\"Coarse\",oct2); fader(vco2,3,\"Fine\",cents); fader(vco2,34,\"PW\",pct);\n  bitSw(vco2,35,2,\"Wave\",[\"SAW\",\"SQR\"]);\n  bitSw(vco2,35,5,\"Sync\",[\"OFF\",\"ON\"]);\n\n  // AUDIO MIXER  (mask 35: b3 ring, b0 pink)\n  var mix = section(rack,\"Audio Mixer\");\n  fader(mix,4,\"VCO 1\",pct); fader(mix,5,\"VCO 2\",pct); fader(mix,6,\"Nz/Rg\",pct);\n  bitSw(mix,35,3,\"Ch3\",[\"NOI\",\"RING\"]);\n  bitSw(mix,35,0,\"Noise\",[\"WHT\",\"PNK\"]);\n\n  // LFO\n  var lfo = section(rack,\"LFO\");\n  fader(lfo,7,\"Freq\",function(v){ return (0.1*Math.pow(300,v)).toFixed(1)+\"Hz\"; });\n\n  // SAMPLE & HOLD  (mask 35: b6 clock lfo, b7 in2 noise)\n  var sh = section(rack,\"Sample & Hold\");\n  fader(sh,8,\"In 1\",pct); fader(sh,9,\"In 2\",pct); fader(sh,10,\"Lag\",pct);\n  bitSw(sh,35,6,\"Clock\",[\"KBD\",\"LFO\"]);\n  bitSw(sh,35,7,\"In2\",[\"VCO2\",\"NOI\"]);\n\n  // MODULATION MATRIX (source switches packed into param 36)\n  var mm = section(rack,\"Modulation  —  slider + source rocker\",\"mod\");\n  modSlot(mm,\"VCO12\",26,0,[\"SIN\",\"S&H\"]);\n  modSlot(mm,\"VCO2\",27,1,[\"SIN\",\"ADSR\"]);\n  modSlot(mm,\"PWM1\",28,2,[\"SIN\",\"ADSR\"]);\n  modSlot(mm,\"PWM2\",29,3,[\"SIN\",\"ADSR\"]);\n  modSlot(mm,\"VCF a\",30,4,[\"SIN\",\"S&H\"]);\n  modSlot(mm,\"VCF b\",31,5,[\"ADSR\",\"AR\"]);\n  modSlot(mm,\"VCF kb\",32,6,[\"KBD\",\"S&H\"]);\n\n  // VCF + HPF\n  var vcf = section(rack,\"VCF (Low-Pass)\");\n  fader(vcf,11,\"Cutoff\",pct); fader(vcf,12,\"Reso\",pct);\n  var hpf = section(rack,\"HPF\");\n  fader(hpf,13,\"Cutoff\",pct);\n\n  // ENVELOPES\n  var adsr = section(rack,\"ADSR Envelope\");\n  fader(adsr,15,\"A\",pct); fader(adsr,16,\"D\",pct); fader(adsr,17,\"S\",pct); fader(adsr,18,\"R\",pct);\n  var arE = section(rack,\"AR Envelope\");\n  fader(arE,19,\"A\",pct); fader(arE,20,\"R\",pct);\n\n  // VCA\n  var vca = section(rack,\"VCA\");\n  fader(vca,14,\"Gain\",pct);\n  selector(vca,38,\"Mode\",[\"GATE\",\"AR\",\"ADSR\"]);   // top=GATE(2) .. ADSR(0)\n  selector(vca,39,\"Repeat\",[\"KREP\",\"AUTO\",\"KBD\"]); // top=2 .. 0\n\n  // CONTROLLERS\n  var ctl = section(rack,\"Controllers\");\n  knob(ctl,21,\"Porta\",pct);\n  knob(ctl,24,\"Tune\",cents);\n  knob(ctl,22,\"Bend\",function(v){ return (v>=0?\"+\":\"\")+Math.round(v*100); });\n  knob(ctl,23,\"Vibrato\",pct);\n  knob(ctl,25,\"Volume\",pct);\n  selector(ctl,37,\"Transp\",[\"+2\",\"0\",\"-2\"]);       // top=+2(2) .. -2(0)\n\n  // ---- host handshake ---------------------------------------------------\n  function ready(){\n    for (var i in vals) if (V && V.setParam) V.setParam(+i, vals[i]);\n    // Follow host-side changes (session restore, preset load, DAW automation):\n    // the host pushes (index, value) so every control repaints to the real value.\n    if (V && V.onParam) V.onParam(function(i, v){\n      if (!(i in vals)) return; vals[i] = +v;\n      var ls = listeners[i]; if (ls) for (var j = 0; j < ls.length; j++) ls[j]();\n    });\n  }\n  if (V && V.onReady) V.onReady(ready); else ready();\n})();\n<\/script>\n<\/body><\/html>\n";

  function st(m){document.getElementById('st').textContent=m;}
  var cv=document.getElementById('scope'), g=cv.getContext('2d');
  var ACC=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()||'#ffb454';
  function draw(){

    var W=cv.width,H=cv.height; g.clearRect(0,0,W,H);
    g.strokeStyle='rgba(255,255,255,.07)'; g.lineWidth=1; g.beginPath(); g.moveTo(0,H/2); g.lineTo(W,H/2); g.stroke();

  function makeRiff(){

  async function ensure(){

  document.getElementById('go').addEventListener('click',async function(){

  var KB=document.getElementById('kb'), KEYS=[['C',60,0],['C#',61,1],['D',62,0],['D#',63,1],['E',64,0],['F',65,0],['F#',66,1],['G',67,0],['G#',68,1],['A',69,0],['A#',70,1],['B',71,0],['C',72,0],['C#',73,1],['D',74,0]];
