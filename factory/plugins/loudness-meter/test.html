<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loudness Meter — test bench</title><style>
  :root{--ac:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:13px ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e7eef6;
    background:radial-gradient(130% 100% at 50% -20%,#171f2d,#070a0f 72%);display:flex;flex-direction:column;align-items:center;gap:13px;padding:18px}
  .top{display:flex;align-items:center;gap:11px;width:100%;max-width:1000px}
  .top .led{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
  .top b{font-size:15px;letter-spacing:.05em;color:var(--ac)}
  .top .sub{font-size:11px;color:#7c8aa3;margin-left:auto}
  iframe{width:100%;max-width:1000px;height:600px;border:0;background:transparent;display:block}
  .bar{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:11px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px 16px;
    box-shadow:0 16px 40px rgba(0,0,0,.4)}
  canvas{width:100%;height:74px;display:block;border-radius:10px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.06)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{font:inherit;color:#06080c;background:var(--ac);border:0;border-radius:10px;padding:9px 17px;font-weight:800;cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}
  button.off{background:#28313f;color:#e7eef6}
  select,input[type=file]{font:inherit;color:#e7eef6;background:#10151e;border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:7px 9px}
  label{display:flex;gap:8px;align-items:center;color:#aeb9cc}
  .st{font-size:12px;color:#8da0bd;min-height:16px}
  .krow{display:flex;gap:8px;align-items:center;color:#aeb9cc;font-size:12px}
  .krow .klabel{font-weight:600;letter-spacing:.03em}
  .krow .oct{padding:4px 13px;font-size:16px;line-height:1;background:#28313f;color:#e7eef6;border-radius:8px}
  .krow .octval{min-width:22px;text-align:center;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
  .krow .khint{margin-left:4px;color:#7c8aa3;font-size:11px}
  .kb{display:flex;gap:3px;flex-wrap:wrap}
  .kb .key{width:30px;height:80px;border-radius:0 0 7px 7px;background:linear-gradient(#f4f7fb,#cdd5e0);
    border:1px solid #2a3344;cursor:pointer;color:#1a2230;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;transition:.08s}
  .kb .key.bk{background:linear-gradient(#2b3340,#10151d);color:#9fb0c8;height:52px;width:22px;margin:0 -12px;z-index:2}
  .kb .key.dn{background:linear-gradient(var(--ac),#fff);color:#06080c;transform:translateY(2px)}
  </style></head><body>
  <div class="top"><span class="led"></span><b>Loudness Meter</b><span class="sub">live test bench — turn the knobs, play audio</span></div>
  <iframe id="gui"></iframe>
  <div class="bar">
    <canvas id="scope" width="620" height="74"></canvas>
    <div class="row"><button id="go" class="off">▶ Start audio</button><span class="st" id="st">click Start (browsers need a gesture to begin audio)</span></div>
    <div class="row"><label>Source
         <select id="src"><option value="riff">Musical riff</option><option value="mic">Microphone</option><option value="file">Audio file…</option></select></label>
         <input type="file" id="file" accept="audio/*" style="display:none"></div>
  </div>

  gf.srcdoc="<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Loudness Meter<\/title>\n<style>\n  :root {\n    --accent: #ffd166;\n    --accent2: #fff2cc;\n    --bg0: #0b0906;\n    --bg1: #15110a;\n    --ink: #fdf6e3;\n    --ink-dim: #9c8f6e;\n    --panel: rgba(30, 24, 14, 0.6);\n    --stroke: rgba(255, 209, 102, 0.18);\n    --ok: #6fcf97;\n    --warn: #f2c94c;\n    --bad: #eb5757;\n  }\n  * { box-sizing: border-box; }\n  html, body {\n    margin: 0; padding: 0; background: var(--bg0); color: var(--ink);\n    font-family: ui-sans-serif, -apple-system, \"Segoe UI\", system-ui, sans-serif;\n    -webkit-font-smoothing: antialiased;\n  }\n  .stage {\n    min-height: 100vh; padding: 18px;\n    background: linear-gradient(180deg, var(--bg1), var(--bg0) 70%);\n  }\n  h1 {\n    font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;\n    color: var(--accent); margin: 0 0 14px; font-weight: 700;\n  }\n  .panel {\n    background: var(--panel); border: 1px solid var(--stroke); border-radius: 12px;\n    padding: 16px; margin-bottom: 12px;\n    backdrop-filter: blur(6px);\n  }\n  .readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }\n  .ro {\n    background: rgba(0,0,0,0.25); border-radius: 8px; padding: 10px 12px;\n    border: 1px solid var(--stroke);\n  }\n  .ro .lbl { font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim); text-transform: uppercase; }\n  .ro .val { font-family: ui-monospace, \"SF Mono\", Menlo, monospace; font-size: 26px; font-weight: 600; margin-top: 2px; }\n  .ro .unit { font-size: 11px; color: var(--ink-dim); margin-left: 4px; }\n  .strip { width: 100%; height: 64px; display: block; border-radius: 8px; background: rgba(0,0,0,0.3); }\n  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; }\n  .ctl { display: flex; flex-direction: column; gap: 4px; }\n  .ctl .lbl { font-size: 10px; letter-spacing: 0.08em; color: var(--ink-dim); text-transform: uppercase; }\n  input[type=\"range\"] { width: 130px; accent-color: var(--accent); }\n  .seg { display: flex; border: 1px solid var(--stroke); border-radius: 6px; overflow: hidden; }\n  .seg button {\n    background: transparent; border: none; color: var(--ink-dim); padding: 6px 10px;\n    font-size: 11px; cursor: pointer; font-family: inherit;\n  }\n  .seg button.on { background: var(--accent); color: #2a1e05; font-weight: 700; }\n  .resetBtn {\n    background: rgba(235,87,87,0.15); border: 1px solid rgba(235,87,87,0.5); color: #ff9b9b;\n    border-radius: 6px; padding: 7px 14px; font-size: 11px; letter-spacing: 0.08em;\n    text-transform: uppercase; cursor: pointer; font-family: inherit;\n  }\n  .resetBtn:active { background: rgba(235,87,87,0.35); }\n<\/style>\n<script>window.vstai={onReady:function(f){f()},setParam:function(i,v){parent.postMessage({t:\"p\",i:i,v:v},\"*\")},noteOn:function(n,v){parent.postMessage({t:\"on\",id:n,v:v},\"*\")},noteOff:function(id){parent.postMessage({t:\"off\",id:id},\"*\")}};<\/script><\/head>\n<body>\n<div class=\"stage\">\n  <h1>Loudness Meter<\/h1>\n  <div class=\"panel\">\n    <div class=\"readouts\">\n      <div class=\"ro\"><div class=\"lbl\">Momentary<\/div><div class=\"val\" id=\"roM\">-70.0<span class=\"unit\">LUFS<\/span><\/div><\/div>\n      <div class=\"ro\"><div class=\"lbl\">Short-term<\/div><div class=\"val\" id=\"roS\">-70.0<span class=\"unit\">LUFS<\/span><\/div><\/div>\n      <div class=\"ro\"><div class=\"lbl\">Integrated<\/div><div class=\"val\" id=\"roI\">-70.0<span class=\"unit\">LUFS<\/span><\/div><\/div>\n      <div class=\"ro\"><div class=\"lbl\">True Peak<\/div><div class=\"val\" id=\"roP\">-inf<span class=\"unit\">dBTP<\/span><\/div><\/div>\n    <\/div>\n    <canvas class=\"strip\" id=\"strip\"><\/canvas>\n  <\/div>\n  <div class=\"panel\">\n    <div class=\"row\">\n      <div class=\"ctl\"><div class=\"lbl\">Input Trim<\/div><input type=\"range\" id=\"trim\" min=\"0\" max=\"1\" step=\"0.001\" value=\"0.5\"><\/div>\n      <div class=\"ctl\"><div class=\"lbl\">Channel Mode<\/div><div class=\"seg\" id=\"chanSeg\"><\/div><\/div>\n      <div class=\"ctl\"><div class=\"lbl\">Target Reference<\/div><div class=\"seg\" id=\"targetSeg\"><\/div><\/div>\n      <div class=\"ctl\"><div class=\"lbl\">&nbsp;<\/div><button class=\"resetBtn\" id=\"resetBtn\">Reset<\/button><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<script>\n(function () {\n  var V = {};\n  function set(i, v) {\n    V[i] = v;\n    if (window.vstai && typeof window.vstai.setParam === \"function\") window.vstai.setParam(i, v);\n  }\n\n  var TARGETS = [-23, -16, -14];\n  var targetIdx = 0;\n\n  function buildSeg(host, idx, opts, onPick) {\n    host.innerHTML = \"\";\n    var btns = opts.map(function (label, k) {\n      var b = document.createElement(\"button\");\n      b.textContent = label;\n      b.onclick = function () { set(idx, k); refresh(); if (onPick) onPick(k); };\n      host.appendChild(b);\n      return b;\n    });\n    function refresh() { btns.forEach(function (b, k) { b.className = Math.round(V[idx]) === k ? \"on\" : \"\"; }); }\n    refresh();\n    return refresh;\n  }\n\n  var refreshChan, refreshTarget;\n\n  function fmt(v) { return Number.isFinite(v) ? v.toFixed(1) : \"-inf\"; }\n\n  var hasDisp = false;\n  var disp = new Array(16).fill(0);\n  var stHistory = [];\n  var stripCv = document.getElementById(\"strip\");\n  var stripCx = stripCv.getContext(\"2d\");\n\n  function colorFor(lufs, target) {\n    var d = lufs - target;\n    if (Math.abs(d) <= 1) return \"var(--ok)\";\n    if (Math.abs(d) <= 3) return \"var(--warn)\";\n    return \"var(--bad)\";\n  }\n\n  function drawStrip() {\n    var dpr = window.devicePixelRatio || 1;\n    var W = stripCv.clientWidth, H = stripCv.clientHeight;\n    if (stripCv.width !== Math.round(W * dpr)) { stripCv.width = Math.round(W * dpr); stripCv.height = Math.round(H * dpr); }\n    stripCx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    stripCx.clearRect(0, 0, W, H);\n    var n = stHistory.length;\n    if (n < 2) return;\n    stripCx.beginPath();\n    stripCx.strokeStyle = \"#ffd166\";\n    stripCx.lineWidth = 1.5;\n    for (var i = 0; i < n; i++) {\n      var x = (i / (Math.max(1, stHistory.length - 1))) * W;\n      var lufs = stHistory[i];\n      var y = H - Math.max(0, Math.min(1, (lufs + 40) / 40)) * H;\n      if (i) stripCx.lineTo(x, y); else stripCx.moveTo(x, y);\n    }\n    stripCx.stroke();\n  }\n\n  function tick() {\n    if (hasDisp) {\n      document.getElementById(\"roM\").innerHTML = fmt(disp[0]) + '<span class=\"unit\">LUFS<\/span>';\n      document.getElementById(\"roS\").innerHTML = fmt(disp[1]) + '<span class=\"unit\">LUFS<\/span>';\n      var ro = document.getElementById(\"roI\");\n      ro.innerHTML = fmt(disp[2]) + '<span class=\"unit\">LUFS<\/span>';\n      ro.style.color = colorFor(disp[2], TARGETS[targetIdx]);\n      var pk = Math.max(disp[3], disp[4]);\n      document.getElementById(\"roP\").innerHTML = fmt(pk) + '<span class=\"unit\">dBTP<\/span>';\n      document.getElementById(\"roP\").style.color = pk > -1 ? \"var(--bad)\" : \"var(--ink)\";\n    }\n    requestAnimationFrame(tick);\n  }\n\n  function boot() {\n    set(0, 0.5); set(1, 0); set(2, 0); set(3, 0);\n    document.getElementById(\"trim\").addEventListener(\"input\", function (e) { set(0, +e.target.value); });\n    refreshChan = buildSeg(document.getElementById(\"chanSeg\"), 1, [\"STEREO\", \"MONO\"]);\n    refreshTarget = buildSeg(document.getElementById(\"targetSeg\"), 2, [\"-23\", \"-16\", \"-14\"], function (k) { targetIdx = k; });\n    document.getElementById(\"resetBtn\").onclick = function () {\n      set(3, 1);\n      setTimeout(function () { set(3, 0); }, 80);\n      stHistory = [];\n    };\n\n    if (window.vstai && window.vstai.onParam) window.vstai.onParam(function (i, v) {\n      V[i] = +v;\n      if (i === 0) document.getElementById(\"trim\").value = v;\n      if (i === 1 && refreshChan) refreshChan();\n      if (i === 2 && refreshTarget) { targetIdx = Math.round(v); refreshTarget(); }\n    });\n    if (window.vstai && window.vstai.onDisplay) window.vstai.onDisplay(function (d) {\n      hasDisp = true;\n      for (var i = 0; i < 16; i++) disp[i] = d[i] || 0;\n      stHistory.push(disp[1]);\n      if (stHistory.length > 200) stHistory.shift();\n      drawStrip();\n    });\n    requestAnimationFrame(tick);\n  }\n\n  if (window.vstai && typeof window.vstai.onReady === \"function\") window.vstai.onReady(boot);\n  else boot();\n})();\n<\/script>\n<\/body>\n<\/html>\n";
