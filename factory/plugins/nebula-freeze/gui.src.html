<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nebula Freeze</title>
<style>
:root{--a:#7ee8d4;--a2:#b69cff;--bg0:#05070f;--bg1:#0b1022;--ink:#e6f6f3;--dim:#7f93a8;--panel:rgba(14,20,40,.6);--stroke:rgba(126,232,212,.16);--track:rgba(126,232,212,.13);--knob:#141a34}
/*@@KITCSS@@*/
.stage{position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(1100px 600px at 85% -10%,rgba(182,156,255,.16),transparent 60%),radial-gradient(900px 600px at 5% 110%,rgba(126,232,212,.14),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0) 70%)}
.veil{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none;z-index:0;mix-blend-mode:screen}
.veil.a{width:44vmax;height:44vmax;left:-10vmax;top:-12vmax;background:radial-gradient(circle,rgba(126,232,212,.4),transparent 65%);animation:d1 28s ease-in-out infinite alternate}
.veil.b{width:38vmax;height:38vmax;right:-10vmax;bottom:-12vmax;background:radial-gradient(circle,rgba(182,156,255,.4),transparent 65%);animation:d2 33s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-7vmax,-5vmax) scale(.95)}}
.hero{padding:0;overflow:hidden;border-radius:18px}
.hero .ttl{z-index:3}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px 14px;margin-top:18px}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c3{grid-column:span 3}.c6{grid-column:span 6}
@media (max-width:820px){.c7,.c5,.c3,.c6{grid-column:span 12}}
.freeze{padding:10px 22px;font-size:12px;letter-spacing:.24em;border-radius:12px}
.freeze.on{background:linear-gradient(135deg,#d8f4ff,#9fd4ff);box-shadow:0 0 22px 2px rgba(159,212,255,.55)}
.qrow{display:flex;justify-content:center;margin:2px 0 8px}
</style>
</head>
<body>
<div class="stage">
  <div class="veil a"></div><div class="veil b"></div>
  <div class="wrap">
    <header class="top">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="16" cy="24" r="9" fill="#7ee8d4" opacity=".8"/><circle cx="29" cy="17" r="7" fill="#b69cff" opacity=".75"/>
        <circle cx="33" cy="30" r="8" fill="#7ee8d4" opacity=".6"/><circle cx="9" cy="10" r="2.2" fill="#fff"/><circle cx="41" cy="38" r="1.8" fill="#fff"/>
        <path d="M24 4v40M6 24h36M11 11l26 26M37 11L11 37" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/>
      </svg>
      <div><h1>NEBULA FREEZE</h1><div class="sub">granular texture cloud &middot; live capture &middot; freeze</div></div>
      <div class="grow"></div>
      <div id="freezeSlot"></div>
    </header>
    <div class="card hero" id="hero"></div>
    <div class="grid" id="grid"></div>
    <div class="hint">drag knobs vertically &middot; shift = fine &middot; double-click = reset &middot; freeze locks the buffer</div>
  </div>
</div>
<script>
/*@@KITJS@@*/
</script>
<script>
(function () {
  "use strict";
  VS.define(/*@@PARAMS@@*/[]);
  var P = { POS:0, SIZE:1, PITCH:2, DENS:3, TEX:4, SPRAY:5, JIT:6, REV:7, SPREAD:8, CHAOS:9, FREEZE:10, WIN:11, QUANT:12, FB:13, TONE:14, DEG:15, VERB:16, DECAY:17, MIX:18, LEVEL:19 };
  var SCALES = [[], [0], [0, 7], [0, 3, 5, 7, 10], [0, 2, 4, 5, 7, 9, 11], [0, 2, 4, 6, 8, 10]];

  function pct(x) { return Math.round(x * 100) + "%"; }
  function winSec(w) { return 0.25 * Math.pow(32, w); }
  function secs(s) { return s < 1 ? Math.round(s * 1000) + " ms" : s.toFixed(2) + " s"; }
  function sizeSec(s) { return 0.010 * Math.pow(120, s); }
  function st(x) { x = Math.round(x * 10) / 10; return (x > 0 ? "+" : "") + x + " st"; }

  function build() {
    var hero = document.getElementById("hero");
    var cv = VS.canvas(hero, 250);
    VS.toggle(document.getElementById("freezeSlot"), P.FREEZE, "Freeze", "freeze");
    var grid = document.getElementById("grid");
    function card(title, cls) { var c = VS.el("div", "card " + cls, grid); VS.el("div", "ttl", c, title); var r = VS.el("div", "row", c); r.style.paddingTop = "6px"; return r; }
    var g = card("grain", "c7");
    VS.knob(g, P.POS, { fmt: function (x) { return secs(x * winSec(VS.v(P.WIN))) + " ago"; } });
    VS.knob(g, P.SIZE, { fmt: function (x) { return secs(sizeSec(x)); } });
    VS.knob(g, P.DENS, { fmt: function (x) { return Math.round(1 + 199 * x * x) + " /s"; } });
    VS.knob(g, P.TEX, { fmt: function (x) { return Math.abs(x - 0.5) < 0.03 ? "hann" : x < 0.5 ? "perc " + pct(1 - x * 2) : "flat " + pct((x - 0.5) * 2); } });
    VS.knob(g, P.CHAOS, { fmt: function (x) { return x < 0.05 ? "steady" : pct(x); } });
    VS.knob(g, P.SPRAY, { fmt: pct });
    var p = card("pitch &amp; space", "c5"); p.parentNode.firstChild.innerHTML = "pitch &amp; space";
    VS.knob(p, P.PITCH, { fmt: st });
    VS.knob(p, P.JIT, { fmt: function (x) { return "±" + (x * 12).toFixed(1) + " st"; } });
    VS.knob(p, P.REV, { fmt: pct });
    VS.knob(p, P.SPREAD, { fmt: pct });
    var q = VS.el("div", "qrow", p.parentNode);
    var qw = VS.el("div", "", q); VS.el("div", "lbl", qw, "quantize pitch to");
    VS.seg(qw, P.QUANT, ["Off", "Oct", "5th", "Pent", "Major", "Whole"]);
    var b = card("buffer", "c3");
    VS.knob(b, P.WIN, { fmt: function (x) { return secs(winSec(x)); } });
    VS.knob(b, P.FB, { fmt: pct });
    var f = card("colour", "c6");
    VS.knob(f, P.TONE, { fmt: function (x) { return Math.abs(x) < 0.03 ? "flat" : (x < 0 ? "LP " : "HP ") + Math.round(Math.abs(x) * 100); } });
    VS.knob(f, P.DEG, { fmt: function (x) { return x < 0.02 ? "clean" : Math.round(16 - x * 11) + " bit"; } });
    VS.knob(f, P.VERB, { fmt: pct });
    VS.knob(f, P.DECAY, { fmt: pct });
    var o = card("output", "c3");
    VS.knob(o, P.MIX, { fmt: pct });
    VS.knob(o, P.LEVEL, { fmt: function (x) { return (x <= 0.001 ? "-inf" : (20 * Math.log10(x)).toFixed(1)) + " dB"; } });

    // ------------------------------------------------------------ viz
    var ctx = cv.ctx, grains = [], spawnT = 0, scroll = 0, sparkles = [];
    for (var i = 0; i < 46; i++) sparkles.push({ x: Math.random(), y: Math.random(), p: Math.random() * 6.28, s: 0.6 + Math.random() * 1.4 });
    function hash(n) { var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
    function win(ph, fa, fr) {
      if (ph < fa) return 0.5 - 0.5 * Math.cos(Math.PI * ph / fa);
      if (ph > 1 - fr) return 0.5 + 0.5 * Math.cos(Math.PI * (ph - (1 - fr)) / fr);
      return 1;
    }
    function snap(s, q) {
      if (!q) return s; var sc = SCALES[q], best = s, bd = 99, oct = Math.floor(s / 12);
      for (var o = oct - 1; o <= oct + 1; o++) for (var k = 0; k < sc.length; k++) { var c = o * 12 + sc[k], d = Math.abs(c - s); if (d < bd) { bd = d; best = c; } }
      return best;
    }
    function frameFn(t, dt) {
      var W = cv.w(), H = cv.h();
      var pos = VS.v(P.POS), sizeS = sizeSec(VS.v(P.SIZE)), pitch = VS.v(P.PITCH), dens = VS.v(P.DENS), tex = VS.v(P.TEX);
      var spray = VS.v(P.SPRAY), jit = VS.v(P.JIT), rev = VS.v(P.REV), chaos = VS.v(P.CHAOS);
      var frozen = VS.v(P.FREEZE) >= 0.5, wsec = winSec(VS.v(P.WIN)), quant = Math.round(VS.v(P.QUANT));
      var fb = VS.v(P.FB), deg = VS.v(P.DEG), verb = VS.v(P.VERB), decay = VS.v(P.DECAY), mix = VS.v(P.MIX), spread = VS.v(P.SPREAD);
      var speed = Math.min(220, W / wsec);
      if (!frozen) scroll += speed * dt;
      ctx.clearRect(0, 0, W, H);
      // reverb halo
      var halo = 0.05 + verb * (0.35 + 0.5 * decay) * 0.5;
      var hg = ctx.createRadialGradient(W / 2, H * 1.05, 10, W / 2, H * 1.05, W * 0.6);
      hg.addColorStop(0, "rgba(182,156,255," + halo + ")"); hg.addColorStop(1, "rgba(182,156,255,0)");
      ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
      var midY = H * 0.5;
      // pitch grid (quantise lines)
      if (quant) {
        ctx.strokeStyle = "rgba(182,156,255,.16)"; ctx.lineWidth = 1;
        for (var s = -24; s <= 24; s++) { if (snap(s, quant) !== s) continue; var yy = midY - s / 24 * H * 0.34; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); }
      }
      ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();
      // buffer ribbon
      var col = frozen ? "191,234,255" : "126,232,212";
      for (var x = 0; x < W; x += 3) {
        var c = Math.floor((x + scroll) / 3);
        var amp = Math.abs(Math.sin(c * 0.045) * Math.sin(c * 0.0113 + 1.3)) * (0.30 + 0.70 * hash(c)) + 0.05 * hash(c + 9);
        var age = 1 - x / W, fadeA = 0.22 + 0.55 * (1 - age * 0.6);
        var h = amp * 62;
        ctx.fillStyle = "rgba(" + col + "," + fadeA * (0.5 + 0.5 * (1 - mix * 0.6)) + ")";
        ctx.fillRect(x, midY - h, 2, h * 2);
      }
      // "now" edge + age ruler
      ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.font = "9px ui-sans-serif,system-ui"; ctx.textAlign = "right";
      ctx.fillText("now", W - 8, 14); ctx.textAlign = "left"; ctx.fillText(secs(wsec) + " ago", 8, 14);
      // spray band + position head
      var px = W * (1 - pos), half = spray * 0.5 * W;
      var bg = ctx.createLinearGradient(px - half, 0, px + half, 0);
      bg.addColorStop(0, "rgba(182,156,255,0)"); bg.addColorStop(0.5, "rgba(182,156,255,.20)"); bg.addColorStop(1, "rgba(182,156,255,0)");
      ctx.fillStyle = bg; ctx.fillRect(px - half, 20, half * 2, H - 40);
      ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px, 22); ctx.lineTo(px, H - 22); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(px - 5, 16); ctx.lineTo(px + 5, 16); ctx.lineTo(px, 24); ctx.fill();
      // spawn grains
      var rate = Math.min(70, 2 + 68 * dens * dens);
      spawnT -= dt;
      var life = Math.max(0.35, Math.min(1.6, 0.35 + sizeS * 0.9));
      while (spawnT <= 0) {
        var u = Math.max(0.0001, Math.random()), mult = 1 + chaos * (-Math.log(u) - 1);
        spawnT += Math.max(0.004, mult / rate);
        if (grains.length > 140) break;
        var sm = pitch + (Math.random() * 2 - 1) * jit * 12; sm = snap(sm, quant);
        var gx = px + (Math.random() * 2 - 1) * spray * 0.5 * W; gx = Math.max(W * 0.02, Math.min(W * 0.98, gx));
        grains.push({ x: gx, semis: sm, age: 0, life: life * (0.8 + Math.random() * 0.4), rev: Math.random() < rev, pan: (Math.random() * 2 - 1) * spread, jy: (Math.random() - 0.5) * 8 });
      }
      var fa, fr; if (tex < 0.5) { fa = 0.02 + tex * 2 * 0.48; fr = 1 - fa; } else { fa = 0.5 - (tex - 0.5) * 2 * 0.44; fr = fa; }
      var gw = Math.max(8, Math.min(W * 0.42, sizeS / wsec * W)), gh = 22 + dens * 10;
      var q = deg > 0.25 ? 3 + deg * 9 : 0;
      ctx.globalCompositeOperation = "lighter";
      for (var gi = grains.length - 1; gi >= 0; gi--) {
        var gr = grains[gi]; gr.age += dt;
        if (!frozen) gr.x -= speed * dt * 0.55;
        var ph = gr.age / gr.life, tail = Math.max(0, gr.age - gr.life);
        var afterglow = fb > 0.03 ? Math.exp(-tail / (0.25 + fb * 2.0)) * fb * 0.6 : 0;
        if (ph >= 1 && afterglow < 0.02) { grains.splice(gi, 1); continue; }
        var y0 = midY - gr.semis / 24 * H * 0.34 + gr.jy;
        var hue = gr.rev ? 268 : 168 + gr.semis * 2.6;
        var a = ph < 1 ? 0.75 : afterglow;
        a *= 0.35 + mix * 0.65;
        ctx.fillStyle = "hsla(" + hue + ",85%,68%," + a * 0.5 + ")";
        ctx.strokeStyle = "hsla(" + hue + ",95%,80%," + a + ")"; ctx.lineWidth = 1.1;
        ctx.beginPath();
        var N = 22, ph2;
        for (var k = 0; k <= N; k++) {
          ph2 = k / N; var wv = win(gr.rev ? 1 - ph2 : ph2, fa, fr) * gh;
          var xx = gr.x - gw / 2 + ph2 * gw, yy2 = y0 - wv;
          if (q) { xx = Math.round(xx / q) * q; yy2 = Math.round(yy2 / q) * q; }
          if (k === 0) ctx.moveTo(xx, y0); ctx.lineTo(xx, yy2);
        }
        ctx.lineTo(gr.x + gw / 2, y0); ctx.closePath(); ctx.fill(); ctx.stroke();
        // read tether to the ribbon
        ctx.strokeStyle = "hsla(" + hue + ",80%,75%," + a * 0.22 + ")";
        ctx.beginPath(); ctx.moveTo(gr.x, y0); ctx.lineTo(gr.x, midY); ctx.stroke();
        if (ph < 1) {
          var pxg = gr.x + gr.pan * 6; ctx.fillStyle = "hsla(" + hue + ",100%,90%," + a + ")";
          ctx.beginPath(); ctx.arc(pxg, y0 - gh - 3, 1.6, 0, 6.283); ctx.fill();
        }
      }
      ctx.globalCompositeOperation = "source-over";
      // frost
      if (frozen) {
        var fg = ctx.createLinearGradient(0, 0, 0, H);
        fg.addColorStop(0, "rgba(190,230,255,.13)"); fg.addColorStop(0.5, "rgba(190,230,255,.02)"); fg.addColorStop(1, "rgba(190,230,255,.16)");
        ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
        for (var si = 0; si < sparkles.length; si++) {
          var sp = sparkles[si], tw = 0.5 + 0.5 * Math.sin(t * 2 * sp.s + sp.p);
          ctx.fillStyle = "rgba(230,246,255," + tw * 0.9 + ")";
          var sx = sp.x * W, sy = sp.y * H, r = 1 + tw * 1.6;
          ctx.fillRect(sx - r, sy - 0.5, r * 2, 1); ctx.fillRect(sx - 0.5, sy - r, 1, r * 2);
        }
        ctx.fillStyle = "rgba(220,244,255,.9)"; ctx.font = "700 10px ui-sans-serif,system-ui"; ctx.textAlign = "center";
        ctx.fillText("FROZEN", W / 2, H - 8);
      }
    }
    return frameFn;
  }
  var frameFn = null;
  VS.boot(function () { frameFn = build(); }, function (t, dt) { if (frameFn) frameFn(t, dt); });
})();
</script>
</body>
</html>
