<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nebula Freeze</title>
<style>
:root{--a:#7ee8d4;--a2:#b69cff;--bg0:#05070f;--bg1:#0b1022;--ink:#e6f6f3;--dim:#7f93a8;--panel:rgba(14,20,40,.6);--stroke:rgba(126,232,212,.16);--track:rgba(126,232,212,.13);--knob:#141a34}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg0);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas{display:block}
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:18px 20px 22px}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
header.top .mark{width:40px;height:40px;flex:0 0 auto;filter:drop-shadow(0 0 8px var(--a))}
header.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.12em;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .sub{margin-top:3px;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
header.top .grow{flex:1}
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:12px 12px 8px;position:relative;backdrop-filter:blur(10px)}
.card>.ttl{position:absolute;top:-7px;left:14px;padding:0 7px;font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--a);background:var(--bg0);border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:2px 4px;justify-content:center;align-items:flex-start}
.knob{width:76px;text-align:center;padding:2px 0 4px;touch-action:none}
.knob svg{display:block;margin:0 auto;cursor:ns-resize;touch-action:none}
.knob .nm{margin-top:1px;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.knob .vl{font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:1px;min-height:13px}
.knob:hover .nm,.knob.drag .nm{color:var(--a)}
.knob .trk{stroke:var(--track);fill:none}
.knob .arc{stroke:var(--a);fill:none;filter:drop-shadow(0 0 3px var(--a))}
.knob .body{fill:var(--knob);stroke:rgba(255,255,255,.07)}
.knob .cap{fill:rgba(255,255,255,.05)}
.knob .ptr{stroke:var(--a2);stroke-linecap:round}
.knob .dot{fill:var(--a)}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.seg button.opt,button.btn{font:inherit;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 8px;cursor:pointer;transition:all .12s}
.seg button.opt:hover,button.btn:hover{color:var(--ink)}
.seg button.opt.on{color:#0b0b12;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 0 10px -2px var(--a);font-weight:700}
button.btn{border-color:var(--stroke);background:rgba(255,255,255,.03)}
button.btn.on{color:#0b0b12;background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;font-weight:700;box-shadow:0 0 14px -2px var(--a)}
.lbl{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 4px 2px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper .v{min-width:56px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.stepper button{width:22px;height:22px;padding:0;font-size:13px;line-height:1;border-radius:6px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer}
.stepper button:hover{border-color:var(--a);color:var(--a)}
.hint{margin-top:10px;text-align:center;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:.6}

.stage{position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(1100px 600px at 85% -10%,rgba(182,156,255,.16),transparent 60%),radial-gradient(900px 600px at 5% 110%,rgba(126,232,212,.14),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0) 70%)}
.veil{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none;z-index:0;mix-blend-mode:screen}
.veil.a{width:44vmax;height:44vmax;left:-10vmax;top:-12vmax;background:radial-gradient(circle,rgba(126,232,212,.4),transparent 65%);animation:d1 28s ease-in-out infinite alternate}
.veil.b{width:38vmax;height:38vmax;right:-10vmax;bottom:-12vmax;background:radial-gradient(circle,rgba(182,156,255,.4),transparent 65%);animation:d2 33s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-7vmax,-5vmax) scale(.95)}}
.hero{padding:0;overflow:hidden;border-radius:18px}
.hero .ttl{z-index:3}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px 14px;margin-top:18px}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c3{grid-column:span 3}.c6{grid-column:span 6}
@media (max-width:820px){.c7,.c5,.c3,.c6{grid-column:span 12}}
.freeze{padding:10px 22px;font-size:12px;letter-spacing:.24em;border-radius:12px}
.freeze.on{background:linear-gradient(135deg,#d8f4ff,#9fd4ff);box-shadow:0 0 22px 2px rgba(159,212,255,.55)}
.qrow{display:flex;justify-content:center;margin:2px 0 8px}
</style>
</head>
<body>
<div class="stage">
  <div class="veil a"></div><div class="veil b"></div>
  <div class="wrap">
    <header class="top">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="16" cy="24" r="9" fill="#7ee8d4" opacity=".8"/><circle cx="29" cy="17" r="7" fill="#b69cff" opacity=".75"/>
        <circle cx="33" cy="30" r="8" fill="#7ee8d4" opacity=".6"/><circle cx="9" cy="10" r="2.2" fill="#fff"/><circle cx="41" cy="38" r="1.8" fill="#fff"/>
        <path d="M24 4v40M6 24h36M11 11l26 26M37 11L11 37" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/>
      </svg>
      <div><h1>NEBULA FREEZE</h1><div class="sub">granular texture cloud &middot; live capture &middot; freeze</div></div>
      <div class="grow"></div>
      <div id="freezeSlot"></div>
    </header>
    <div class="card hero" id="hero"></div>
    <div class="grid" id="grid"></div>
    <div class="hint">drag knobs vertically &middot; shift = fine &middot; double-click = reset &middot; freeze locks the buffer</div>
  </div>
</div>
<script>

</script>
