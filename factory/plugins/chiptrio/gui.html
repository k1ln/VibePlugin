<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chiptrio</title>
<style>
:root{--a:#6cc7ff;--a2:#c9ecff;--pn:#0f1c2a;--ink:#dcebf7;--dim:#7b97ad;--ln:rgba(108,199,255,.16)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#12304a,#070f18 65%);color:var(--ink);font:12px/1.3 -apple-system,"Segoe UI",Helvetica,sans-serif;min-height:100%}
#app{max-width:1040px;margin:0 auto;padding:12px}
h1{margin:0 0 8px;font-size:18px;letter-spacing:.3em;font-weight:300;color:var(--a2)}h1 small{letter-spacing:.15em;color:var(--dim);font-size:10px;margin-left:10px}

.row{display:grid;gap:8px;margin-top:8px}.r3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.tg button.on{background:var(--a);color:#06121c;border-color:var(--a)}
.k{display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none;cursor:ns-resize}
.k svg{width:40px;height:40px}.k .n{font-size:9px;color:var(--dim);text-align:center;margin-top:1px}.k .v{font-size:9px;color:var(--a2)}

.w{position:absolute;top:0;height:100%;background:linear-gradient(#eaf5fd,#b8d3e6);border:1px solid #070f18;border-radius:0 0 4px 4px}.w.on{background:var(--a)}
.b{position:absolute;top:0;height:58%;background:linear-gradient(#1f3346,#08121b);border-radius:0 0 3px 3px;z-index:2}.b.on{background:var(--a)}
</style></head><body><div id="app"><h1>CHIPTRIO<small>THREE-VOICE CHIP</small></h1><canvas id="cv"></canvas><div class="row r3" id="voices"></div><div class="row r3" id="rest"></div><div id="kb"></div></div>
<script>

tep": 1}, {"name": "Voice 3 Attack", "index": 24, "min": 0, "max": 15, "default": 0, "step": 1}, {"name": "Voice 3 Decay", "index": 25, "min": 0, "max": 15, "default": 9, "step": 1}, {"name": "Voice 3 Sustain", "index": 26, "min": 0, "max": 15, "default": 8, "step": 1}, {"name": "Voice 3 Release", "index": 27, "min": 0, "max": 15, "default": 5, "step": 1}, {"name": "Voice 3 Tune", "index": 28, "min": -24, "max": 24, "default": -12}, {"name": "Voice 3 Level", "index": 29, "min": 0, "max": 1, "default": 0.8}, {"name": "Mode", "index": 30, "min": 0, "max": 2, "default": 1, "step": 1}, {"name": "Arp Rate", "index": 31, "min": 0, "max": 1, "default": 0.5}, {"name": "Filter Mode", "index": 32, "min": 0, "max": 7, "default": 1, "step": 1}, {"name": "Cutoff", "index": 33, "min": 0, "max": 1, "default": 0.4}, {"name": "Resonance", "index": 34, "min": 0, "max": 1, "default": 0.6}, {"name": "Filter Route", "index": 35, "min": 0, "max": 7, "default": 7, "step": 1}, {"name": "Chip Model", "index": 36, "min": 0, "max": 1, "default": 0, "step": 1}, {"name": "PWM Depth", "index": 37, "min": 0, "max": 1, "default": 0.25}, {"name": "PWM Rate", "index": 38, "min": 0, "max": 1, "default": 0.35}, {"name": "Vibrato", "index": 39, "min": 0, "max": 1, "default": 0.1}, {"name": "Lo-Fi", "index": 40, "min": 0, "max": 1, "default": 0}, {"name": "Clock Reduce", "index": 41, "min": 0, "max": 1, "default": 0}, {"name": "Volume", "index": 42, "min": 0, "max": 1, "default": 0.8}, {"name": "Bend Range", "index": 43, "min": 0, "max": 1, "default": 0.1667}, {"name": "Unison Detune", "index": 44, "min": 0, "max": 1, "default": 0.35}];
var V={},R={},SV="http://www.w3.org/2000/svg",held={},lastHit=0,disp=[0,0,0,0,0,0,0],hasDisp=0;

function set(i,v){V[i]=v;host("setParam",i,v);if(R[i])R[i]()}

if(i==42||i==43)return i==43?Math.round(v*12)+" st":Math.round(v*100)+"%";return Math.round(v*100)+"%"}

var s=document.createElementNS(SV,"svg");s.setAttribute("viewBox","0 0 44 44");
s.innerHTML='<circle cx="22" cy="22" r="19" fill="#08131d" stroke="rgba(108,199,255,.2)"/><path class="tr" fill="none" stroke="rgba(108,199,255,.18)" stroke-width="3" stroke-linecap="round"/><path class="ar" fill="none" stroke="#6cc7ff" stroke-width="3" stroke-linecap="round"/><line class="nd" x1="22" y1="22" stroke="#c9ecff" stroke-width="2" stroke-linecap="round"/>';
var n=document.createElement("div");n.className="n";n.textContent=label||p.name;var vv=document.createElement("div");vv.className="v";w.appendChild(s);w.appendChild(n);w.appendChild(vv);

R[i]=paint;paint();
var y0,n0,drag=false;
function put(nv){nv=Math.min(1,Math.max(0,nv));var v=p.min+nv*(p.max-p.min);if(p.step)v=Math.round(v/p.step)*p.step;set(i,v)}

// toggle-bit group (mask param) / plain toggle / segmented choice
function bits(i,label,names){V[i]=PARAMS[i].default;var row=document.createElement("div");row.className="tg";row.innerHTML="<span>"+label+"</span>";var bs=[];

function draw(t){var dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}

if(bk){e.style.left=(wi/wn*100-1.1)+"%";e.style.width="2.2%"}else{e.style.left=(wi/wn*100)+"%";e.style.width=(100/wn)+"%";wi++}
(function(n,e){e.addEventListener("mousedown",function(ev){on(n);ev.preventDefault();ev.stopPropagation()});e.addEventListener("mouseup",function(){off(n)});e.addEventListener("mouseleave",function(){off(n)});

KEYS[n]=e;kb.appendChild(e)}
