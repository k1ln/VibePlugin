<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridgewell 80</title>
<style>
  :root{
    --panel:#1c1c1d; --panel2:#232325; --line:#343437; --ink:#ece6d6; --ink2:#a7a194; --muted:#6f6b63;
    --orange:#f08a24; --red:#e2382a; --yellow:#f2d23c; --cream:#efe9d8; --led:#ff3b2f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0f0f10;color:var(--ink);font:12px/1.3 "Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;user-select:none}
  #fit{transform-origin:0 0;position:absolute;left:0;top:0}
  .machine{width:1180px;padding:14px 16px 16px;background:linear-gradient(180deg,#252527,#1a1a1b 42%,#161617);border-radius:10px;box-shadow:0 0 0 1px #000,inset 0 1px 0 #3a3a3d}
  .top{display:flex;align-items:center;gap:18px;margin-bottom:10px}
  .brand{display:flex;flex-direction:column;margin-right:auto}
  .brand b{font-size:22px;letter-spacing:.06em;font-weight:800}
  .brand b i{font-style:normal;color:var(--orange)}
  .brand span{color:var(--ink2);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase}
  .grp{display:flex;align-items:flex-end;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.18)}
  .grp-title{font-size:9.5px;letter-spacing:.2em;color:var(--ink2);text-transform:uppercase;margin-bottom:4px}
  .col-stack{display:flex;flex-direction:column;align-items:center}

  /* knobs */
  .k-wrap{display:flex;flex-direction:column;align-items:center;width:52px}
  .k{cursor:ns-resize;display:block;touch-action:none}
  .k-tick{stroke:#6d6961;stroke-width:3}
  .k-skirt{fill:#0c0c0d;stroke:#3d3d40;stroke-width:2}
  .k-cap{fill:#2c2c2f}
  .k-needle{stroke:var(--cream);stroke-width:7;stroke-linecap:round}
  .k-label{font-size:9.5px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase;margin-top:1px;text-align:center}
  .k-val{font-size:9.5px;color:var(--orange);min-height:11px;font-variant-numeric:tabular-nums}
  .k-wrap.big{width:66px}

  /* instrument strip */
  .strip{display:flex;gap:5px;margin-bottom:12px}
  .strip > .inst{flex:1 1 auto}
  .inst{border:1px solid var(--line);border-radius:7px;background:linear-gradient(180deg,#29292b,#1f1f20);padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;min-width:0}
  .inst-name{width:100%;min-height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--cream);padding:2px 0 5px;border-bottom:1px solid #333;margin-bottom:6px;cursor:pointer;text-align:center;line-height:1.15}
  .inst-name .nm{display:flex;align-items:center;gap:5px}
  .inst-name:hover{color:var(--orange)}
  .inst-name .led{width:7px;height:7px;border-radius:50%;background:#3a1512;box-shadow:inset 0 0 2px #000;flex:0 0 auto}
  .inst-name small{font-weight:600;color:var(--ink2);font-size:9px}
  .knobs{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
  .bit{margin:0 0 6px;display:flex;border:1px solid #444;border-radius:4px;overflow:hidden;background:#111;cursor:pointer;padding:0;font:inherit}
  .bit span{padding:2px 6px;font-size:9.5px;font-weight:700;color:#777;letter-spacing:.05em}
  .bit .bit-a{background:#2b2b2d;color:var(--cream)}
  .bit.on .bit-a{background:transparent;color:#777}
  .bit.on .bit-b{background:#2b2b2d;color:var(--orange)}

  /* selectors, toggles */
  .sel-label{font-size:9.5px;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase;margin-bottom:3px}
  .sel-row{display:flex;border:1px solid #444;border-radius:5px;overflow:hidden}
  .sel-btn{border:0;background:#161617;color:#8a857b;font:700 10.5px/1 inherit;padding:5px 8px;cursor:pointer;border-right:1px solid #333}
  .sel-btn:last-child{border-right:0}
  .sel-btn.on{background:var(--orange);color:#1a1208}
  .tog,.btn{border:1px solid #4a4a4d;background:#1a1a1b;color:var(--cream);font:700 10.5px/1 inherit;padding:7px 11px;border-radius:5px;cursor:pointer;letter-spacing:.06em}
  .tog.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 10px rgba(226,56,42,.5)}
  .btn:hover,.tog:hover{border-color:#777}

  /* sequencer */
  .seqbar{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .instsel{display:flex;gap:3px}
  .isb{border:1px solid #444;background:#161617;color:#9a958b;font:700 10px/1 inherit;padding:6px 6px;border-radius:4px;cursor:pointer;min-width:31px}
  .isb.on{background:var(--cream);color:#111;border-color:var(--cream)}
  .steps{display:grid;grid-template-columns:repeat(16,1fr);gap:6px;padding:10px 10px 8px;background:#121213;border-radius:8px;border:1px solid var(--line)}
  .step{position:relative;height:58px;border-radius:5px;cursor:pointer;border:0;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 2px 0 #000;padding:0}
  .step .num{position:absolute;left:6px;bottom:8px;font:800 11px/1 inherit;color:rgba(0,0,0,.55)}
  .step .sled{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;background:#4a1611;box-shadow:inset 0 0 3px #000}
  .step.on .sled{background:var(--led);box-shadow:0 0 8px var(--led),inset 0 0 2px #fff}
  .step.play{outline:2px solid #fff;outline-offset:2px}
  .step.beyond{opacity:.32}
  .g1{background:var(--red)} .g2{background:var(--orange)} .g3{background:var(--yellow)} .g4{background:var(--cream)}
  .beats{display:grid;grid-template-columns:repeat(16,1fr);gap:6px;padding:4px 10px 0;color:var(--muted);font-size:9px;letter-spacing:.1em}
  .grid{display:none;margin-top:10px;background:#121213;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .grid.show{display:block}
  .grow{display:grid;grid-template-columns:52px repeat(16,1fr);gap:3px;margin-bottom:3px;align-items:center}
  .grow b{font-size:10px;color:var(--ink2);letter-spacing:.08em}
  .gc{height:15px;border-radius:3px;background:#262628;cursor:pointer}
  .gc.q{background:#2e2e31}
  .gc.on{background:var(--orange)}
  .grow.ac .gc.on{background:var(--red)}
  .gc.play{box-shadow:inset 0 0 0 2px #fff}
  .foot{display:flex;gap:12px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
  .patsel{background:#161617;color:var(--cream);border:1px solid #444;border-radius:5px;font:700 10.5px/1 inherit;padding:6px 6px;min-width:150px;cursor:pointer}
  .hint{color:var(--muted);font-size:10px;margin-left:auto;text-align:right;max-width:330px}
  .meter{width:10px;height:44px;background:#0a0a0b;border-radius:3px;position:relative;overflow:hidden;border:1px solid #333}
  .meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#3fbf5a,#f2d23c 70%,#e2382a)}
</style>
</head>
<body>
<div id="fit"><div class="machine" id="m"></div></div>
<script>
/* =====================================================================
   drums/ui/kit.js — shared panel components for the drum machines.
   Inlined into every gui.html by build.mjs (a plugin GUI is one file).

   Contract with the host (src/BridgeShim.h):
     · window.vstai.setParam(i, v) sends ACTUAL values (spec min..max).
     · on ready, every param's current value is pushed once;
     · window.vstai.onParam(cb) repaints controls when the DAW / a restored
       session changes a value — draw only, never push back;
     · window.vstai.onDisplay(cb) delivers the engine's 16 display floats.
   ===================================================================== */
var Kit = (function () {
  var PD = {};            // index -> {name,min,max,def,step}
  var vals = {};
  var listeners = {};
  var displayFns = [];

  function has(fn) { return window.vstai && typeof window.vstai[fn] === "function"; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function el(tag, cls, parent, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function svg(tag, attrs, parent) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function define(list) {
    list.forEach(function (p) { PD[p.index] = p; vals[p.index] = p.def; });
  }
  function get(i) { return vals[i]; }
  function norm(i) { var p = PD[i]; return (vals[i] - p.min) / ((p.max - p.min) || 1); }
  function quant(i, v) {
    var p = PD[i];
    v = clamp(v, p.min, p.max);
    if (p.step) v = Math.round((v - p.min) / p.step) * p.step + p.min;
    return v;
  }
  function notify(i) { var ls = listeners[i]; if (ls) for (var j = 0; j < ls.length; j++) ls[j](vals[i]); }
  // User change: store, send to the engine, repaint.
  function set(i, v) {
    v = quant(i, v);
    if (v === vals[i]) return;
    vals[i] = v;
    if (has("setParam")) window.vstai.setParam(+i, v);
    notify(i);
  }
  function listen(i, fn) { (listeners[i] = listeners[i] || []).push(fn); fn(vals[i]); }
  function onDisplay(fn) { displayFns.push(fn); }

  function ready() {
    for (var i in vals) if (has("setParam")) window.vstai.setParam(+i, vals[i]);
    if (has("onParam")) window.vstai.onParam(function (i, v) {
      if (!(i in PD)) return;
      vals[i] = quant(i, +v);
      notify(i);
    });
    if (has("onDisplay")) window.vstai.onDisplay(function (d) {
      for (var j = 0; j < displayFns.length; j++) { try { displayFns[j](d); } catch (e) {} }
    });
  }
  function start() { if (has("onReady")) window.vstai.onReady(ready); else ready(); }

  function note(n, vel) {
    if (!has("noteOn")) return;
    window.vstai.noteOn(n, vel == null ? 0.7 : vel);
    setTimeout(function () { if (has("noteOff")) window.vstai.noteOff(n); }, 60);
  }

  // ---- drag helper: vertical drag, shift = fine --------------------------
  function dragValue(target, i, sens) {
    var startY = 0, startN = 0, active = false;
    function move(e) {
      if (!active) return;
      var dy = startY - e.clientY;
      var k = (e.shiftKey ? 0.2 : 1) * (sens || 1) / 160;
      var p = PD[i];
      set(i, p.min + clamp(startN + dy * k, 0, 1) * (p.max - p.min));
    }
    function up() { active = false; window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); }
    target.addEventListener("pointerdown", function (e) {
      e.preventDefault(); active = true; startY = e.clientY; startN = norm(i);
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
    });
    target.addEventListener("wheel", function (e) {
      e.preventDefault();
      var p = PD[i], stepN = p.step ? p.step / (p.max - p.min) : 0.01;
      set(i, p.min + clamp(norm(i) + (e.deltaY < 0 ? 1 : -1) * stepN * (e.shiftKey ? 1 : 2), 0, 1) * (p.max - p.min));
    }, { passive: false });
    target.addEventListener("dblclick", function () { set(i, PD[i].def); });
  }

  // ---- knob --------------------------------------------------------------
  // opts: {label, cap (css colour), size, fmt(v) -> string, sub}
  function knob(parent, i, opts) {
    opts = opts || {};
    var size = opts.size || 44;
    var wrap = el("div", "k-wrap" + (opts.cls ? " " + opts.cls : ""), parent);
    var s = svg("svg", { width: size, height: size, viewBox: "0 0 100 100", class: "k" }, wrap);
    // scale ticks
    for (var t = 0; t <= 10; t++) {
      var a = (-135 + t * 27) * Math.PI / 180;
      svg("line", { x1: 50 + 44 * Math.sin(a), y1: 50 - 44 * Math.cos(a), x2: 50 + 49 * Math.sin(a), y2: 50 - 49 * Math.cos(a), class: "k-tick" }, s);
    }
    svg("circle", { cx: 50, cy: 50, r: 38, class: "k-skirt" }, s);
    svg("circle", { cx: 50, cy: 50, r: 30, class: "k-cap", style: opts.cap ? "fill:" + opts.cap : "" }, s);
    var needle = svg("line", { x1: 50, y1: 50, x2: 50, y2: 18, class: "k-needle" }, s);
    if (opts.label) el("div", "k-label", wrap, opts.label);
    var readout = el("div", "k-val", wrap, "");
    function draw() {
      var th = (-135 + 270 * norm(i)) * Math.PI / 180;
      needle.setAttribute("x2", 50 + 32 * Math.sin(th));
      needle.setAttribute("y2", 50 - 32 * Math.cos(th));
      readout.textContent = opts.fmt ? opts.fmt(vals[i]) : "";
    }
    listen(i, draw);
    dragValue(s, i, opts.sens);
    wrap.title = (PD[i] && PD[i].name) || "";
    return wrap;
  }

  // ---- multi-position selector (values = option index + min) -------------
  // opts: {label, options:[...labels], cls}
  function selector(parent, i, opts) {
    var wrap = el("div", "sel" + (opts.cls ? " " + opts.cls : ""), parent);
    if (opts.label) el("div", "sel-label", wrap, opts.label);
    var row = el("div", "sel-row", wrap);
    var btns = opts.options.map(function (lab, j) {
      var b = el("button", "sel-btn", row, lab);
      b.type = "button";
      b.addEventListener("click", function () { set(i, PD[i].min + j * (PD[i].step || 1)); });
      return b;
    });
    listen(i, function (v) {
      var j = Math.round((v - PD[i].min) / (PD[i].step || 1));
      btns.forEach(function (b, k) { b.classList.toggle("on", k === j); });
    });
    return wrap;
  }

  // ---- one bit of a packed switch word ------------------------------------
  function bitSwitch(parent, i, bit, offLabel, onLabel, cls) {
    var b = el("button", "bit" + (cls ? " " + cls : ""), parent);
    b.type = "button";
    var a = el("span", "bit-a", b, offLabel), c = el("span", "bit-b", b, onLabel);
    b.addEventListener("click", function () { set(i, Math.round(vals[i]) ^ (1 << bit)); });
    listen(i, function (v) { var on = (Math.round(v) >> bit) & 1; b.classList.toggle("on", !!on); });
    return b;
  }

  function toggle(parent, i, label, cls) {
    var b = el("button", "tog" + (cls ? " " + cls : ""), parent, label);
    b.type = "button";
    b.addEventListener("click", function () { set(i, vals[i] > 0.5 ? 0 : 1); });
    listen(i, function (v) { b.classList.toggle("on", v > 0.5); });
    return b;
  }

  function pad(parent, noteNum, label, cls) {
    var b = el("button", "pad" + (cls ? " " + cls : ""), parent, label);
    b.type = "button";
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); note(noteNum, e.shiftKey ? 1.0 : 0.62); b.classList.add("hit"); setTimeout(function () { b.classList.remove("hit"); }, 90); });
    return b;
  }

  // ---- rhythm presets ------------------------------------------------------
  // A preset is role -> 16-char row ("x" hit, "f" hit + flam, "." rest). Roles:
  // K kick, S snare, C clap, H closed hat, O open hat, L/M/T low/mid/hi tom,
  // R rim, B cowbell, Y crash/cymbal, D ride, A total accent. Each machine's
  // `target` says which slot a role plays on it (a role it lacks is skipped;
  // roles mapped to the same slot are OR-ed):
  //   target = { map:{role:slot}, sets:[{trig:{slot:idx}, flam:{slot:idx}, accent:idx, zero:[idx]}],
  //              scale:[idx,val], last:idx, variation:idx }
  // `sets` holds one entry per pattern memory (the 808 has A and B; B takes the
  // preset's `fill` rows if it has any, else the same rows as A).
  var PATTERNS = [
  {"name":"Four on the Floor","rows":{"K":"x...x...x...x...","C":"....x.......x...","H":"x...x...x...x...","O":"..x...x...x...x.","A":"....x.......x..."}},
  {"name":"Techno","rows":{"K":"x...x...x...x...","C":"....x.......x...","H":"xxxxxxxxxxxxxxxx","O":"..x...x...x...x.","R":"...x..x.....x...","A":"x...x...x...x..."}},
  {"name":"Disco","rows":{"K":"x...x...x...x...","S":"....x.......x...","C":"....x.......x...","H":"xxxxxxxxxxxxxxxx","O":"..x...x...x...x.","A":"....x.......x..."}},
  {"name":"Electro","rows":{"K":"x.....x...x.x...","S":"....x.......x...","C":"....x.......x...","H":"x.x.x.x.x.x.x.x.","B":"......x.......x.","A":"....x.......x..."}},
  {"name":"Boom Bap","rows":{"K":"x.....x..x......","S":"....x.......f...","H":"x.x.x.x.x.x.x.x.","O":"..............x.","A":"....x.......x..."}},
  {"name":"Trap","rows":{"K":"x..........x..x.","S":"........x.......","C":"........x.......","H":"x.x.x.x.x.x.xxxx","O":"......x.........","A":"........x......."}},
  {"name":"Drum & Bass","rows":{"K":"x.........x.....","S":"....x.......x...","H":"x.x.x.x.x.x.x.x.","O":"..............x.","A":"....x.......x..."}},
  {"name":"Breakbeat","rows":{"K":"x.x.......xx....","S":"....x.....x.x..x","H":"x.x.x.x.x.x.x.x.","O":"......x.........","A":"....x.......x..."}},
  {"name":"Funk","rows":{"K":"x.....x..x.x....","S":"....x..x.x..x...","H":"xxxxxxxxxxxxxxxx","O":"..............x.","A":"....x.......x..."}},
  {"name":"Reggae One Drop","rows":{"K":"........x.......","R":"........x.......","S":"........x.......","H":"x.x.x.x.x.x.x.x.","A":"........x......."}},
  {"name":"Reggaeton","rows":{"K":"x...x...x...x...","S":"...x..x....x..x.","H":"x.x.x.x.x.x.x.x.","A":"...x..x....x..x."}},
  {"name":"Latin Clave","rows":{"K":"x.......x.......","R":"x..x..x...x.x...","B":"x.x.x.x.x.x.x.x.","L":"....x.......x...","M":".......x.......x","A":"x.......x......."}},
  {"name":"Rock","rows":{"K":"x.......x.x.....","S":"....x.......x...","H":"x.x.x.x.x.x.x.x.","Y":"x...............","A":"....x.......x..."}},
  {"name":"Tom Fill","rows":{"K":"x...............","Y":"x...............","L":"....x.x.........","M":"........x.x.....","T":"............x.f.","A":"x...........x..."}}
]
;

  function rowBits(row, flamOnly) {
    var w = 0;
    for (var s = 0; s < 16; s++) {
      var c = (row || "").charAt(s);
      if (flamOnly ? c === "f" : (c === "x" || c === "f")) w |= 1 << s;
    }
    return w;
  }
  function applyPattern(pat, t) {
    t.sets.forEach(function (ps, n) {
      var rows = (n > 0 && pat.fill) || pat.rows;
      var trig = {}, flam = {};
      for (var slot in ps.trig) trig[slot] = 0;
      for (var fs in ps.flam || {}) flam[fs] = 0;
      for (var role in rows) {
        var slot2 = t.map[role];
        if (!slot2 || !(slot2 in trig)) continue;
        trig[slot2] |= rowBits(rows[role]);
        if (slot2 in flam) flam[slot2] |= rowBits(rows[role], true);
      }
      for (var k in trig) set(ps.trig[k], trig[k]);
      for (var f in flam) set(ps.flam[f], flam[f]);
      if (ps.accent != null) set(ps.accent, rowBits(rows.A));
      (ps.zero || []).forEach(function (i) { set(i, 0); });
    });
    if (t.scale) set(t.scale[0], t.scale[1]);
    if (t.last != null) set(t.last, 16);
    if (t.variation != null) set(t.variation, pat.fill ? 1 : 0);
  }

  // <select> of presets: picking one rewrites the sequencer. `cls` styles it per panel.
  function patternPicker(parent, target, cls) {
    var wrap = el("div", "col-stack", parent);
    el("div", "sel-label", wrap, "Rhythm preset");
    var sel = el("select", "patsel" + (cls ? " " + cls : ""), wrap);
    el("option", "", sel, "Pick a rhythm…").value = "";
    el("option", "", sel, "— Clear pattern —").value = "clear";
    PATTERNS.forEach(function (p, j) { el("option", "", sel, p.name).value = String(j); });
    sel.addEventListener("change", function () {
      if (sel.value === "") return;
      applyPattern(sel.value === "clear" ? { name: "Clear", rows: {} } : PATTERNS[+sel.value], target);
    });
    return wrap;
  }

  // A 16-bit step row stored in one parameter.
  function rowBit(i, step) { return (Math.round(vals[i]) >> step) & 1; }
  function toggleStep(i, step) { set(i, Math.round(vals[i]) ^ (1 << step)); }

  return {
    define: define, get: get, set: set, listen: listen, onDisplay: onDisplay, start: start,
    knob: knob, selector: selector, bitSwitch: bitSwitch, toggle: toggle, pad: pad, note: note,
    rowBit: rowBit, toggleStep: toggleStep, patternPicker: patternPicker, applyPattern: applyPattern, el: el, svg: svg, PD: PD
  };
})();

</script>
<script>
(function () {
  var DEFS = [{"index":0,"key":"AC","name":"Accent","min":0,"max":1,"def":0.6,"step":0},{"index":1,"key":"BD_LEV","name":"BD Level","min":0,"max":1,"def":0.8,"step":0},{"index":2,"key":"BD_TONE","name":"BD Tone","min":0,"max":1,"def":0.5,"step":0},{"index":3,"key":"BD_DEC","name":"BD Decay","min":0,"max":1,"def":0.5,"step":0},{"index":4,"key":"SD_LEV","name":"SD Level","min":0,"max":1,"def":0.75,"step":0},{"index":5,"key":"SD_TONE","name":"SD Tone","min":0,"max":1,"def":0.5,"step":0},{"index":6,"key":"SD_SNAP","name":"SD Snappy","min":0,"max":1,"def":0.55,"step":0},{"index":7,"key":"LT_LEV","name":"LT/LC Level","min":0,"max":1,"def":0.7,"step":0},{"index":8,"key":"LT_TUNE","name":"LT/LC Tuning","min":0,"max":1,"def":0.5,"step":0},{"index":9,"key":"MT_LEV","name":"MT/MC Level","min":0,"max":1,"def":0.7,"step":0},{"index":10,"key":"MT_TUNE","name":"MT/MC Tuning","min":0,"max":1,"def":0.5,"step":0},{"index":11,"key":"HT_LEV","name":"HT/HC Level","min":0,"max":1,"def":0.7,"step":0},{"index":12,"key":"HT_TUNE","name":"HT/HC Tuning","min":0,"max":1,"def":0.5,"step":0},{"index":13,"key":"RS_LEV","name":"RS/CL Level","min":0,"max":1,"def":0.65,"step":0},{"index":14,"key":"CP_LEV","name":"CP/MA Level","min":0,"max":1,"def":0.7,"step":0},{"index":15,"key":"CB_LEV","name":"CB Level","min":0,"max":1,"def":0.55,"step":0},{"index":16,"key":"CY_LEV","name":"CY Level","min":0,"max":1,"def":0.55,"step":0},{"index":17,"key":"CY_TONE","name":"CY Tone","min":0,"max":1,"def":0.5,"step":0},{"index":18,"key":"CY_DEC","name":"CY Decay","min":0,"max":1,"def":0.5,"step":0},{"index":19,"key":"OH_LEV","name":"OH Level","min":0,"max":1,"def":0.6,"step":0},{"index":20,"key":"OH_DEC","name":"OH Decay","min":0,"max":1,"def":0.35,"step":0},{"index":21,"key":"CH_LEV","name":"CH Level","min":0,"max":1,"def":0.65,"step":0},{"index":22,"key":"MASTER","name":"Master Volume","min":0,"max":1,"def":0.8,"step":0},{"index":23,"key":"SWITCH","name":"Voice Select","min":0,"max":31,"def":0,"step":1},{"index":24,"key":"TEMPO","name":"Tempo","min":0,"max":39,"def":21,"step":1},{"index":25,"key":"FINE","name":"Tempo Fine","min":-1,"max":1,"def":0,"step":0},{"index":26,"key":"SCALE","name":"Pre-Scale","min":1,"max":4,"def":3,"step":1},{"index":27,"key":"LAST","name":"Last Step","min":1,"max":16,"def":16,"step":1},{"index":28,"key":"VAR","name":"Basic Variation","min":0,"max":2,"def":0,"step":1},{"index":29,"key":"SOURCE","name":"Clock Source","min":0,"max":2,"def":1,"step":1},{"index":30,"key":"VELMODE","name":"Velocity Mode","min":0,"max":1,"def":0,"step":1},{"index":31,"key":"ROW_A_BD","name":"Pattern A BD","min":0,"max":65535,"def":4369,"step":1},{"index":32,"key":"ROW_A_SD","name":"Pattern A SD","min":0,"max":65535,"def":4112,"step":1},{"index":33,"key":"ROW_A_LT","name":"Pattern A LT","min":0,"max":65535,"def":0,"step":1},{"index":34,"key":"ROW_A_MT","name":"Pattern A MT","min":0,"max":65535,"def":0,"step":1},{"index":35,"key":"ROW_A_HT","name":"Pattern A HT","min":0,"max":65535,"def":0,"step":1},{"index":36,"key":"ROW_A_RS","name":"Pattern A RS","min":0,"max":65535,"def":0,"step":1},{"index":37,"key":"ROW_A_CP","name":"Pattern A CP","min":0,"max":65535,"def":0,"step":1},{"index":38,"key":"ROW_A_CB","name":"Pattern A CB","min":0,"max":65535,"def":0,"step":1},{"index":39,"key":"ROW_A_CY","name":"Pattern A CY","min":0,"max":65535,"def":0,"step":1},{"index":40,"key":"ROW_A_OH","name":"Pattern A OH","min":0,"max":65535,"def":17476,"step":1},{"index":41,"key":"ROW_A_CH","name":"Pattern A CH","min":0,"max":65535,"def":21845,"step":1},{"index":42,"key":"ROW_A_AC","name":"Pattern A AC","min":0,"max":65535,"def":1,"step":1},{"index":43,"key":"ROW_B_BD","name":"Pattern B BD","min":0,"max":65535,"def":4369,"step":1},{"index":44,"key":"ROW_B_SD","name":"Pattern B SD","min":0,"max":65535,"def":4112,"step":1},{"index":45,"key":"ROW_B_LT","name":"Pattern B LT","min":0,"max":65535,"def":32768,"step":1},{"index":46,"key":"ROW_B_MT","name":"Pattern B MT","min":0,"max":65535,"def":16384,"step":1},{"index":47,"key":"ROW_B_HT","name":"Pattern B HT","min":0,"max":65535,"def":8192,"step":1},{"index":48,"key":"ROW_B_RS","name":"Pattern B RS","min":0,"max":65535,"def":0,"step":1},{"index":49,"key":"ROW_B_CP","name":"Pattern B CP","min":0,"max":65535,"def":2176,"step":1},{"index":50,"key":"ROW_B_CB","name":"Pattern B CB","min":0,"max":65535,"def":0,"step":1},{"index":51,"key":"ROW_B_CY","name":"Pattern B CY","min":0,"max":65535,"def":1,"step":1},{"index":52,"key":"ROW_B_OH","name":"Pattern B OH","min":0,"max":65535,"def":17476,"step":1},{"index":53,"key":"ROW_B_CH","name":"Pattern B CH","min":0,"max":65535,"def":5461,"step":1},{"index":54,"key":"ROW_B_AC","name":"Pattern B AC","min":0,"max":65535,"def":4097,"step":1},{"index":55,"key":"WIDTH","name":"Stereo Width","min":0,"max":1,"def":0.35,"step":0},{"index":56,"key":"DRIVE","name":"Drive","min":0,"max":1,"def":0,"step":0},{"index":57,"key":"BD_TRIM","name":"BD Tune Trim","min":-3,"max":3,"def":0,"step":0},{"index":58,"key":"SD_TRIM","name":"SD Tune Trim","min":-3,"max":3,"def":0,"step":0},{"index":59,"key":"RUN","name":"Run","min":0,"max":1,"def":0,"step":1}];
  Kit.define(DEFS);
  var P = {}; DEFS.forEach(function (d) { P[d.key] = d.index; });
  var el = Kit.el, m = document.getElementById("m");
  var pct = function (v) { return Math.round(v * 100) + ""; };
  var SLOTS = ["BD","SD","LT","MT","HT","RS","CP","CB","CY","OH","CH","AC"];

  // ---------- top bar ------------------------------------------------------
  var top = el("div", "top", m);
  var brand = el("div", "brand", top);
  brand.innerHTML = "<b>BRIDGEWELL <i>80</i></b><span>Analog rhythm composer</span>";

  var clock = el("div", "grp", top);
  Kit.selector(clock, P.SOURCE, { label: "Clock", options: ["MIDI", "DAW", "INT"] });
  var runBtn = Kit.toggle(clock, P.RUN, "START / STOP");
  Kit.listen(P.SOURCE, function (v) { runBtn.style.opacity = v === 2 ? 1 : 0.35; runBtn.title = v === 2 ? "" : "Start/Stop runs the internal clock (INT)"; });
  var tempoTxt = function () {
    var click = Kit.get(P.TEMPO) + Kit.get(P.FINE) * 0.5;
    return (40 * Math.pow(7.5, click / 39)).toFixed(1) + " bpm";
  };
  var tk = Kit.knob(clock, P.TEMPO, { label: "Tempo", cls: "big", size: 52, sens: 0.6, fmt: tempoTxt });
  Kit.knob(clock, P.FINE, { label: "Fine", size: 34, fmt: function () { return ""; } });
  Kit.listen(P.FINE, function () { tk.querySelector(".k-val").textContent = tempoTxt(); });

  var mast = el("div", "grp", top);
  Kit.knob(mast, P.MASTER, { label: "Volume", cls: "big", size: 52, fmt: pct });
  var meter = el("div", "meter", mast), meterBar = el("i", "", meter);

  // ---------- instrument strip ---------------------------------------------
  var strip = el("div", "strip", m);
  var leds = {};
  function column(title, sub, slot, note, build) {
    var c = el("div", "inst", strip);
    var n = el("div", "inst-name", c);
    var line = el("span", "nm", n);
    var led = el("span", "led", line); el("span", "", line, title);
    if (sub) el("small", "", n, sub);
    if (slot != null) leds[slot] = led;
    n.title = "Click to play (shift = accent)";
    n.addEventListener("pointerdown", function (e) { e.preventDefault(); Kit.note(typeof note === "function" ? note() : note, e.shiftKey ? 1 : 0.62); });
    var k = el("div", "knobs", c);
    build(c, k);
    return c;
  }
  var sw = function (bit) { return (Math.round(Kit.get(P.SWITCH)) >> bit) & 1; };
  column("Accent", null, 11, 36, function (c, k) { Kit.knob(k, P.AC, { label: "Level", fmt: pct }); });
  column("Bass Drum", null, 0, 36, function (c, k) {
    Kit.knob(k, P.BD_LEV, { label: "Level", fmt: pct }); Kit.knob(k, P.BD_TONE, { label: "Tone", fmt: pct }); Kit.knob(k, P.BD_DEC, { label: "Decay", fmt: pct });
  });
  column("Snare Drum", null, 1, 38, function (c, k) {
    Kit.knob(k, P.SD_LEV, { label: "Level", fmt: pct }); Kit.knob(k, P.SD_TONE, { label: "Tone", fmt: pct }); Kit.knob(k, P.SD_SNAP, { label: "Snappy", fmt: pct });
  });
  [["Low", 0, P.LT_LEV, P.LT_TUNE, 41, 64, 2], ["Mid", 1, P.MT_LEV, P.MT_TUNE, 45, 63, 3], ["Hi", 2, P.HT_LEV, P.HT_TUNE, 48, 62, 4]].forEach(function (t) {
    column(t[0] + " Tom", "/ " + t[0] + " Conga", t[6], function () { return sw(t[1]) ? t[5] : t[4]; }, function (c, k) {
      c.insertBefore(Kit.bitSwitch(c, P.SWITCH, t[1], "TOM", "CONGA"), k);
      Kit.knob(k, t[3], { label: "Tuning", fmt: pct }); Kit.knob(k, t[2], { label: "Level", fmt: pct });
    });
  });
  column("Rim Shot", "/ Claves", 5, function () { return sw(3) ? 75 : 37; }, function (c, k) {
    c.insertBefore(Kit.bitSwitch(c, P.SWITCH, 3, "RS", "CL"), k); Kit.knob(k, P.RS_LEV, { label: "Level", fmt: pct });
  });
  column("Hand Clap", "/ Maracas", 6, function () { return sw(4) ? 70 : 39; }, function (c, k) {
    c.insertBefore(Kit.bitSwitch(c, P.SWITCH, 4, "CP", "MA"), k); Kit.knob(k, P.CP_LEV, { label: "Level", fmt: pct });
  });
  column("Cowbell", null, 7, 56, function (c, k) { Kit.knob(k, P.CB_LEV, { label: "Level", fmt: pct }); });
  column("Cymbal", null, 8, 49, function (c, k) {
    Kit.knob(k, P.CY_LEV, { label: "Level", fmt: pct }); Kit.knob(k, P.CY_TONE, { label: "Tone", fmt: pct }); Kit.knob(k, P.CY_DEC, { label: "Decay", fmt: pct });
  });
  column("Open", "Hi-hat", 9, 46, function (c, k) { Kit.knob(k, P.OH_LEV, { label: "Level", fmt: pct }); Kit.knob(k, P.OH_DEC, { label: "Decay", fmt: pct }); });
  column("Closed", "Hi-hat", 10, 42, function (c, k) { Kit.knob(k, P.CH_LEV, { label: "Level", fmt: pct }); });

  // ---------- sequencer controls -------------------------------------------
  var bar = el("div", "seqbar", m);
  var g1 = el("div", "grp", bar);
  var pre = Kit.selector(g1, P.SCALE, { label: "Pre-scale · steps per beat", options: ["1 · 3", "2 · 6", "3 · 4", "4 · 8"] });
  pre.title = "1: 8th triplets · 2: 16th triplets · 3: 16ths · 4: 32nds";
  Kit.knob(g1, P.LAST, { label: "Last step", size: 36, sens: 0.5, fmt: function (v) { return v + ""; } });
  Kit.selector(g1, P.VAR, { label: "Basic variation", options: ["A", "AB", "B"] });

  var gp = el("div", "grp", bar);
  (function () {
    var SL = ["BD","SD","LT","MT","HT","RS","CP","CB","CY","OH","CH"];
    var sets = ["ROW_A_", "ROW_B_"].map(function (pre) {
      var trig = {}; SL.forEach(function (k, i) { trig[k] = P[pre + "BD"] + i; });
      return { trig: trig, accent: P[pre + "AC"] };
    });
    Kit.patternPicker(gp, { map: { K: "BD", S: "SD", C: "CP", H: "CH", O: "OH", L: "LT", M: "MT", T: "HT", R: "RS", B: "CB", Y: "CY" },
      sets: sets, scale: [P.SCALE, 3], last: P.LAST, variation: P.VAR });
  })();
  var g2 = el("div", "grp", bar);
  var editWrap = el("div", "col-stack", g2);
  el("div", "sel-label", editWrap, "Write to");
  var editRow = el("div", "sel-row", editWrap);
  var editB = false, editBtns = ["A", "B"].map(function (lab, j) {
    var b = el("button", "sel-btn", editRow, lab); b.type = "button";
    b.addEventListener("click", function () { editB = j === 1; editManual = true; paintSteps(); paintGrid(); paintEdit(); });
    return b;
  });
  var editManual = false;
  function paintEdit() { editBtns.forEach(function (b, j) { b.classList.toggle("on", (j === 1) === editB); }); }
  Kit.listen(P.VAR, function (v) { if (!editManual) { editB = v === 2; paintEdit(); paintSteps(); paintGrid(); } });

  var instWrap = el("div", "col-stack", g2);
  el("div", "sel-label", instWrap, "Instrument");
  var instRow = el("div", "instsel", instWrap);
  var cur = 0;
  var instBtns = ["BD","SD","LT","MT","HT","RS","CP","CB","CY","OH","CH","AC"].map(function (lab, j) {
    var b = el("button", "isb", instRow, lab); b.type = "button";
    b.addEventListener("click", function () { cur = j; instBtns.forEach(function (x, k) { x.classList.toggle("on", k === j); }); paintSteps(); });
    return b;
  });
  instBtns[0].classList.add("on");
  var clr = el("button", "btn", g2, "CLEAR"); clr.type = "button"; clr.title = "Clear this instrument's row";
  clr.addEventListener("click", function () { Kit.set(rowParam(cur), 0); });

  var g3 = el("div", "grp", bar);
  Kit.toggle(g3, P.VELMODE, "DYNAMIC VELOCITY").title = "Off: like the hardware — velocity 100+ is accented, everything else is normal. On: softer notes are quieter.";
  var gridBtn = el("button", "btn", g3, "GRID"); gridBtn.type = "button";

  // ---------- step keys ------------------------------------------------------
  function rowParam(slot) { return (editB ? P.ROW_B_BD : P.ROW_A_BD) + slot; }
  var stepsEl = el("div", "steps", m);
  var keys = [];
  for (var s = 0; s < 16; s++) (function (s) {
    var b = el("button", "step g" + (1 + (s >> 2)), stepsEl); b.type = "button";
    el("span", "num", b, s + 1); el("span", "sled", b);
    b.addEventListener("click", function () { Kit.toggleStep(rowParam(cur), s); });
    keys.push(b);
  })(s);
  var beats = el("div", "beats", m);
  var beatLabels = [];
  for (var bi = 0; bi < 16; bi++) beatLabels.push(el("span", "", beats, ""));

  var playStep = -1;
  function paintSteps() {
    if (!keys || !keys.length || !beatLabels) return;      // listeners fire before the keys exist
    var rp = rowParam(cur), last = Kit.get(P.LAST);
    keys.forEach(function (k, i) {
      k.classList.toggle("on", !!Kit.rowBit(rp, i));
      k.classList.toggle("play", i === playStep);
      k.classList.toggle("beyond", i >= last);
    });
    var spb = [3, 6, 4, 8][Kit.get(P.SCALE) - 1];
    beatLabels.forEach(function (l, i) { l.textContent = i < last && i % spb === 0 ? "BEAT " + (i / spb + 1) : ""; });
  }

  // ---------- full-pattern grid -----------------------------------------------
  var grid = el("div", "grid", m), cells = [];
  SLOTS.forEach(function (name, slot) {
    var r = el("div", "grow" + (slot === 11 ? " ac" : ""), grid);
    el("b", "", r, name);
    cells[slot] = [];
    for (var s = 0; s < 16; s++) (function (s) {
      var c = el("div", "gc" + ((s >> 2) % 2 ? " q" : ""), r);
      c.addEventListener("click", function () { Kit.toggleStep(rowParam(slot), s); });
      cells[slot].push(c);
    })(s);
  });
  function paintGrid() {
    if (!grid || !cells.length || !grid.classList.contains("show")) return;
    SLOTS.forEach(function (_, slot) {
      var rp = rowParam(slot);
      cells[slot].forEach(function (c, s) { c.classList.toggle("on", !!Kit.rowBit(rp, s)); c.classList.toggle("play", s === playStep); });
    });
  }
  gridBtn.addEventListener("click", function () { grid.classList.toggle("show"); gridBtn.classList.toggle("on"); paintGrid(); fit(); });

  // ---------- extras ----------------------------------------------------------
  var foot = el("div", "foot", m);
  var ex = el("div", "grp", foot);
  var t = el("div", "col-stack", ex); el("div", "grp-title", t, "Mixer");
  var kx = el("div", "knobs", t);
  Kit.knob(kx, P.WIDTH, { label: "Stereo", fmt: pct }); Kit.knob(kx, P.DRIVE, { label: "Drive", fmt: pct });
  var tr = el("div", "grp", foot);
  var t2 = el("div", "col-stack", tr); el("div", "grp-title", t2, "Service trimmers");
  var kt = el("div", "knobs", t2);
  var semi = function (v) { return (v > 0 ? "+" : "") + v.toFixed(2) + " st"; };
  Kit.knob(kt, P.BD_TRIM, { label: "BD tune", fmt: semi }); Kit.knob(kt, P.SD_TRIM, { label: "SD tune", fmt: semi });
  foot.appendChild(g3);
  el("div", "hint", foot, "MIDI: 36 BD · 38 SD · 41/45/48 toms · 62–64 congas · 37 RS · 75 CL · 39 CP · 70 MA · 56 CB · 49 CY · 46 OH · 42 CH. Drag knobs (shift = fine), double-click to reset.");

  // ---------- live display from the engine -------------------------------------
  Kit.onDisplay(function (d) {
    var ps = d[2] > 0.5 ? Math.round(d[0]) : -1;
    if (ps !== playStep) { playStep = ps; paintSteps(); paintGrid(); }
    for (var i = 0; i < 12; i++) if (leds[i]) {
      var a = Math.max(0, Math.min(1, d[3 + i]));
      leds[i].style.background = a > 0.03 ? "rgba(255," + Math.round(59 + 120 * (1 - a)) + ",47," + (0.35 + 0.65 * a) + ")" : "";
      leds[i].style.boxShadow = a > 0.2 ? "0 0 6px #ff3b2f" : "";
    }
    meterBar.style.height = Math.min(100, Math.round(d[15] * 100)) + "%";
  });

  // every row/length/scale change repaints the keys and grid
  for (var ri = 0; ri < 12; ri++) { Kit.listen(P.ROW_A_BD + ri, function () { paintSteps(); paintGrid(); }); Kit.listen(P.ROW_B_BD + ri, function () { paintSteps(); paintGrid(); }); }
  Kit.listen(P.LAST, paintSteps); Kit.listen(P.SCALE, paintSteps);
  paintEdit();

  // ---------- fit the panel to the window ----------------------------------------
  var fitEl = document.getElementById("fit");
  function fit() {
    var w = m.offsetWidth, h = m.offsetHeight;
    var s = Math.min(window.innerWidth / w, window.innerHeight / h);
    fitEl.style.transform = "scale(" + s + ")";
    fitEl.style.left = Math.max(0, (window.innerWidth - w * s) / 2) + "px";
  }
  window.addEventListener("resize", fit); fit();

  Kit.start();
})();
</script>
</body>
</html>
