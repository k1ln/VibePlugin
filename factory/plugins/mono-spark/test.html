<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mono Spark — test bench</title><style>
  :root{--ac:#e94f37}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:13px ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e7eef6;

  .top .led{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}

  .top .sub{font-size:11px;color:#7c8aa3;margin-left:auto}

  .bar{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:11px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px 16px;
    box-shadow:0 16px 40px rgba(0,0,0,.4)}

  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{font:inherit;color:#06080c;background:var(--ac);border:0;border-radius:10px;padding:9px 17px;font-weight:800;cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}
  button.off{background:#28313f;color:#e7eef6}
  select,input[type=file]{font:inherit;color:#e7eef6;background:#10151e;border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:7px 9px}
  label{display:flex;gap:8px;align-items:center;color:#aeb9cc}
  .st{font-size:12px;color:#8da0bd;min-height:16px}
  .krow{display:flex;gap:8px;align-items:center;color:#aeb9cc;font-size:12px}
  .krow .klabel{font-weight:600;letter-spacing:.03em}
  .krow .oct{padding:4px 13px;font-size:16px;line-height:1;background:#28313f;color:#e7eef6;border-radius:8px}
  .krow .octval{min-width:22px;text-align:center;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
  .krow .khint{margin-left:4px;color:#7c8aa3;font-size:11px}
  .kb{display:flex;gap:3px;flex-wrap:wrap}
  .kb .key{width:30px;height:80px;border-radius:0 0 7px 7px;background:linear-gradient(#f4f7fb,#cdd5e0);
    border:1px solid #2a3344;cursor:pointer;color:#1a2230;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;transition:.08s}
  .kb .key.bk{background:linear-gradient(#2b3340,#10151d);color:#9fb0c8;height:52px;width:22px;margin:0 -12px;z-index:2}
  .kb .key.dn{background:linear-gradient(var(--ac),#fff);color:#06080c;transform:translateY(2px)}
  </style></head><body>

c2),#7fb020);box-shadow:0 0 6px rgba(246,196,69,.4)}\n  .tie{width:30px;font-size:7px;font-weight:700;text-align:center;padding:2px 0;border-radius:3px;border:1px solid #000;\n    color:#6b7079;background:#16181c;cursor:pointer;letter-spacing:.03em}\n  .tie.on{color:#160c04;background:#4fb3ff;box-shadow:0 0 6px rgba(79,179,255,.5)}\n  .foot{padding:8px 14px 12px;background:#0b0c0e;font-size:8.5px;color:#6b7079;display:flex;gap:14px;flex-wrap:wrap}\n  .foot b{color:#9aa0aa}\n<\/style><script>window.vstai={onReady:function(f){f()},setParam:function(i,v){parent.postMessage({t:\"p\",i:i,v:v},\"*\")},noteOn:function(n,v){parent.postMessage({t:\"on\",id:n,v:v},\"*\")},noteOff:function(id){parent.postMessage({t:\"off\",id:id},\"*\")}};<\/script><\/head><body>\n<div class=\"box\">\n  <div class=\"plate\">\n    <div class=\"top\">\n      <div class=\"brand\">\n        <div class=\"r\">Roland-style<\/div>\n        <div class=\"n\">Mono<b>·<\/b>Spark<\/div>\n        <div class=\"s\">Monophonic Synthesizer<\/div>\n      <\/div>\n      <div id=\"tuneHost\"><\/div>\n    <\/div>\n    <div class=\"rack\" id=\"rack\"><\/div>\n  <\/div>\n  <div class=\"deck\">\n    <div class=\"drow\" id=\"ctrls\"><\/div>\n    <div class=\"drow\">\n      <div class=\"grp\"><span class=\"gl\">Arp<\/span><span id=\"arpBtns\" style=\"display:flex;gap:5px\"><\/span><\/div>\n      <div class=\"grp\"><span class=\"gl\">Seq<\/span><span id=\"seqBtns\" style=\"display:flex;gap:5px\"><\/span><\/div>\n      <div class=\"hint\"><b>Step sequencer<\/b> — click a step to toggle rest, ▲▼ set pitch, <b>TIE<\/b> slurs (glide) from the previous note. Edits rewrite the pattern live.<\/div>\n    <\/div>\n    <div class=\"grid\" id=\"grid\"><\/div>\n  <\/div>\n  <div class=\"foot\">\n    <span><b>VCO<\/b> saw+pulse+sub mixed · <b>SUB<\/b> 1/2-oct + narrow · <b>PWM<\/b> man/lfo/env<\/span>\n    <span><b>VCF<\/b> 4-pole self-oscillating · <b>ENV<\/b> ADSR (gate/trig/lfo) · <b>MOD<\/b> LFO tri/sq/rnd/noise<\/span>\n    <span><b>ARP<\/b> up/u&amp;d/down · <b>SEQ<\/b> 16-step · <b>HOLD<\/b> latch<\/span>\n  <\/div>\n<\/div>\n<script>\n(function(){\n  \"use strict\";\n  // ---- param table (mirror of spec.json) --------------------------------\n  var PD = {};\n  function d(i,mn,mx,df){ PD[i]={min:mn,max:mx,def:df}; }\n  d(0,-1,1,0); d(1,0,3,1); d(2,0,1,0); d(3,0,2,0); d(4,0,1,.5);\n  d(5,0,1,.85); d(6,0,1,0); d(7,0,1,.6); d(8,0,2,0); d(9,0,1,0);\n  d(10,0,1,.35); d(11,0,1,.35); d(12,0,1,.6); d(13,0,1,0); d(14,0,1,.5);\n  d(15,0,1,0); d(16,0,1,.02); d(17,0,1,.4); d(18,0,1,.12); d(19,0,1,.15);\n  d(20,0,2,0); d(21,0,1,.3); d(22,0,3,0); d(23,0,1,.75); d(24,0,1,.2);\n  d(25,0,2,0); d(26,0,2,1); d(27,0,1,.17); d(28,0,1,0); d(29,0,1,.3);\n  d(30,-1,1,0); d(31,40,300,130); d(32,0,2,0); d(33,0,1,0); d(34,0,15,2);\n\n  var vals = {}; for (var k in PD) vals[k] = PD[k].def;\n  var listeners = {};\n  var V = window.vstai;\n\n  function push(i, v){\n    vals[i] = v;\n    if (V && V.setParam) V.setParam(+i, v);\n    var ls = listeners[i]; if (ls) for (var j=0;j<ls.length;j++) ls[j]();\n  }\n  function listen(i, fn){ (listeners[i] = listeners[i] || []).push(fn); }\n  function el(tag, cls, parent){ var e=document.createElement(tag); if(cls)e.className=cls; if(parent)parent.appendChild(e); return e; }\n  function midiHz(m){ return 440*Math.pow(2,(m-69)/12); }\n  var NOTES=[\"C\",\"C#\",\"D\",\"D#\",\"E\",\"F\",\"F#\",\"G\",\"G#\",\"A\",\"A#\",\"B\"];\n  function noteName(m){ return NOTES[((m%12)+12)%12] + (Math.floor(m/12)-1); }\n\n  // ---- vertical fader ---------------------------------------------------\n  function fader(parent, idx, label, fmt){\n    var p = PD[idx];\n    var box = el(\"div\",\"fd\",parent);\n    var track = el(\"div\",\"track\",box);\n    var cap = el(\"div\",\"cap\",track);\n    var lb = el(\"div\",\"lb\",box); lb.textContent = label;\n    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }\n    function paint(){ cap.style.bottom = (norm()*(96-15)) + \"px\"; if(fmt) lb.setAttribute(\"title\",fmt(vals[idx])); }\n    function setN(nn){\n      nn = nn<0?0:(nn>1?1:nn);\n      var v = p.min + (p.max-p.min)*nn;\n      if (p.min >= 0 && p.max-p.min >= 2 && (p.max-p.min)%1===0) v = Math.round(v);\n      push(idx, v); paint();\n    }\n    var last=0;\n    track.addEventListener(\"pointerdown\", function(e){ track._d=1; last=e.clientY; track.setPointerCapture(e.pointerId);\n      var r=track.getBoundingClientRect(); setN(1-(e.clientY-r.top)/r.height); e.preventDefault(); });\n    track.addEventListener(\"pointermove\", function(e){ if(!track._d)return; var r=track.getBoundingClientRect(); setN(1-(e.clientY-r.top)/r.height); });\n    track.addEventListener(\"pointerup\", function(){ track._d=0; });\n    track.addEventListener(\"pointercancel\", function(){ track._d=0; });\n    track.addEventListener(\"dblclick\", function(){ push(idx,p.def); paint(); });\n    track.addEventListener(\"wheel\", function(e){ e.preventDefault(); setN(norm()+(e.deltaY<0?0.04:-0.04)); }, {passive:false});\n    listen(idx, paint); paint();\n    return box;\n  }\n\n  // ---- rotary knob ------------------------------------------------------\n  function knob(parent, idx, label, fmt){\n    var p = PD[idx];\n    var box = el(\"div\",\"kn\",parent);\n    var dial = el(\"div\",\"dial\",box);\n    var notch = el(\"div\",\"notch\",dial);\n    var lb = el(\"div\",\"lb\",box); lb.textContent = label;\n    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }\n    function paint(){ notch.style.transform = \"translateX(-50%) rotate(\" + (-135 + norm()*270) + \"deg)\"; if(fmt) lb.setAttribute(\"title\",fmt(vals[idx])); }\n    function setN(nn){\n      nn = nn<0?0:(nn>1?1:nn);\n      var v = p.min + (p.max-p.min)*nn;\n      if (p.min >= 0 && p.max-p.min >= 2 && (p.max-p.min)%1===0) v = Math.round(v);\n      push(idx, v); paint();\n    }\n    var last=0;\n    dial.addEventListener(\"pointerdown\", function(e){ dial._d=1; last=e.clientY; dial.setPointerCapture(e.pointerId); e.preventDefault(); });\n    dial.addEventListener(\"pointermove\", function(e){ if(!dial._d)return; var dy=last-e.clientY; last=e.clientY; setN(norm()+dy/160); });\n    dial.addEventListener(\"pointerup\", function(){ dial._d=0; });\n    dial.addEventListener(\"pointercancel\", function(){ dial._d=0; });\n    dial.addEventListener(\"dblclick\", function(){ push(idx,p.def); paint(); });\n    dial.addEventListener(\"wheel\", function(e){ e.preventDefault(); setN(norm()+(e.deltaY<0?0.05:-0.05)); }, {passive:false});\n    listen(idx, paint); paint();\n    return box;\n  }\n\n  // ---- vertical N-way selector ------------------------------------------\n  function selector(parent, idx, label, opts){ // opts top→bottom = high value→low\n    var box = el(\"div\",\"sw\",parent);\n    var stk = el(\"div\",\"stk\",box);\n    var cells = [];\n    for (var i=0;i<opts.length;i++){\n      var v = opts.length-1-i;               // top cell = highest value\n      var c = el(\"div\",\"\",stk); c.textContent = opts[i]; c.dataset.v = v; cells.push(c);\n      (function(val){ c.addEventListener(\"click\", function(){ push(idx, val); paint(); }); })(v);\n    }\n    var lb = el(\"div\",\"lb\",box); lb.textContent = label;\n    function paint(){ var cur=Math.round(vals[idx]); for(var i=0;i<cells.length;i++) cells[i].classList.toggle(\"on\", +cells[i].dataset.v===cur); }\n    listen(idx, paint); paint();\n    return box;\n  }\n\n  function section(parent, title){ var s=el(\"div\",\"sec\",parent); el(\"div\",\"h\",s).textContent=title; var r=el(\"div\",\"row\",s); return r; }\n\n  // ---- build the plate --------------------------------------------------\n  var pct = function(v){ return Math.round(v*100)+\"\"; };\n  knob(document.getElementById(\"tuneHost\"), 0, \"Tune\", function(v){ return (v>=0?\"+\":\"\")+Math.round(v*50)+\"c\"; });\n\n  var rack = document.getElementById(\"rack\");\n  // MODULATOR (LFO)\n  var mod = section(rack,\"Modulator\");\n  fader(mod,21,\"Rate\",pct);\n  selector(mod,22,\"Wave\",[\"NOI\",\"RND\",\"☐\",\"∿\"]); // top=noise(3)…∿ triangle(0)\n  // VCO\n  var vco = section(rack,\"VCO\");\n  fader(vco,2,\"Mod\",pct);\n  knob(vco,1,\"Range\",function(v){ return [\"16'\",\"8'\",\"4'\",\"2'\"][Math.round(v)]; });\n  fader(vco,4,\"PW\",pct);\n  selector(vco,3,\"PWM\",[\"ENV\",\"LFO\",\"MAN\"]); // top=ENV(2)…MAN(0)\n  // SOURCE MIXER\n  var mix = section(rack,\"Source Mixer\");\n  fader(mix,6,\"Pulse\",pct);\n  fader(mix,5,\"Saw\",pct);\n  fader(mix,7,\"Sub\",pct);\n  selector(mix,8,\"Sub\",[\"2♭\",\"2\",\"1\"]); // top=narrow(2)…1oct(0)\n  fader(mix,9,\"Noise\",pct);\n  // VCF\n  var vcf = section(rack,\"VCF\");\n  fader(vcf,10,\"Freq\",pct);\n  fader(vcf,11,\"Res\",pct);\n  fader(vcf,12,\"Env\",pct);\n  fader(vcf,13,\"Mod\",pct);\n  fader(vcf,14,\"Kybd\",pct);\n  // VCA\n  var vca = section(rack,\"VCA\");\n  selector(vca,15,\"Src\",[\"GATE\",\"ENV\"]); // top=GATE(1), ENV(0)\n  // ENV\n  var env = section(rack,\"Envelope\");\n  fader(env,16,\"A\",pct);\n  fader(env,17,\"D\",pct);\n  fader(env,18,\"S\",pct);\n  fader(env,19,\"R\",pct);\n  selector(env,20,\"Trig\",[\"LFO\",\"GAT\",\"G+T\"]); // top=LFO(2)…GATE+TRIG(0)\n\n  // ---- controllers deck row --------------------------------------------\n  var ctrls = document.getElementById(\"ctrls\");\n  var cg1 = el(\"div\",\"grp\",ctrls); el(\"span\",\"gl\",cg1).textContent=\"Out\"; knob(cg1,23,\"Volume\",pct);\n  var cg2 = el(\"div\",\"grp\",ctrls); el(\"span\",\"gl\",cg2).textContent=\"Porta\";\n  knob(cg2,24,\"Time\",pct); selector(cg2,25,\"Mode\",[\"AUTO\",\"ON\",\"OFF\"]);\n  var cg3 = el(\"div\",\"grp\",ctrls); el(\"span\",\"gl\",cg3).textContent=\"Kbd\";\n  selector(cg3,26,\"Trans\",[\"H\",\"M\",\"L\"]);\n  var cg4 = el(\"div\",\"grp\",ctrls); el(\"span\",\"gl\",cg4).textContent=\"Bender\";\n  fader(cg4,27,\"VCO\",pct); fader(cg4,28,\"VCF\",pct); fader(cg4,29,\"LFOmod\",pct);\n  knob(cg4,30,\"Lever\",function(v){ return (v>=0?\"+\":\"\")+Math.round(v*100); });\n  fader(cg4,33,\"Grip\
