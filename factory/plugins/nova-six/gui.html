<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Six</title>
<style>
  :root{ --ac:#3f7fd6; --ac2:#e8543a; --panel1:#20242b; --panel2:#14171c; --ink:#dfe4ec; --dim:#8b929e; }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none}
  html,body{margin:0;min-height:100%}
  body{font:11px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background:radial-gradient(120% 90% at 50% -10%,#2b2f37 0%,#0b0d11 60%,#050608 100%);
    display:flex;align-items:flex-start;justify-content:center;padding:14px 6px}
  .synth{display:flex;max-width:1220px;width:100%;border-radius:11px;overflow:hidden;
    box-shadow:0 26px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06)}
  .cheek{width:20px;flex:0 0 20px;background:linear-gradient(90deg,#2a2d33,#16181d)}
  .core{flex:1;background:linear-gradient(180deg,var(--panel1),var(--panel2));padding:10px 12px 12px;min-width:0}
  /* header */
  .head{display:flex;align-items:center;gap:14px;padding:2px 4px 9px;border-bottom:1px solid rgba(255,255,255,.1)}
  .logo{font-size:23px;font-weight:800;letter-spacing:.02em;font-style:italic;
    background:linear-gradient(90deg,#f4f6f9,#aeb7c6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo i{color:var(--ac);font-style:italic}
  .tag{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .headfill{flex:1}
  .lcd{display:flex;align-items:center;gap:8px}
  .lcd .scr{min-width:82px;text-align:right;background:#0a1420;border:1px solid #000;border-radius:5px;
    padding:3px 9px;font:700 19px/1 "Menlo","Consolas",monospace;color:#5bc0ff;
    text-shadow:0 0 7px rgba(63,127,214,.85),0 0 18px rgba(63,127,214,.4);letter-spacing:.06em}
  .lcd .what{font-size:8.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;max-width:90px;text-align:left}
  /* rows & sections */
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:stretch}
  .sec{border:1px solid rgba(255,255,255,.13);border-radius:6px;padding:18px 8px 7px;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));flex:0 0 auto}
  .sec>b{position:absolute;top:0;left:0;right:0;padding:2px 8px;font-size:8.5px;font-weight:700;
    letter-spacing:.16em;color:#0c0f13;text-transform:uppercase;white-space:nowrap;border-radius:5px 5px 0 0}
  .sec.c1>b{background:linear-gradient(90deg,#e8e8e8,#c7ccd3)}
  .sec.c2>b{background:linear-gradient(90deg,#e8543a,#c23a26);color:#fff}
  .sec.c3>b{background:linear-gradient(90deg,#f0a83a,#d4841f)}
  .sec.c4>b{background:linear-gradient(90deg,#3f7fd6,#2b5ea8);color:#fff}
  .sec.c5>b{background:linear-gradient(90deg,#4fae8b,#2f8064);color:#fff}
  .bank{display:flex;gap:3px 8px;align-items:flex-start;flex-wrap:nowrap}
  .col{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:flex-start}
  /* vertical slider */
  .sl{display:flex;flex-direction:column;align-items:center;gap:4px;width:34px}
  .sl .track{position:relative;width:16px;height:92px;border-radius:4px;cursor:ns-resize;touch-action:none;
    background:linear-gradient(90deg,#0a0c10,#1b1f26 45%,#0a0c10);border:1px solid #000;
    box-shadow:inset 0 0 4px rgba(0,0,0,.8)}
  .sl .track::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;margin-left:-1px;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.18) 0 1px,transparent 1px 9px)}
  .sl .cap{position:absolute;left:-4px;width:24px;height:14px;margin-top:-7px;border-radius:3px;
    background:linear-gradient(180deg,#eef1f5,#9aa2ad 55%,#5b626c);border:1px solid #05070a;
    box-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none}
  .sl .cap::after{content:"";position:absolute;left:2px;right:2px;top:6px;height:2px;background:var(--ac);border-radius:1px}
  .sl .lb{font-size:7.5px;letter-spacing:.05em;color:var(--dim);text-transform:uppercase;text-align:center;
    line-height:1.25;min-height:19px;max-width:38px}
  /* led button */
  .bt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:38px}
  .bt .sq{width:24px;height:15px;border-radius:3px;border:1px solid #000;position:relative;
    background:linear-gradient(180deg,#3a404b,#181b21);box-shadow:0 2px 3px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14)}
  .bt .sq::after{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:6px;height:3.5px;border-radius:2px;
    background:#233; transition:.12s}
  .bt.on .sq::after{background:var(--ac2);box-shadow:0 0 7px var(--ac2),0 0 13px rgba(232,84,58,.5)}
  .bt:active .sq{transform:translateY(1px)}
  .bt .lb{font-size:7.5px;letter-spacing:.05em;color:var(--dim);text-transform:uppercase;text-align:center;white-space:nowrap}
  /* selector (LED ladder) */
  .sel{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
  .sel>i{font-size:7.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;font-style:normal;margin-bottom:1px}
  .sel .opt{display:flex;align-items:center;gap:4px;cursor:pointer;padding:0 1px}
  .sel .led{width:6px;height:6px;border-radius:50%;background:#1a2a1a;border:1px solid #000;transition:.1s}
  .sel .opt.on .led{background:var(--ac);box-shadow:0 0 6px var(--ac)}
  .sel .opt span{font-size:7.5px;letter-spacing:.05em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
  .sel .opt.on span{color:#eef2f7}
  /* bender lever */
  .lever{display:flex;flex-direction:column;align-items:center;gap:4px}
  .lever .slot{width:120px;height:26px;border-radius:5px;background:#08090c;border:1px solid #000;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.9);position:relative;cursor:ew-resize;touch-action:none;overflow:hidden}
  .lever .grip{position:absolute;top:2px;bottom:2px;width:30px;border-radius:3px;
    background:linear-gradient(90deg,#3d434e 0 3px,#22262d 3px 6px);background-size:6px 100%;
    border:1px solid #000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);left:45px}
  .lever .lb{font-size:7.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .foot{margin-top:10px;padding-top:7px;border-top:1px solid rgba(255,255,255,.08);font-size:9px;color:#79808c;
    display:flex;gap:16px;flex-wrap:wrap}
  .foot b{color:#a9b0bc;font-weight:600}
</style></head><body>
<div class="synth">
  <div class="cheek"></div>
  <div class="core">
    <div class="head">
      <div><div class="logo">nova<i>·</i>six</div><div class="tag">six-voice programmable polyphonic</div></div>
      <div class="headfill"></div>
      <div class="lcd"><div class="what" id="lcdWhat">program</div><div class="scr" id="lcd">A11</div></div>
    </div>
    <div class="row" id="row1"></div>
    <div class="row" id="row2"></div>
    <div class="foot">
      <span><b>DCO</b> saw &amp; pulse sound together; PWM MODE picks manual width or LFO sweep</span>
      <span><b>HPF</b> 0 boosts lows · 1 flat · 2/3 cut lows</span>
      <span><b>VCF ENV</b> polarity +/- · <b>VCA</b> ENV or GATE</span>
      <span><b>Chorus</b> I, II or both (I+II)</span>
    </div>
  </div>
  <div class="cheek"></div>
</div>
<script>
(function(){
  "use strict";
  // ---- param table (mirror of spec.json) --------------------------------
  var PD = {};
  function d(i,mn,mx,df){ PD[i]={min:mn,max:mx,def:df}; }
  d(0,0,1,.32); d(1,0,1,.2); d(2,0,1,0); d(3,0,1,.4); d(4,0,1,.3); d(5,0,1,0);
  d(6,0,2,1); d(7,0,7,7); d(8,0,3,0); d(9,0,1,.45); d(10,0,1,.15); d(11,0,1,.5);
  d(12,0,1,.06); d(13,0,1,.4); d(14,0,1,0); d(15,0,1,0); d(16,0,1,.8);
  d(17,0,1,.03); d(18,0,1,.5); d(19,0,1,.7); d(20,0,1,.4); d(21,0,3,1); d(22,0,2,0);
  d(23,0,1,.2); d(24,0,1,0); d(25,0,2,1); d(26,0,1,.2); d(27,0,1,0); d(28,0,1,.3);
  d(29,-1,1,0); d(30,0,1,0); d(31,0,1,.75);

  var vals = {}; for (var k in PD) vals[k] = PD[k].def;
  var lcd, lcdWhat, listeners = {};

  function push(i, v, label, shown){
    vals[i] = v;
    if (window.vstai && window.vstai.setParam) window.vstai.setParam(+i, v);
    if (label !== undefined && lcd){ lcdWhat.textContent = label; lcd.textContent = shown; }
    var ls = listeners[i]; if (ls) for (var j=0;j<ls.length;j++) ls[j]();
  }
  function listen(i, fn){ (listeners[i] = listeners[i] || []).push(fn); }
  function getBit(i,b){ return (Math.round(vals[i]) >> b) & 1; }
  function setBit(i,b,on,label){
    var v = Math.round(vals[i]); v = on ? (v | (1<<b)) : (v & ~(1<<b));
    push(i, v, label, on ? "On" : "Off");
  }
  function el(tag, cls, parent){ var e=document.createElement(tag); if(cls)e.className=cls; if(parent)parent.appendChild(e); return e; }

  // vertical slider
  function slider(parent, idx, label, fmt){
    var p = PD[idx];
    var box = el("div","sl",parent);
    var track = el("div","track",box);
    var cap = el("div","cap",track);
    el("div","lb",box).textContent = label;
    var TOP=4, RANGE=92-14-8;
    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }
    function show(){ return fmt ? fmt(vals[idx]) : Math.round(norm()*127)+""; }
    function paint(){ cap.style.top = (TOP + (1-norm())*RANGE) + "px"; }
    function setN(nn){
      nn = nn<0?0:(nn>1?1:nn);
      var v = p.min + (p.max-p.min)*nn;
      if (p.min >= 0 && p.max-p.min >= 2 && (p.max-p.min)%1===0) v = Math.round(v);
      push(idx, v, label, show()); paint();
    }
    track.addEventListener("pointerdown", function(e){ track._d=1; var r=track.getBoundingClientRect();
      setN(1-(e.clientY-r.top-TOP-7)/RANGE); track.setPointerCapture(e.pointerId); e.preventDefault(); });
    track.addEventListener("pointermove", function(e){ if(!track._d)return; var r=track.getBoundingClientRect();
      setN(1-(e.clientY-r.top-TOP-7)/RANGE); });
    track.addEventListener("pointerup", function(){ track._d=0; });
    track.addEventListener("pointercancel", function(){ track._d=0; });
    track.addEventListener("dblclick", function(){ push(idx,p.def,label,show()); paint(); });
    track.addEventListener("wheel", function(e){ e.preventDefault(); setN(norm() + (e.deltaY<0?0.04:-0.04)); }, {passive:false});
    listen(idx, paint); paint();
    return box;
  }

  // latching LED button on one bit of a packed param
  function bitBtn(parent, idx, bit, label){
    var b = el("div","bt",parent);
    el("div","sq",b); el("div","lb",b).textContent = label;
    function paint(){ b.classList.toggle("on", !!getBit(idx,bit)); }
    b.addEventListener("click", function(){ var cur=getBit(idx,bit); setBit(idx,bit, cur?0:1, label); paint(); });
    listen(idx, paint); paint();
    return b;
  }

  // whole-param LED-ladder selector
  function pSelector(parent, title, idx, opts){
    var s = el("div","sel",parent);
    if (title){ el("i","",s).textContent = title; }
    var rows = [];
    function paint(){ var cur=Math.round(vals[idx]); for (var i=0;i<rows.length;i++) rows[i].classList.toggle("on", i===cur); }
    opts.forEach(function(o,i){
      var r = el("div","opt",s); el("i","led",r); el("span","",r).textContent = o;
      r.addEventListener("click", function(){ push(idx,i,title,o); paint(); });
      rows.push(r);
    });
    listen(idx, paint); paint();
    return s;
  }

  // selector bound to a single bit (MAN / LFO PWM mode)
  function bitSelector(parent, title, idx, bit, opts){
    var s = el("div","sel",parent);
    el("i","",s).textContent = title;
    var rows = [];
    function paint(){ var cur=getBit(idx,bit); for (var i=0;i<rows.length;i++) rows[i].classList.toggle("on", i===cur); }
    opts.forEach(function(o,i){
      var r = el("div","opt",s); el("i","led",r); el("span","",r).textContent = o;
      r.addEventListener("click", function(){ setBit(idx,bit,i,title); paint(); });
      rows.push(r);
    });
    listen(idx, paint); paint();
    return s;
  }

  function bender(parent){
    var idx=29, p=PD[idx];
    var w = el("div","lever",parent);
    var slot = el("div","slot",w);
    var grip = el("div","grip",slot);
    el("div","lb",w).textContent = "Bender";
    var TRACK=120-30-4;
    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }
    function paint(){ grip.style.left = (2 + norm()*TRACK) + "px"; }
    function setN(nn){ nn=nn<0?0:(nn>1?1:nn); push(idx, p.min+(p.max-p.min)*nn, "Bender", (vals[idx]>=0?"+":"")+vals[idx].toFixed(2)); paint(); }
    slot.addEventListener("pointerdown", function(e){ slot._d=1; var r=slot.getBoundingClientRect(); setN((e.clientX-r.left-15)/TRACK); slot.setPointerCapture(e.pointerId); e.preventDefault(); });
    slot.addEventListener("pointermove", function(e){ if(!slot._d)return; var r=slot.getBoundingClientRect(); setN((e.clientX-r.left-15)/TRACK); });
    function done(){ if(!slot._d)return; slot._d=0; push(idx,0,"Bender","0"); paint(); }
    slot.addEventListener("pointerup", done);
    slot.addEventListener("pointercancel", done);
    listen(idx, paint); paint();
    return w;
  }

  function sec(row, name, cls){ var s=el("div","sec "+cls,row); el("b","",s).textContent=name; return el("div","bank",s); }
  function col(parent){ return el("div","col",parent); }

  // ---- build ------------------------------------------------------------
  lcd = document.getElementById("lcd"); lcdWhat = document.getElementById("lcdWhat");
  var row1 = document.getElementById("row1"), row2 = document.getElementById("row2");
  var pct = function(v){ return Math.round(v*100)+""; };

  // LFO
  var b = sec(row1,"LFO","c1");
  slider(b,0,"Rate"); slider(b,1,"Delay");

  // DCO
  b = sec(row1,"DCO","c2");
  var rc = col(b); pSelector(rc,"Range",6,["16'","8'","4'"]);
  var wc = col(b); bitBtn(wc,7,1,"Saw"); bitBtn(wc,7,0,"Pulse");
  var pm = col(b); bitSelector(pm,"PWM Mode",7,2,["Man","LFO"]);
  slider(b,3,"PWM"); slider(b,2,"LFO Mod"); slider(b,4,"Sub"); slider(b,5,"Noise");

  // HPF
  b = sec(row1,"HPF","c3");
  var hc = col(b); pSelector(hc,"Freq",8,["0","1","2","3"]);

  // VCF
  b = sec(row1,"VCF","c4");
  slider(b,9,"Freq"); slider(b,10,"Reso"); slider(b,11,"Env",pct); slider(b,12,"LFO"); slider(b,13,"Kybd",pct);
  var vp = col(b); pSelector(vp,"Env Pol",14,["+","-"]);

  // VCA
  b = sec(row1,"VCA","c5");
  var vm = col(b); pSelector(vm,"Source",15,["Env","Gate"]);
  slider(b,16,"Level",pct);

  // ENV
  b = sec(row1,"ENV","c1");
  slider(b,17,"A"); slider(b,18,"D"); slider(b,19,"S"); slider(b,20,"R");

  // CHORUS (two buttons I / II like the hardware; both = I+II)
  b = sec(row1,"Chorus","c2");
  var chc = col(b);
  bitBtn(chc,21,0,"I"); bitBtn(chc,21,1,"II");

  // ---- row 2: controllers + performance ---------------------------------
  b = sec(row2,"Controllers","c1");
  slider(b,23,"Porta");
  var pc = col(b); bitBtn(pc,24,0,"Porta");
  slider(b,26,"DCO Bend"); slider(b,27,"VCF Bend"); slider(b,28,"LFO Bend"); slider(b,31,"Volume",pct);

  b = sec(row2,"Assign","c4");
  var ac = col(b); pSelector(ac,"Mode",22,["Poly 1","Poly 2","Solo"]);
  var tc = col(b); pSelector(tc,"Transpose",25,["-1 Oct","Normal","+1 Oct"]);

  b = sec(row2,"Performance","c5");
  bender(b);
  slider(b,30,"Mod Push",pct);

  // push all defaults to the engine once the host is ready
  function ready(){
    for (var i in vals) if (window.vstai && window.vstai.setParam) window.vstai.setParam(+i, vals[i]);
    // Follow host-side changes (session restore, preset load, DAW automation): the
    // host pushes (index, value) so every control repaints to the real value.
    if (window.vstai && window.vstai.onParam) window.vstai.onParam(function(i, v){
      if (!(i in vals)) return; vals[i] = +v;
      var ls = listeners[i]; if (ls) for (var j = 0; j < ls.length; j++) ls[j]();
    });
  }
  if (window.vstai && window.vstai.onReady) window.vstai.onReady(ready); else ready();
})();
</script>
</body></html>
