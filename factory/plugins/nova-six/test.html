  gf.srcdoc="<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Nova Six<\/title>\n<style>\n  :root{ --ac:#3f7fd6; --ac2:#e8543a; --panel1:#20242b; --panel2:#14171c; --ink:#dfe4ec; --dim:#8b929e; }\n  *{box-sizing:border-box; -webkit-user-select:none; user-select:none}\n  html,body{margin:0;min-height:100%}\n  body{font:11px/1.3 ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;color:var(--ink);\n    background:radial-gradient(120% 90% at 50% -10%,#2b2f37 0%,#0b0d11 60%,#050608 100%);\n    display:flex;align-items:flex-start;justify-content:center;padding:14px 6px}\n  .synth{display:flex;max-width:1220px;width:100%;border-radius:11px;overflow:hidden;\n    box-shadow:0 26px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06)}\n  .cheek{width:20px;flex:0 0 20px;background:linear-gradient(90deg,#2a2d33,#16181d)}\n  .core{flex:1;background:linear-gradient(180deg,var(--panel1),var(--panel2));padding:10px 12px 12px;min-width:0}\n  /* header */\n  .head{display:flex;align-items:center;gap:14px;padding:2px 4px 9px;border-bottom:1px solid rgba(255,255,255,.1)}\n  .logo{font-size:23px;font-weight:800;letter-spacing:.02em;font-style:italic;\n    background:linear-gradient(90deg,#f4f6f9,#aeb7c6);-webkit-background-clip:text;background-clip:text;color:transparent}\n  .logo i{color:var(--ac);font-style:italic}\n  .tag{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}\n  .headfill{flex:1}\n  .lcd{display:flex;align-items:center;gap:8px}\n  .lcd .scr{min-width:82px;text-align:right;background:#0a1420;border:1px solid #000;border-radius:5px;\n    padding:3px 9px;font:700 19px/1 \"Menlo\",\"Consolas\",monospace;color:#5bc0ff;\n    text-shadow:0 0 7px rgba(63,127,214,.85),0 0 18px rgba(63,127,214,.4);letter-spacing:.06em}\n  .lcd .what{font-size:8.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;max-width:90px;text-align:left}\n  /* rows & sec   function down(m,el){ ensure().then(function(){ if(ctx.state==='suspended')ctx.resume(); if(ex&&ex.noteOn) ex.noteOn(m,hz(m),0.9); }); if(el)el.classList.add('dn'); }
  function up(m,el){ if(ex&&ex.noteOff) ex.noteOff(m); if(el)el.classList.remove('dn'); }
  KEYS.forEach(function(k){ var el=document.createElement('div'); el.className='key'+(k[2]?' bk':''); el.textContent=k[0];
    el.addEventListener('pointerdown',function(e){e.preventDefault();el._n=k[1]+oct*12;down(el._n,el);});
    el.addEventListener('pointerup',function(){up(el._n,el);}); el.addEventListener('pointerleave',function(){if(el.classList.contains('dn'))up(el._n,el);});
    KB.appendChild(el); });
  document.getElementById('octdn').addEventListener('click',function(){setOct(oct-1);});
  document.getElementById('octup').addEventListener('click',function(){setOct(oct+1);});
  var held={};                                            // base note -> actual note played (so releases survive an octave change)
  window.addEventListener('keydown',function(e){ if(e.repeat)return;
    if(e.key==='z'||e.key==='Z'){setOct(oct-1);return;} if(e.key==='x'||e.key==='X'){setOct(oct+1);return;}
    var b=KMAP[e.key]; if(b&&!held[b]){var m=b+oct*12;held[b]=m;down(m,null);} });
  window.addEventListener('keyup',function(e){ var b=KMAP[e.key]; if(b&&held[b]!=null){up(held[b],null);held[b]=null;} });
  setOct(0);
  
  </script></body></html>
