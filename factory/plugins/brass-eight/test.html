  gf.srcdoc="<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Brass Eight<\/title>\n<style>\n  :root{ --ac:#3f7fd6; --ac2:#d6b23f; --panel1:#1c2330; --panel2:#0a0d14; --ink:#e7ebf2; --dim:#8792a5; }\n  *{box-sizing:border-box; -webkit-user-select:none; user-select:none}\n  html,body{margin:0;min-height:100%}\n  body{font:11px/1.3 ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;color:var(--ink);\n    background:radial-gradient(120% 90% at 50% -10%,#24304a 0%,#070a11 60%,#03040a 100%);\n    display:flex;align-items:flex-start;justify-content:center;padding:14px 6px}\n  .synth{display:flex;max-width:1320px;width:100%;border-radius:11px;overflow:hidden;\n    box-shadow:0 26px 60px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05)}\n  .cheek{width:24px;flex:0 0 24px;background:linear-gradient(90deg,#2a2f38,#12151b);\n    border-right:2px solid #05070c}\n  .cheek.r{border-right:none;border-left:2px solid #05070c;background:linear-gradient(90deg,#12151b,#2a2f38)}\n  .core{flex:1;background:linear-gradient(180deg,var(--panel1),var(--panel2));padding:10px 12px 12px;min-width:0}\n  .head{display:flex;align-items:center;gap:14px;padding:2px 4px 9px;border-bottom:1px solid rgba(255,255,255,.09)}\n  .logo{font-size:25px;font-weight:800;letter-spacing:.02em;font-style:italic;\n    background:linear-gradient(90deg,#eef3fb,#9fb4d6);-webkit-background-clip:text;background-clip:text;color:transparent}\n  .logo b{color:var(--ac);font-weight:800}\n  .stripe{height:9px;width:120px;border-radius:2px;background:linear-gradient(90deg,#3f7fd6,#5a6fd6,#2a6fa8,#1c2330)}\n  .tag{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}\n  .headfill{flex:1}\n  .lcd{display:flex;align-items:center;gap:8px}\n  .lcd .scr{min-width:96px;text-align:right;background:#05131f;border:1px solid #000;border-radius:5px;\n    padding:3px 9px;font:700 18px/1 \"Menlo\",\"Consolas\",monospace;       for(var i=0;i<n;i++){oL[i]=m[outPtr+i];oR[i]=m[outPtr+STRIDE+i];}};
    analyser=ctx.createAnalyser(); analyser.fftSize=1024; wav=new Float32Array(analyser.fftSize);
    node.connect(analyser); node.connect(ctx.destination); started=true;
  }
  function disconnectSrc(){ if(src){try{src.disconnect();}catch(e){}; src=null;} }
  function setSource(kind){
    disconnectSrc();
    if(kind==='riff'){ src=ctx.createBufferSource(); src.buffer=makeRiff(); src.loop=true; src.connect(node); src.start(); st('playing musical riff through the plugin'); }
    else if(kind==='mic'){ navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){ src=ctx.createMediaStreamSource(s); src.connect(node); st('microphone → plugin'); }).catch(function(){ st('mic blocked'); }); }
  }
  document.getElementById('go').addEventListener('click',async function(){
    await ensure();
    if(ctx.state==='suspended') await ctx.resume();
    if(!running){ running=true; this.textContent='⏸ Stop'; this.className='';
      if(!IS_SYNTH){ setSource(document.getElementById('src').value); } else { st('press the keys (or computer keys A–K) to play'); }
    } else { running=false; this.textContent='▶ Start audio'; this.className='off'; disconnectSrc(); st('stopped'); }
  });
  
  var KB=document.getElementById('kb'), KEYS=[['C',60,0],['C#',61,1],['D',62,0],['D#',63,1],['E',64,0],['F',65,0],['F#',66,1],['G',67,0],['G#',68,1],['A',69,0],['A#',70,1],['B',71,0],['C',72,0],['C#',73,1],['D',74,0]];
  var KMAP={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,o:73,l:74};
  var oct=0;                                              // octave offset (−4..+4), applied at note-on
  function hz(m){return 440*Math.pow(2,(m-69)/12);}
  function setOct(o){ oct=o<-4?-4:(o>4?4:o); var ov=document.getElementById('octval'); if(ov)ov.textContent=(4+oct); }
  function down(m,el){ ensure().then(function(){ if(ctx.state==='suspended')ctx.resume(); if(ex&&ex.noteOn) ex.noteOn(m,hz(m),0.9); }); if(el)el.classList.add('dn'); }
  function up(m,el){ if(ex&&ex.noteOff) ex.noteOff(m); if(el)el.classList.remove('dn'); }
  KEYS.forEach(function(k){ var el=document.createElement('div'); el.className='key'+(k[2]?' bk':''); el.textContent=k[0];
    el.addEventListener('pointerdown',function(e){e.preventDefault();el._n=k[1]+oct*12;down(el._n,el);});
    el.addEventListener('pointerup',function(){up(el._n,el);}); el.addEventListener('pointerleave',function(){if(el.classList.contains('dn'))up(el._n,el);});
    KB.appendChild(el); });
  document.getElementById('octdn').addEventListener('click',function(){setOct(oct-1);});
  document.getElementById('octup').addEventListener('click',function(){setOct(oct+1);});
  var held={};                                            // base note -> actual note played (so releases survive an octave change)
  window.addEventListener('keydown',function(e){ if(e.repeat)return;
    if(e.key==='z'||e.key==='Z'){setOct(oct-1);return;} if(e.key==='x'||e.key==='X'){setOct(oct+1);return;}
    var b=KMAP[e.key]; if(b&&!held[b]){var m=b+oct*12;held[b]=m;down(m,null);} });
  window.addEventListener('keyup',function(e){ var b=KMAP[e.key]; if(b&&held[b]!=null){up(held[b],null);held[b]=null;} });
  setOct(0);
  
  </script></body></html>
