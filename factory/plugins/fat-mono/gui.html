<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fat Mono</title>
<style>
  :root{ --orange:#e87a33; --blue:#9fc6cf; --cream:#efe6d0; --dim:#b8ac8f; --panel:#141210; }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none}
  html,body{margin:0;min-height:100%}
  body{font:11px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--cream);
    background:radial-gradient(120% 90% at 50% -10%,#2a241d 0%,#0d0b08 60%,#060504 100%);
    display:flex;align-items:flex-start;justify-content:center;padding:14px 6px}
  .synth{display:flex;max-width:1220px;width:100%;border-radius:10px;overflow:hidden;
    box-shadow:0 26px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06)}
  .cheek{width:26px;flex:0 0 26px;background:
    linear-gradient(90deg,#8a5a2e 0%,#6b421f 30%,#523115 70%,#3a220e 100%);position:relative}
  .cheek.r{transform:scaleX(-1)}
  .cheek::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(174deg,rgba(0,0,0,.16) 0 3px,transparent 3px 8px);opacity:.7}
  .core{flex:1;background:linear-gradient(180deg,#1b1815,var(--panel) 30%,#0c0a08);padding:10px 12px 12px;min-width:0}
  /* ---------- header ---------- */
  .head{display:flex;align-items:baseline;gap:14px;padding:2px 4px 8px;border-bottom:1px solid rgba(239,230,208,.28)}
  .logo{font-size:22px;font-weight:800;letter-spacing:.04em;font-style:italic;color:var(--cream)}
  .logo i{color:var(--orange);font-style:italic}
  .tag{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .headfill{flex:1}
  .lcd{display:flex;align-items:center;gap:8px}
  .lcd .scr{min-width:78px;text-align:right;background:#0a0503;border:1px solid #000;border-radius:4px;
    padding:3px 9px;font:700 17px/1 "Menlo","Consolas",monospace;color:#ff9d4d;
    text-shadow:0 0 7px rgba(255,157,77,.8);letter-spacing:.08em}
  .lcd .what{font-size:8.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;max-width:90px;text-align:left}
  /* ---------- rows & sections ---------- */
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:stretch}
  .sec{border:1px solid rgba(239,230,208,.32);border-radius:5px;padding:10px 8px 22px;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0));flex:1 0 auto}
  .sec>b{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;
    font-weight:600;letter-spacing:.3em;color:var(--cream);text-transform:uppercase;white-space:nowrap}
  .bank{display:flex;gap:4px 8px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .col{display:flex;flex-direction:column;gap:6px;align-items:center}
  .hr{display:flex;gap:8px;align-items:center}
  /* ---------- knob ---------- */
  .kn{display:flex;flex-direction:column;align-items:center;gap:3px;width:56px}
  .kn.big{width:64px}
  .kn .cap{position:relative;width:40px;height:40px;border-radius:50%;cursor:ns-resize;touch-action:none;
    background:radial-gradient(circle at 50% 34%,#33302c,#0c0b0a 74%);
    border:1px solid #000;
    box-shadow:0 3px 6px rgba(0,0,0,.7), inset 0 1px 1px rgba(255,255,255,.15), 0 0 0 3px #080706, 0 0 0 4px rgba(239,230,208,.16)}
  .kn.big .cap{width:50px;height:50px}
  .kn .cap::before{content:"";position:absolute;inset:-7px;border-radius:50%;pointer-events:none;
    background:repeating-conic-gradient(from 225deg,rgba(239,230,208,.5) 0 1.6deg,transparent 1.6deg 27deg);
    -webkit-mask:radial-gradient(circle,transparent 23px,#000 24px,#000 26px,transparent 27px);
    mask:radial-gradient(circle,transparent 23px,#000 24px,#000 26px,transparent 27px)}
  .kn.big .cap::before{-webkit-mask:radial-gradient(circle,transparent 28px,#000 29px,#000 31px,transparent 32px);
    mask:radial-gradient(circle,transparent 28px,#000 29px,#000 31px,transparent 32px)}
  .kn .ptr{position:absolute;left:50%;top:2px;width:2.5px;height:13px;margin-left:-1.25px;border-radius:2px;
    background:var(--cream);box-shadow:0 0 4px rgba(239,230,208,.7);transform-origin:50% 18px}
  .kn.big .ptr{height:17px;transform-origin:50% 23px}
  .kn .lb{font-size:7.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;text-align:center;
    white-space:normal;line-height:1.25;min-height:16px;max-width:62px}
  .kn.bip .cap::after{content:"";position:absolute;top:-9px;left:50%;width:1px;height:5px;margin-left:-.5px;background:rgba(239,230,208,.6)}
  /* ---------- Model D rocker switch ---------- */
  .rk{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;width:52px}
  .rk .sw{width:34px;height:15px;border-radius:2.5px;border:1px solid #000;display:flex;overflow:hidden;
    box-shadow:0 2px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12)}
  .rk .sw i{flex:1;background:linear-gradient(180deg,#3a3833,#191713)}
  .rk .sw i.hot{background:linear-gradient(180deg,#57544d,#2c2a25)}
  .rk.on .sw i.hot{filter:brightness(1.15)}
  .rk.orange.on .sw i.hot{background:linear-gradient(180deg,#f79a55,#c65f1e)}
  .rk.blue.on .sw i.hot{background:linear-gradient(180deg,#c3dde3,#7fa9b3)}
  .rk.white.on .sw i.hot{background:linear-gradient(180deg,#f5efe0,#c9bfa8)}
  .rk:active .sw{transform:translateY(1px)}
  .rk .lb{font-size:7px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;text-align:center;
    line-height:1.25;white-space:normal;max-width:56px;min-height:9px}
  .rk .on-tag{font-size:6.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;align-self:flex-end;margin-right:2px}
  .rk.on .on-tag{color:var(--cream)}
  /* black source-select rocker (two labelled positions) */
  .rk2{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;width:66px}
  .rk2 .sw{width:34px;height:15px;border-radius:2.5px;border:1px solid #000;display:flex;overflow:hidden;
    box-shadow:0 2px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12)}
  .rk2 .sw i{flex:1;background:linear-gradient(180deg,#26241f,#0e0d0b)}
  .rk2 .sw i.sel{background:linear-gradient(180deg,#54504a,#2b2925)}
  .rk2 .opts{display:flex;justify-content:space-between;width:100%;font-size:6.5px;letter-spacing:.05em;
    color:var(--dim);text-transform:uppercase}
  .rk2 .opts span.sel{color:var(--cream)}
  .rk2 .lb{font-size:7px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;text-align:center;
    line-height:1.25;max-width:66px}
  /* ---------- selector (used for RANGE / WAVEFORM / priority) ---------- */
  .sel{display:flex;flex-direction:column;gap:1.5px;align-items:flex-start}
  .sel .opt{display:flex;align-items:center;gap:4px;cursor:pointer;padding:0 2px}
  .sel .led{width:5px;height:5px;border-radius:50%;background:#2a1e12;border:1px solid #000;transition:.1s}
  .sel .opt.on .led{background:var(--orange);box-shadow:0 0 6px var(--orange)}
  .sel .opt span{font-size:7px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
  .sel .opt.on span{color:var(--cream)}
  .sel>i{font-size:7px;letter-spacing:.09em;color:var(--dim);text-transform:uppercase;font-style:normal;margin-bottom:1px}
  /* ---------- wheels ---------- */
  .wheelbox{display:flex;gap:10px;align-items:flex-end;padding:0 2px}
  .wh{display:flex;flex-direction:column;align-items:center;gap:3px}
  .wh .slot{width:26px;height:104px;border-radius:5px;background:#070605;border:1px solid #000;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.9);position:relative;cursor:ns-resize;touch-action:none;overflow:hidden}
  .wh .grip{position:absolute;left:2px;right:2px;height:34px;border-radius:3px;
    background:repeating-linear-gradient(180deg,#e8e0cc 0 2.5px,#a89e86 2.5px 5px);
    border:1px solid #000;box-shadow:0 1px 3px rgba(0,0,0,.6);top:36px}
  .wh .lb{font-size:7.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .ovl{display:flex;flex-direction:column;align-items:center;gap:2px}
  .ovl .lamp{width:11px;height:11px;border-radius:50%;background:#3a130a;border:1px solid #000;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
  .ovl .lamp.hot{background:#ff4b1e;box-shadow:0 0 9px rgba(255,75,30,.8)}
  .ovl span{font-size:6.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
  .foot{margin-top:9px;padding-top:7px;border-top:1px solid rgba(239,230,208,.18);font-size:9px;color:#a3987e;
    display:flex;gap:14px;flex-wrap:wrap}
  .foot b{color:#d6cbb0;font-weight:600}
</style></head><body>
<div class="synth">
  <div class="cheek"></div>
  <div class="core">
    <div class="head">
      <div><div class="logo">fat<i>—</i>mono</div><div class="tag">monophonic analog · model d architecture</div></div>
      <div class="headfill"></div>
      <div class="lcd"><div class="what" id="lcdWhat">panel</div><div class="scr" id="lcd">D</div></div>
    </div>
    <div class="row" id="row1"></div>
    <div class="row" id="row2"></div>
    <div class="foot">
      <span><b>Osc. 3 Control off</b> frees oscillator 3 as a drone / mod source</span>
      <span><b>Mod wheel</b> applies the Modulation Mix to pitch and/or filter</span>
      <span><b>Decay switch</b> re-uses decay time as the release</span>
      <span><b>External Input</b> with no cable overdrives the mixer (Overload)</span>
    </div>
  </div>
  <div class="cheek r"></div>
</div>
<script>
(function(){
  "use strict";
  // ---- param table (mirror of spec.json) --------------------------------
  var PD = {}; // index -> {min,max,def}
  function d(i,mn,mx,df){ PD[i]={min:mn,max:mx,def:df}; }
  d(0,-2,2,0); d(1,0,1,.25); d(2,0,1,0); d(3,0,3,0); d(4,0,5,3); d(5,0,5,2);
  d(6,0,5,3); d(7,-7,7,.08); d(8,0,5,2); d(9,0,5,2); d(10,-7,7,-.12); d(11,0,5,2);
  d(12,0,3,0); d(13,0,1,.8); d(14,0,1,.75); d(15,0,1,.7); d(16,0,1,0); d(17,0,1,0);
  d(18,0,63,39); d(19,-4,4,.4); d(20,0,1,.35); d(21,0,1,.55); d(22,0,7,6);
  d(23,0,1,.2); d(24,0,1,.45); d(25,0,1,.4); d(26,0,1,.08); d(27,0,1,.5); d(28,0,1,.8);
  d(29,0,1,.35); d(30,0,15,9); d(31,0,11,0); d(32,-1,1,0); d(33,0,1,0);
  d(34,0,1,.3); d(35,0,1,.35); d(36,0,1,0); d(37,0,1,.7);

  var vals = {};
  for (var k in PD) vals[k] = PD[k].def;
  var lcd, lcdWhat;
  var listeners = {}; // param index -> [fn]

  function push(i, v, label, shown){
    vals[i] = v;
    if (window.vstai && window.vstai.setParam) window.vstai.setParam(+i, v);
    if (label !== undefined && lcd){ lcdWhat.textContent = label; lcd.textContent = shown; }
    var ls = listeners[i]; if (ls) for (var j=0;j<ls.length;j++) ls[j]();
  }
  function listen(i, fn){ (listeners[i] = listeners[i] || []).push(fn); }
  function getBit(i,b){ return (Math.round(vals[i]) >> b) & 1; }
  function setBit(i,b,on,label){
    var v = Math.round(vals[i]);
    v = on ? (v | (1<<b)) : (v & ~(1<<b));
    push(i, v, label, on ? "On" : "Off");
  }

  // ---- widget builders ----------------------------------------------------
  function el(tag, cls, parent){ var e=document.createElement(tag); if(cls)e.className=cls; if(parent)parent.appendChild(e); return e; }

  function knob(parent, idx, label, fmt, bipolar, big){
    var p = PD[idx];
    var box = el("div","kn"+(bipolar?" bip":"")+(big?" big":""),parent);
    var cap = el("div","cap",box);
    var ptr = el("i","ptr",cap);
    el("div","lb",box).textContent = label;
    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }
    function show(){ return fmt ? fmt(vals[idx]) : Math.round(norm()*10*10)/10+""; }
    function paint(){ ptr.style.transform = "rotate(" + ((norm()-0.5)*280) + "deg)"; }
    function setN(n){
      n = n<0?0:(n>1?1:n);
      var v = p.min + (p.max-p.min)*n;
      push(idx, v, label, show());
      paint();
    }
    cap.addEventListener("pointerdown", function(e){ cap._d=1; cap._y=e.clientY; cap._n=norm(); cap.setPointerCapture(e.pointerId); e.preventDefault();
      if(lcd){ lcdWhat.textContent=label; lcd.textContent=show(); } });
    cap.addEventListener("pointermove", function(e){ if(!cap._d)return; setN(cap._n + (cap._y-e.clientY)/170); });
    cap.addEventListener("pointerup", function(){ cap._d=0; });
    cap.addEventListener("pointercancel", function(){ cap._d=0; });
    cap.addEventListener("dblclick", function(){ push(idx,p.def,label,show()); paint(); });
    cap.addEventListener("wheel", function(e){ e.preventDefault(); setN(norm() + (e.deltaY<0?0.03:-0.03)); }, {passive:false});
    listen(idx, paint);
    paint();
    return box;
  }

  // Model D rocker bound to one bit of a packed param.
  // cls: "orange" (mod) / "blue" (audio) / "white" (performance)
  // invert: lit when the bit is 0 (OSC.3 CONTROL — panel ON = keyboard control)
  function rocker(parent, idx, bit, label, cls, invert){
    var b = el("div","rk "+cls,parent);
    var sw = el("div","sw",b);
    el("i","",sw); el("i","hot",sw);
    el("div","on-tag",b).textContent = "on";
    el("div","lb",b).textContent = label;
    function paint(){ var on = getBit(idx,bit); if (invert) on = 1-on; b.classList.toggle("on", !!on); }
    b.addEventListener("click", function(){
      var cur = getBit(idx,bit);
      setBit(idx, bit, cur ? 0 : 1, label);
      if (invert && lcd) lcd.textContent = cur ? "On" : "Off"; // show panel state, not bit state
      paint();
    });
    listen(idx, paint);
    paint();
    return b;
  }

  // black source-select rocker: two labelled positions on one bit
  function selRocker(parent, idx, bit, leftLb, rightLb, title){
    var b = el("div","rk2",parent);
    var sw = el("div","sw",b);
    var li = el("i","",sw), ri = el("i","",sw);
    var opts = el("div","opts",b);
    var ls = el("span","",opts); ls.textContent = leftLb;
    var rs = el("span","",opts); rs.textContent = rightLb;
    if (title){ el("div","lb",b).textContent = title; }
    function paint(){
      var on = getBit(idx,bit);
      li.classList.toggle("sel", !on); ri.classList.toggle("sel", !!on);
      ls.classList.toggle("sel", !on); rs.classList.toggle("sel", !!on);
    }
    b.addEventListener("click", function(){
      var cur = getBit(idx,bit);
      setBit(idx, bit, cur ? 0 : 1, (title||leftLb+"/"+rightLb));
      if (lcd) lcd.textContent = cur ? leftLb : rightLb;
      paint();
    });
    listen(idx, paint);
    paint();
    return b;
  }

  // LED-ladder selector with custom get/set so mixed-radix params can host it
  function selector(parent, title, opts, get, set){
    var s = el("div","sel",parent);
    if (title){ el("i","",s).textContent = title; }
    var rows = [];
    function paint(){ var cur=get(); for (var i=0;i<rows.length;i++) rows[i].classList.toggle("on", i===cur); }
    opts.forEach(function(o,i){
      var r = el("div","opt",s);
      el("i","led",r);
      el("span","",r).textContent = o;
      r.addEventListener("click", function(){ set(i); paint();
        if(lcd){ lcdWhat.textContent = title||o; lcd.textContent = o; } });
      rows.push(r);
    });
    s._paint = paint;
    paint();
    return s;
  }
  function pSelector(parent, title, idx, opts){
    var s = selector(parent, title, opts,
      function(){ return Math.round(vals[idx]); },
      function(i){ push(idx, i, title, opts[i]); });
    listen(idx, s._paint);
    return s;
  }

  function wheel(parent, idx, label, spring){
    var p = PD[idx];
    var w = el("div","wh",parent);
    var slot = el("div","slot",w);
    var grip = el("div","grip",slot);
    el("div","lb",w).textContent = label;
    var TRACK = 104-34-4;
    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }
    function paint(){ grip.style.top = (2 + (1-norm())*TRACK) + "px"; }
    function setN(n){
      n = n<0?0:(n>1?1:n);
      push(idx, p.min + (p.max-p.min)*n, label,
        (idx===32 ? ((vals[idx]>=0?"+":"")+(vals[idx]*7).toFixed(1)+" st") : Math.round(n*10*10)/10+""));
      paint();
    }
    slot.addEventListener("pointerdown", function(e){ slot._d=1; slot._y=e.clientY; slot._n=norm(); slot.setPointerCapture(e.pointerId); e.preventDefault(); });
    slot.addEventListener("pointermove", function(e){ if(!slot._d)return; setN(slot._n + (slot._y-e.clientY)/TRACK); });
    function done(){ if(!slot._d)return; slot._d=0; if (spring){ push(idx,(p.min+p.max)/2,label,"0"); paint(); } }
    slot.addEventListener("pointerup", done);
    slot.addEventListener("pointercancel", done);
    listen(idx, paint);
    paint();
    return w;
  }

  function sec(row, name){
    var s = el("div","sec",row);
    el("b","",s).textContent = name;
    var bank = el("div","bank",s);
    return bank;
  }
  function col(parent){ return el("div","col",parent); }
  function hr(parent){ return el("div","hr",parent); }

  // ---- build the panel -----------------------------------------------------
  lcd = document.getElementById("lcd");
  lcdWhat = document.getElementById("lcdWhat");
  var row1 = document.getElementById("row1");
  var row2 = document.getElementById("row2");
  var semiFmt = function(v){ return (v>0?"+":"")+v.toFixed(2); };
  var RANGES = ["Lo","32'","16'","8'","4'","2'"];
  var WAVES12 = ["Tri","Tri-Saw","Saw","Square","Wide P","Narrow P"];
  var WAVES3  = ["Tri","Rev Saw","Saw","Square","Wide P","Narrow P"];

  // CONTROLLERS
  var b = sec(row1,"Controllers");
  var cc1 = col(b);
  knob(cc1,0,"Tune",semiFmt,true);
  knob(cc1,1,"Glide");
  var cc2 = col(b);
  knob(cc2,2,"Modulation Mix");
  var cc3 = hr(cc2);
  selRocker(cc3,3,0,"Osc.3","Filt EG","");
  selRocker(cc3,3,1,"Noise","LFO","");
  var cc4 = col(b);
  rocker(cc4,12,0,"Oscillator Modulation","orange",false);
  rocker(cc4,12,1,"Osc. 3 Control","orange",true); // panel ON = keyboard control (bit = KB OFF)

  // OSCILLATOR BANK
  b = sec(row1,"Oscillator Bank");
  var o1r = col(b); pSelector(o1r,"Range 1",4,RANGES);
  var o1c = col(b); pSelector(o1c,"Waveform 1",5,WAVES12);
  var o2r = col(b); pSelector(o2r,"Range 2",6,RANGES);
  var o2f = col(b); knob(o2f,7,"Oscillator-2 Frequency",semiFmt,true,true);
  var o2w = col(b); pSelector(o2w,"Waveform 2",8,WAVES12);
  var o3r = col(b); pSelector(o3r,"Range 3",9,RANGES);
  var o3f = col(b); knob(o3f,10,"Oscillator-3 Frequency",semiFmt,true,true);
  var o3w = col(b); pSelector(o3w,"Waveform 3",11,WAVES3);

  // MIXER
  b = sec(row1,"Mixer");
  var m1 = col(b);
  knob(m1,13,"Volume Osc 1");
  rocker(m1,18,0,"Osc 1","blue",false);
  var m2 = col(b);
  knob(m2,14,"Volume Osc 2");
  rocker(m2,18,1,"Osc 2","blue",false);
  var m3 = col(b);
  knob(m3,15,"Volume Osc 3");
  rocker(m3,18,2,"Osc 3","blue",false);
  var m4 = col(b);
  knob(m4,16,"External Input Volume");
  rocker(m4,18,3,"External","blue",false);
  var ov = el("div","ovl",m4);
  var lamp = el("div","lamp",ov);
  el("span","",ov).textContent = "overload";
  function paintLamp(){
    var hot = ((Math.round(vals[18])>>3)&1) && vals[16]*vals[37] > 0.32;
    lamp.classList.toggle("hot", !!hot);
  }
  listen(16, paintLamp); listen(18, paintLamp); listen(37, paintLamp); paintLamp();
  var m5 = col(b);
  knob(m5,17,"Noise Volume");
  rocker(m5,18,4,"Noise","blue",false);
  selRocker(m5,18,5,"Pink","White","");

  // MODIFIERS
  b = sec(row1,"Modifiers");
  var md0 = col(b);
  rocker(md0,22,0,"Filter Modulation","orange",false);
  rocker(md0,22,1,"Keyboard Control 1","orange",false);
  rocker(md0,22,2,"Keyboard Control 2","orange",false);
  var md1 = col(b);
  knob(md1,19,"Cutoff Frequency",function(v){ return (v>0?"+":"")+v.toFixed(1); },true);
  knob(md1,23,"Attack Time");
  var md2 = col(b);
  knob(md2,20,"Filter Emphasis");
  knob(md2,24,"Decay Time");
  var md3 = col(b);
  knob(md3,21,"Amount of Contour");
  knob(md3,25,"Sustain Level");
  var lc = col(b);
  el("div","lb",lc).textContent = "· Loudness Contour ·";
  var lcr = hr(lc);
  knob(lcr,26,"Attack Time");
  knob(lcr,27,"Decay Time");
  knob(lcr,28,"Sustain Level");

  // OUTPUT
  b = sec(row1,"Output");
  var ou1 = col(b);
  knob(ou1,37,"Volume");
  rocker(ou1,30,3,"Main Output","blue",false);
  var ou2 = col(b);
  // A-440 lives in the Key Mode pack (value += 6 when on)
  (function(){
    var box = el("div","rk blue",ou2);
    var sw = el("div","sw",box); el("i","",sw); el("i","hot",sw);
    el("div","on-tag",box).textContent = "on";
    el("div","lb",box).textContent = "A-440";
    function a440(){ return Math.floor(Math.round(vals[31])/6)%2; }
    function paint(){ box.classList.toggle("on", !!a440()); }
    box.addEventListener("click", function(){
      var v = Math.round(vals[31]);
      var on = a440();
      push(31, on ? v-6 : v+6, "A-440", on ? "Off" : "On");
      paint();
    });
    listen(31, paint);
    paint();
  })();

  // ---- row 2: left-hand keyboard panel + keyboard/patch section -----------
  b = sec(row2,"Left-Hand Panel");
  var wb = el("div","wheelbox",b);
  wheel(wb,32,"Pitch",true);
  wheel(wb,33,"Mod",false);
  var lh1 = col(b);
  knob(lh1,29,"LFO Rate");
  selRocker(lh1,30,2,"Tri","Square","LFO Shape");
  var lh2 = col(b);
  rocker(lh2,30,0,"Glide","white",false);
  rocker(lh2,30,1,"Decay","white",false);

  // KEYBOARD (priority / trigger — Global Settings p.47)
  b = sec(row2,"Keyboard");
  var kb1 = col(b);
  selector(kb1,"Note Priority",["Low","High","Last"],
    function(){ return Math.round(vals[31])%3; },
    function(i){ var v=Math.round(vals[31]); push(31, v - (v%3) + i, "Note Priority", ["Low","High","Last"][i]); });
  var kb2 = col(b);
  (function(){
    var box = el("div","rk white",kb2);
    var sw = el("div","sw",box); el("i","",sw); el("i","hot",sw);
    el("div","on-tag",box).textContent = "on";
    el("div","lb",box).textContent = "Multi Trigger";
    function mt(){ return Math.floor(Math.round(vals[31])/3)%2; }
    function paint(){ box.classList.toggle("on", !!mt()); }
    box.addEventListener("click", function(){
      var v = Math.round(vals[31]);
      var on = mt();
      push(31, on ? v-3 : v+3, "Multi Trigger", on ? "Off (legato)" : "On");
      paint();
    });
    listen(31, paint);
    paint();
  })();
  knob(kb2,36,"After Pressure");

  // PATCH PANEL (reissue control routes, manual p.40)
  b = sec(row2,"Patch Panel");
  knob(b,34,"Velocity → Loudness");
  knob(b,35,"Pressure → Filter");

  // push all defaults to the engine once the host is ready
  function ready(){
    for (var i in vals) if (window.vstai && window.vstai.setParam) window.vstai.setParam(+i, vals[i]);
    // Follow param changes made outside the GUI — session restore, preset load, DAW
    // automation. The host replays the restored values in here right after we
    // register, so every control repaints to the saved sound instead of its default.
    if (window.vstai && window.vstai.onParam) window.vstai.onParam(function(i, v){
      if (!(i in vals)) return;
      vals[i] = +v;
      var ls = listeners[i]; if (ls) for (var j = 0; j < ls.length; j++) ls[j]();
    });
  }
  if (window.vstai && window.vstai.onReady) window.vstai.onReady(ready); else ready();
})();
</script>
</body></html>
