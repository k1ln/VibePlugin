  :root{--ac:#39d98a}
  *{box-sizing:border-box}

    box-shadow:0 16px 40px rgba(0,0,0,.4)}

  button.off{background:#28313f;color:#e7eef6}

  label{display:flex;gap:8px;align-items:center;color:#aeb9cc}

  .krow .octval{min-width:22px;text-align:center;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
  .krow .khint{margin-left:4px;color:#7c8aa3;font-size:11px}
  .kb{display:flex;gap:3px;flex-wrap:wrap}
  .kb .key{width:30px;height:80px;border-radius:0 0 7px 7px;background:linear-gradient(#f4f7fb,#cdd5e0);
    border:1px solid #2a3344;cursor:pointer;color:#1a2230;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;transition:.08s}
  .kb .key.bk{background:linear-gradient(#2b3340,#10151d);color:#9fb0c8;height:52px;width:22px;margin:0 -12px;z-index:2}
  .kb .key.dn{background:linear-gradient(var(--ac),#fff);color:#06080c;transform:translateY(2px)}

  gf.srcdoc="<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>FM Tines<\/title>\n<style>\n  :root{ --ac:#39d98a; --ac2:#2aa3ff; --lcd:#8affc0; --panel1:#20242a; --panel2:#0c0e11; --ink:#e9efe9; --dim:#7f8a84; }\n  *{box-sizing:border-box; -webkit-user-select:none; user-select:none}\n  html,body{margin:0;min-height:100%}\n  body{font:11px/1.3 ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;color:var(--ink);\n    background:radial-gradient(120% 90% at 50% -10%,#1b1f24 0%,#08090b 60%,#040405 100%);\n    display:flex;align-items:flex-start;justify-content:center;padding:14px 6px}\n  .synth{display:flex;max-width:1420px;width:100%;border-radius:9px;overflow:hidden;\n    box-shadow:0 26px 60px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05)}\n  .cheek{width:22px;flex:0 0 22px;background:linear-gradient(90deg,#26140c,#160b06);\n    box-shadow:inset -3px 0 6px rgba(0,0,0,.6),inset 3px 0 3px rgba(255,255,255,.05)}\n  .core{flex:1;background:linear-gradient(180deg,var(--panel1),var(--panel2));padding:10px 12px 12px;min-width:0}\n  .head{display:flex;align-items:center;gap:14px;padding:2px 4px 9px;border-bottom:1px solid rgba(255,255,255,.09)}\n  .logo{font-size:23px;font-weight:800;letter-spacing:.04em;\n    background:linear-gradient(90deg,#eafff2,#39d98a);-webkit-background-clip:text;background-clip:text;color:transparent}\n  .logo b{color:var(--ac2);font-weight:800}\n  .tag{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}\n  .headfill{flex:1}\n  .lcd{display:flex;align-items:center;gap:8px}\n  .lcd .what{font-size:8.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;max-width:110px;text-align:left}\n  .lcd .scr{min-width:120px;text-align:right;background:#08150e;border:1px solid #000;border-radius:5px;\n    padding:3px 9px;font:700 16px/1 \"Menlo\",\"Consolas\",monospace;color:var(--lcd);\n    text-shadow:0 0 7px rgba(57,217,138,.55);letter-spacing:.03em}\n  .rowlabel{font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--ac);text-transform:uppercase;margin:9px 2px 1px;\n    border-left:3px solid var(--ac);padding-left:6px}\n  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:stretch}\n  .sec{border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:18px 7px 6px;position:relative;\n    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));flex:0 0 auto}\n  .sec>b{position:absolute;top:0;left:0;right:0;padding:2px 7px;font-size:8px;font-weight:700;\n    letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;border-radius:5px 5px 0 0;\n    background:linear-gradient(90deg,var(--ac),#1f9c63);color:#04120a}\n  .sec.b>b{background:linear-gradient(90deg,var(--ac2),#1b5f92);color:#fff}\n  .sec.op>b{background:linear-gradient(90deg,#3a4048,#20242a);color:#cfe8da}\n  .bank{display:flex;gap:4px 8px;align-items:flex-start;flex-wrap:wrap}\n  .col{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:flex-start}\n  /* knob */\n  .kn{display:flex;flex-direction:column;align-items:center;gap:4px;width:40px}\n  .kn .dial{position:relative;width:30px;height:30px;border-radius:50%;cursor:ns-resize;touch-action:none;\n    background:radial-gradient(60% 60% at 40% 32%,#3a3f3c,#181b19 70%,#0a0b0b);border:1px solid #000;\n    box-shadow:0 2px 5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12)}\n  .kn .lb{font-size:7px;letter-spacing:.02em;color:var(--dim);text-transform:uppercase;text-align:center;line-height:1.15;min-height:9px;max-width:40px}\n  /* led button */\n  .bt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:38px}\n  .bt .sq{width:24px;height:12px;border-radius:3px;border:1px solid #000;position:relative;\n    background:linear-gradient(180deg,#2a2f2c,#141613);box-shadow:0 2px 3px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08)}\n  .bt .sq::after{content:\"\";position:a
