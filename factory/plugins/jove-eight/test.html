  :root{--ac:#e8542f}
  *{box-sizing:border-box}

  button.off{background:#28313f;color:#e7eef6}

  label{display:flex;gap:8px;align-items:center;color:#aeb9cc}
  .st{font-size:12px;color:#8da0bd;min-height:16px}

  .krow .khint{margin-left:4px;color:#7c8aa3;font-size:11px}
  .kb{display:flex;gap:3px;flex-wrap:wrap}
  .kb .key{width:30px;height:80px;border-radius:0 0 7px 7px;background:linear-gradient(#f4f7fb,#cdd5e0);

  .kb .key.bk{background:linear-gradient(#2b3340,#10151d);color:#9fb0c8;height:52px;width:22px;margin:0 -12px;z-index:2}
  .kb .key.dn{background:linear-gradient(var(--ac),#fff);color:#06080c;transform:translateY(2px)}

  gf.srcdoc="<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Jove Eight<\/title>\n<style>\n  :root{ --ac:#e8542f; --ac2:#3fa7d6; --panel1:#26262a; --panel2:#141416; --ink:#e7e7ea; --dim:#8b8b93; }\n  *{box-sizing:border-box; -webkit-user-select:none; user-select:none}\n  html,body{margin:0;min-height:100%}\n  body{font:11px/1.3 ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;color:var(--ink);\n    background:radial-gradient(120% 90% at 50% -10%,#303035 0%,#0b0b0d 60%,#040405 100%);\n    display:flex;align-items:flex-start;justify-content:center;padding:14px 6px}\n  .synth{display:flex;max-width:1300px;width:100%;border-radius:11px;overflow:hidden;\n    box-shadow:0 26px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05)}\n  .cheek{width:22px;flex:0 0 22px;background:linear-gradient(90deg,#3a3a3f,#1a1a1d)}\n  .core{flex:1;background:linear-gradient(180deg,var(--panel1),var(--panel2));padding:10px 12px 12px;min-width:0}\n  .head{display:flex;align-items:center;gap:14px;padding:2px 4px 9px;border-bottom:1px solid rgba(255,255,255,.09)}\n  .logo{font-size:24px;font-weight:800;letter-spacing:.04em;font-style:italic;\n    background:linear-gradient(90deg,#f6f6f9,#b6b6c2);-webkit-background-clip:text;background-clip:text;color:transparent}\n  .logo b{color:var(--ac);font-weight:800}\n  .rainbow{height:8px;width:120px;border-radius:2px;background:linear-gradient(90deg,#e8542f,#efa93a,#e8d24a,#5cbf6a,#3fa7d6,#5a6fd6,#9b57c6)}\n  .tag{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}\n  .headfill{flex:1}\n  .lcd{display:flex;align-items:center;gap:8px}\n  .lcd .scr{min-width:96px;text-align:right;background:#180a06;border:1px solid #000;border-radius:5px;\n    padding:3px 9px;font:700 18px/1 \"Menlo\",\"Consolas\",monospace;color:#ff7a4d;\n    text-shadow:0 0 7px rgba(232,84,47,.9),0 0 18px rgba(232,84,47,.4);letter-spacing:.04em}\n  .lcd .what{fo   function makeRiff(){
    var sr=ctx.sampleRate, len=Math.floor(sr*3.2), b=ctx.createBuffer(2,len,sr), d=b.getChannelData(0);

    for(var i=0;i<len;i++){var idx=Math.floor(i/nl),lt=(i-idx*nl)/sr,hz=440*Math.pow(2,(riff[idx%riff.length]-69)/12),
      ph=2*Math.PI*hz*(i/sr),env=Math.exp(-lt*5);

  }
  async function ensure(){

    ex=inst.exports; ex.init(ctx.sampleRate,STRIDE,2);

    var m=memF(); for(var i=0;i<64;i++) m[parPtr+i]=pcache[i];

      for(var i=0;i<n;i++){m[inPtr+i]=iL[i];m[inPtr+STRIDE+i]=iR[i];}
      ex.process(n);
      var oL=e.outputBuffer.getChannelData(0),oR=e.outputBuffer.getChannelData(1);

  var KB=document.getElementById('kb'), KEYS=[['C',60,0],['C#',61,1],['D',62,0],['D#',63,1],['E',64,0],['F',65,0],['F#',66,1],['G',67,0],['G#',68,1],['A',69,0],['A#',70,1],['B',71,0],['C',72,0],['C#',73,1],['D',74,0]];
