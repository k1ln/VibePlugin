<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jove Eight</title>
<style>
  :root{ --ac:#e8542f; --ac2:#3fa7d6; --panel1:#26262a; --panel2:#141416; --ink:#e7e7ea; --dim:#8b8b93; }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none}
  html,body{margin:0;min-height:100%}
  body{font:11px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background:radial-gradient(120% 90% at 50% -10%,#303035 0%,#0b0b0d 60%,#040405 100%);
    display:flex;align-items:flex-start;justify-content:center;padding:14px 6px}
  .synth{display:flex;max-width:1300px;width:100%;border-radius:11px;overflow:hidden;
    box-shadow:0 26px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05)}
  .cheek{width:22px;flex:0 0 22px;background:linear-gradient(90deg,#3a3a3f,#1a1a1d)}
  .core{flex:1;background:linear-gradient(180deg,var(--panel1),var(--panel2));padding:10px 12px 12px;min-width:0}
  .head{display:flex;align-items:center;gap:14px;padding:2px 4px 9px;border-bottom:1px solid rgba(255,255,255,.09)}
  .logo{font-size:24px;font-weight:800;letter-spacing:.04em;font-style:italic;
    background:linear-gradient(90deg,#f6f6f9,#b6b6c2);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo b{color:var(--ac);font-weight:800}
  .rainbow{height:8px;width:120px;border-radius:2px;background:linear-gradient(90deg,#e8542f,#efa93a,#e8d24a,#5cbf6a,#3fa7d6,#5a6fd6,#9b57c6)}
  .tag{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .headfill{flex:1}
  .lcd{display:flex;align-items:center;gap:8px}
  .lcd .scr{min-width:96px;text-align:right;background:#180a06;border:1px solid #000;border-radius:5px;
    padding:3px 9px;font:700 18px/1 "Menlo","Consolas",monospace;color:#ff7a4d;
    text-shadow:0 0 7px rgba(232,84,47,.9),0 0 18px rgba(232,84,47,.4);letter-spacing:.04em}
  .lcd .what{font-size:8.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;max-width:96px;text-align:left}
  .row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;align-items:stretch}
  .sec{border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:19px 8px 7px;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0));flex:0 0 auto}
  .sec>b{position:absolute;top:0;left:0;right:0;padding:2px 8px;font-size:8.5px;font-weight:700;
    letter-spacing:.14em;color:#0c0c0e;text-transform:uppercase;white-space:nowrap;border-radius:5px 5px 0 0}
  .c1>b{background:linear-gradient(90deg,#e8542f,#c53a1e);color:#fff}
  .c2>b{background:linear-gradient(90deg,#efa93a,#d4841f)}
  .c3>b{background:linear-gradient(90deg,#e8d24a,#c9ad24)}
  .c4>b{background:linear-gradient(90deg,#5cbf6a,#328f45);color:#fff}
  .c5>b{background:linear-gradient(90deg,#3fbfb0,#2a8f83);color:#fff}
  .c6>b{background:linear-gradient(90deg,#3fa7d6,#2a6fa8);color:#fff}
  .c7>b{background:linear-gradient(90deg,#5a6fd6,#3a48a8);color:#fff}
  .c8>b{background:linear-gradient(90deg,#9b57c6,#6f3a98);color:#fff}
  .bank{display:flex;gap:4px 8px;align-items:flex-start;flex-wrap:nowrap}
  .col{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:flex-start}
  /* vertical slider */
  .sl{display:flex;flex-direction:column;align-items:center;gap:4px;width:32px}
  .sl .track{position:relative;width:15px;height:86px;border-radius:4px;cursor:ns-resize;touch-action:none;
    background:linear-gradient(90deg,#0a0a0c,#1c1c20 45%,#0a0a0c);border:1px solid #000;box-shadow:inset 0 0 4px rgba(0,0,0,.8)}
  .sl .track::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;margin-left:-1px;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.16) 0 1px,transparent 1px 9px)}
  .sl .cap{position:absolute;left:-4px;width:23px;height:13px;margin-top:-6px;border-radius:3px;
    background:linear-gradient(180deg,#f0f0f4,#9a9aa4 55%,#5b5b64);border:1px solid #05070a;box-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none}
  .sl .cap::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:var(--ac);border-radius:1px}
  .sl .lb,.kn .lb{font-size:7.5px;letter-spacing:.03em;color:var(--dim);text-transform:uppercase;text-align:center;line-height:1.2;min-height:18px;max-width:40px}
  /* knob */
  .kn{display:flex;flex-direction:column;align-items:center;gap:5px;width:44px}
  .kn .dial{position:relative;width:34px;height:34px;border-radius:50%;cursor:ns-resize;touch-action:none;
    background:radial-gradient(60% 60% at 40% 32%,#43434a,#1c1c20 70%,#0c0c0e);border:1px solid #000;
    box-shadow:0 2px 5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12)}
  .kn .dial .ind{position:absolute;left:50%;top:3px;width:2px;height:12px;margin-left:-1px;
    background:var(--ac);border-radius:1px;transform-origin:50% 14px;box-shadow:0 0 5px var(--ac)}
  /* led button */
  .bt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:40px}
  .bt .sq{width:26px;height:14px;border-radius:3px;border:1px solid #000;position:relative;
    background:linear-gradient(180deg,#3a3a42,#18181c);box-shadow:0 2px 3px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12)}
  .bt .sq::after{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:6px;height:3.5px;border-radius:2px;background:#233;transition:.12s}
  .bt.on .sq::after{background:var(--ac);box-shadow:0 0 7px var(--ac),0 0 13px rgba(232,84,47,.5)}
  .bt:active .sq{transform:translateY(1px)}
  .bt .lb{font-size:7.5px;letter-spacing:.03em;color:var(--dim);text-transform:uppercase;text-align:center;white-space:nowrap}
  /* selector (LED ladder) */
  .sel{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
  .sel>i{font-size:7.5px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;font-style:normal;margin-bottom:1px}
  .sel .opt{display:flex;align-items:center;gap:4px;cursor:pointer;padding:0 1px}
  .sel .led{width:6px;height:6px;border-radius:50%;background:#241a17;border:1px solid #000;transition:.1s}
  .sel .opt.on .led{background:var(--ac2);box-shadow:0 0 6px var(--ac2)}
  .sel .opt span{font-size:7.5px;letter-spacing:.03em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
  .sel .opt.on span{color:#eef2f7}
  /* bender lever */
  .lever{display:flex;flex-direction:column;align-items:center;gap:4px}
  .lever .slot{width:118px;height:26px;border-radius:5px;background:#08080a;border:1px solid #000;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.9);position:relative;cursor:ew-resize;touch-action:none;overflow:hidden}
  .lever .grip{position:absolute;top:2px;bottom:2px;width:30px;border-radius:3px;
    background:linear-gradient(90deg,#43434e 0 3px,#26262d 3px 6px);background-size:6px 100%;
    border:1px solid #000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);left:44px}
  .lever .lb{font-size:7.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .foot{margin-top:10px;padding-top:7px;border-top:1px solid rgba(255,255,255,.08);font-size:9px;color:#79797f;display:flex;gap:16px;flex-wrap:wrap}
  .foot b{color:#adadb6;font-weight:600}
</style></head><body>
<div class="synth">
  <div class="cheek"></div>
  <div class="core">
    <div class="head">
      <div><div class="logo">Jove<b>·</b>Eight</div><div class="tag">eight voice sixteen oscillator polyphonic</div></div>
      <div class="headfill"></div><div class="rainbow"></div>
      <div class="lcd"><div class="what" id="lcdWhat">patch</div><div class="scr" id="lcd">JP 8</div></div>
    </div>
    <div class="row" id="row1"></div>
    <div class="row" id="row2"></div>
    <div class="foot">
      <span><b>CROSS MOD</b> VCO-2 FM's VCO-1 · <b>SYNC</b> slaves VCO-2 to VCO-1</span>
      <span><b>VCF SLOPE</b> -12 / -24 dB/oct · <b>ENV MOD</b> from ENV-1 or ENV-2</span>
      <span><b>ENV-1</b> polarity +/- &amp; key follow · assignable to freq / PW / VCF</span>
      <span><b>ARP</b> 1-4 oct up/down/u&amp;d/random · <b>ASSIGN</b> poly/solo/unison</span>
    </div>
  </div>
  <div class="cheek"></div>
</div>
<script>
(function(){
  "use strict";
  var PD = {};
  function d(i,mn,mx,df){ PD[i]={min:mn,max:mx,def:df}; }
  d(0,0,1,.3); d(1,0,1,.15); d(2,0,3,0); d(3,0,1,0); d(4,0,1,0); d(5,0,1,.3);
  d(6,0,63,16); d(7,0,1,0); d(8,0,3,1); d(9,0,3,1); d(10,0,3,1); d(11,-1,1,.03); d(12,0,3,1);
  d(13,0,1,.4); d(14,0,1,0); d(15,0,1,.5); d(16,0,1,.2); d(17,0,1,.45); d(18,0,1,0); d(19,0,1,.35);
  d(20,0,31,0); d(21,0,1,.8); d(22,0,3,0);
  d(23,0,1,.02); d(24,0,1,.4); d(25,0,1,.35); d(26,0,1,.3);
  d(27,0,1,.03); d(28,0,1,.5); d(29,0,1,.7); d(30,0,1,.35);
  d(31,0,1,.4); d(32,0,3,0); d(33,0,3,0); d(34,0,3,0); d(35,0,1,.2);
  d(36,0,127,11); d(37,0,1,.2); d(38,0,1,.3); d(39,0,1,.4); d(40,0,1,0); d(41,0,1,.3);
  d(42,0,3,0); d(43,-1,1,0); d(44,0,1,0); d(45,-1,1,0); d(46,0,1,.75);

  var vals = {}; for (var k in PD) vals[k] = PD[k].def;
  var lcd, lcdWhat, listeners = {};

  function push(i, v, label, shown){
    vals[i] = v;
    if (window.vstai && window.vstai.setParam) window.vstai.setParam(+i, v);
    if (label !== undefined && lcd){ lcdWhat.textContent = label; lcd.textContent = shown; }
    var ls = listeners[i]; if (ls) for (var j=0;j<ls.length;j++) ls[j]();
  }
  function listen(i, fn){ (listeners[i] = listeners[i] || []).push(fn); }
  function getField(i,shift,width){ var m=(1<<width)-1; return (Math.round(vals[i])>>shift)&m; }
  function setField(i,shift,width,val,label,shown){
    var m=(1<<width)-1; var v=Math.round(vals[i]); v=(v & ~(m<<shift)) | ((val&m)<<shift);
    push(i, v, label, shown);
  }
  function el(tag, cls, parent){ var e=document.createElement(tag); if(cls)e.className=cls; if(parent)parent.appendChild(e); return e; }

  function slider(parent, idx, label, fmt){
    var p = PD[idx];
    var box = el("div","sl",parent);
    var track = el("div","track",box);
    var cap = el("div","cap",track);
    el("div","lb",box).textContent = label;
    var TOP=4, RANGE=86-13-8;
    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }
    function show(){ return fmt ? fmt(vals[idx]) : Math.round(norm()*127)+""; }
    function paint(){ cap.style.top = (TOP + (1-norm())*RANGE) + "px"; }
    function setN(nn){ nn=nn<0?0:(nn>1?1:nn); var v=p.min+(p.max-p.min)*nn;
      if (p.min>=0 && p.max-p.min>=2 && (p.max-p.min)%1===0) v=Math.round(v);
      push(idx, v, label, show()); paint(); }
    track.addEventListener("pointerdown", function(e){ track._d=1; var r=track.getBoundingClientRect();
      setN(1-(e.clientY-r.top-TOP-6)/RANGE); track.setPointerCapture(e.pointerId); e.preventDefault(); });
    track.addEventListener("pointermove", function(e){ if(!track._d)return; var r=track.getBoundingClientRect(); setN(1-(e.clientY-r.top-TOP-6)/RANGE); });
    track.addEventListener("pointerup", function(){ track._d=0; });
    track.addEventListener("pointercancel", function(){ track._d=0; });
    track.addEventListener("dblclick", function(){ push(idx,p.def,label,show()); paint(); });
    track.addEventListener("wheel", function(e){ e.preventDefault(); setN(norm()+(e.deltaY<0?0.04:-0.04)); }, {passive:false});
    listen(idx, paint); paint();
    return box;
  }

  function knob(parent, idx, label, fmt){
    var p = PD[idx];
    var box = el("div","kn",parent);
    var dial = el("div","dial",box);
    el("div","lb",box).textContent = label;
    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }
    function show(){ return fmt ? fmt(vals[idx]) : Math.round(norm()*127)+""; }
    var ind = el("div","ind",dial);
    function repaint(){ ind.style.transform="rotate("+(norm()*270-135)+"deg)"; }
    function setN(nn){ nn=nn<0?0:(nn>1?1:nn); var v=p.min+(p.max-p.min)*nn;
      if (p.min>=0 && p.max-p.min>=2 && (p.max-p.min)%1===0) v=Math.round(v);
      push(idx, v, label, show()); repaint(); }
    dial.addEventListener("pointerdown", function(e){ dial._d=1; dial._y=e.clientY; dial._n=norm(); dial.setPointerCapture(e.pointerId); e.preventDefault(); });
    dial.addEventListener("pointermove", function(e){ if(!dial._d)return; setN(dial._n+(dial._y-e.clientY)/140); });
    dial.addEventListener("pointerup", function(){ dial._d=0; });
    dial.addEventListener("pointercancel", function(){ dial._d=0; });
    dial.addEventListener("dblclick", function(){ push(idx,p.def,label,show()); repaint(); });
    dial.addEventListener("wheel", function(e){ e.preventDefault(); setN(norm()+(e.deltaY<0?0.04:-0.04)); }, {passive:false});
    listen(idx, repaint); repaint();
    return box;
  }

  // latching LED button on one bit of a packed param
  function bitBtn(parent, idx, bit, label){
    var b = el("div","bt",parent);
    el("div","sq",b); el("div","lb",b).textContent = label;
    function paint(){ b.classList.toggle("on", !!getField(idx,bit,1)); }
    b.addEventListener("click", function(){ var cur=getField(idx,bit,1); setField(idx,bit,1,cur?0:1,label,cur?"Off":"On"); });
    listen(idx, paint); paint();
    return b;
  }

  // whole-param LED-ladder selector
  function pSelector(parent, title, idx, opts){
    var s = el("div","sel",parent);
    if (title){ el("i","",s).textContent = title; }
    var rows = [];
    function paint(){ var cur=Math.round(vals[idx]); for (var i=0;i<rows.length;i++) rows[i].classList.toggle("on", i===cur); }
    opts.forEach(function(o,i){ var r=el("div","opt",s); el("i","led",r); el("span","",r).textContent=o;
      r.addEventListener("click", function(){ push(idx,i,title,o); }); rows.push(r); });
    listen(idx, paint); paint();
    return s;
  }

  // selector bound to a multi-bit field inside a packed param
  function fieldSelector(parent, title, idx, shift, width, opts){
    var s = el("div","sel",parent);
    el("i","",s).textContent = title;
    var rows = [];
    function paint(){ var cur=getField(idx,shift,width); for (var i=0;i<rows.length;i++) rows[i].classList.toggle("on", i===cur); }
    opts.forEach(function(o,i){ var r=el("div","opt",s); el("i","led",r); el("span","",r).textContent=o;
      r.addEventListener("click", function(){ setField(idx,shift,width,i,title,o); }); rows.push(r); });
    listen(idx, paint); paint();
    return s;
  }

  function bender(parent){
    var idx=43, p=PD[idx];
    var w = el("div","lever",parent);
    var slot = el("div","slot",w); var grip = el("div","grip",slot);
    el("div","lb",w).textContent = "Bender";
    var TRACK=118-30-4;
    function norm(){ return (vals[idx]-p.min)/(p.max-p.min); }
    function paint(){ grip.style.left=(2+norm()*TRACK)+"px"; }
    function setN(nn){ nn=nn<0?0:(nn>1?1:nn); push(idx,p.min+(p.max-p.min)*nn,"Bender",(vals[idx]>=0?"+":"")+vals[idx].toFixed(2)); paint(); }
    slot.addEventListener("pointerdown", function(e){ slot._d=1; var r=slot.getBoundingClientRect(); setN((e.clientX-r.left-15)/TRACK); slot.setPointerCapture(e.pointerId); e.preventDefault(); });
    slot.addEventListener("pointermove", function(e){ if(!slot._d)return; var r=slot.getBoundingClientRect(); setN((e.clientX-r.left-15)/TRACK); });
    function done(){ if(!slot._d)return; slot._d=0; push(idx,0,"Bender","0"); paint(); }
    slot.addEventListener("pointerup", done); slot.addEventListener("pointercancel", done);
    listen(idx, paint); paint();
    return w;
  }

  function sec(row, name, cls){ var s=el("div","sec "+cls,row); el("b","",s).textContent=name; return el("div","bank",s); }
  function col(parent){ return el("div","col",parent); }

  lcd = document.getElementById("lcd"); lcdWhat = document.getElementById("lcdWhat");
  var row1 = document.getElementById("row1"), row2 = document.getElementById("row2");
  var pct = function(v){ return Math.round(v*100)+""; };
  var cents = function(v){ return (v>=0?"+":"")+Math.round(v*50)+"c"; };

  // ---- row 1 ----
  var b = sec(row1,"LFO","c1");
  slider(b,0,"Rate"); slider(b,1,"Delay");
  knob(b,2,"Wave",function(v){return ["Sin","Saw","Squ","Rnd"][Math.round(v)];});

  b = sec(row1,"VCO Mod","c2");
  slider(b,3,"LFO"); slider(b,4,"Env"); slider(b,5,"PWM");
  var mc = col(b); fieldSelector(mc,"Freq Dest",6,0,2,["VCO1","Both","VCO2"]); fieldSelector(mc,"PWM Src",6,4,2,["LFO","Man","Env1"]);

  b = sec(row1,"VCO-1","c3");
  slider(b,7,"Cross");
  var v1=col(b); pSelector(v1,"Range",8,["16'","8'","4'","2'"]);
  var v1w=col(b); pSelector(v1w,"Wave",9,["Tri","Saw","Pls","Squ"]);

  b = sec(row1,"VCO-2","c4");
  var v2=col(b); pSelector(v2,"Range",10,["16'","8'","4'","2'"]);
  var v2w=col(b); pSelector(v2w,"Wave",12,["Sin","Saw","Pls","Noi"]);
  knob(b,11,"Fine",cents);
  var v2s=col(b); bitBtn(v2s,6,2,"Sync"); bitBtn(v2s,6,3,"Low");

  b = sec(row1,"Mix / HPF","c5");
  knob(b,13,"Source",function(v){return v<=0.02?"V1":v>=0.98?"V2":pct(v);});
  slider(b,14,"HPF");

  // ---- row 2 ----
  b = sec(row2,"VCF","c6");
  slider(b,15,"Cutoff"); slider(b,16,"Reso"); slider(b,17,"Env",pct); slider(b,18,"LFO"); slider(b,19,"Kybd",pct);
  var vf=col(b); fieldSelector(vf,"Slope",20,0,1,["-24","-12"]); fieldSelector(vf,"Env Sel",20,1,1,["E1","E2"]);

  b = sec(row2,"VCA","c7");
  slider(b,21,"Level",pct);
  var va=col(b); pSelector(va,"LFO Trem",22,["0","1","2","3"]);

  b = sec(row2,"ENV-1","c8");
  slider(b,23,"A"); slider(b,24,"D"); slider(b,25,"S"); slider(b,26,"R");
  var e1=col(b); fieldSelector(e1,"Kybd",20,2,1,["Off","On"]); fieldSelector(e1,"Polarity",20,3,1,["Norm","Inv"]);

  b = sec(row2,"ENV-2","c1");
  slider(b,27,"A"); slider(b,28,"D"); slider(b,29,"S"); slider(b,30,"R");
  var e2=col(b); fieldSelector(e2,"Kybd",20,4,1,["Off","On"]);

  // ---- row 3 (performance) folded into row2 continuation ----
  b = sec(row2,"Arpeggio","c3");
  var arp=col(b); pSelector(arp,"Range",32,["1","2","3","4"]);
  var arm=col(b); pSelector(arm,"Mode",33,["Up","Dn","U&D","Rnd"]);
  knob(b,31,"Rate");
  var art=col(b); bitBtn(art,42,0,"Arp"); bitBtn(art,42,1,"Hold");

  b = sec(row2,"Assign","c4");
  var asg=col(b); pSelector(asg,"Mode",34,["Poly1","Poly2","Solo","Unis"]);

  b = sec(row2,"Performance","c6");
  knob(b,35,"Porta");
  var pm=col(b); fieldSelector(pm,"Porta",36,5,2,["Off","On","Upr"]);
  var bs=col(b); bitBtn(bs,36,0,"Bd V1"); bitBtn(bs,36,1,"Bd V2"); bitBtn(bs,36,2,"Bd VCF");
  slider(b,37,"Bend VCO"); slider(b,38,"Bend VCF");
  var ls=col(b); bitBtn(ls,36,3,"LM VCO"); bitBtn(ls,36,4,"LM VCF");
  slider(b,39,"LMod VCO"); slider(b,40,"LMod VCF"); knob(b,41,"Rise");
  knob(b,45,"Tune",cents); knob(b,46,"Volume",pct);
  var perf=col(b); bender(perf); slider(perf,44,"L-Mod",pct);

  // push all defaults to the engine once the host is ready
  function ready(){
    for (var i in vals) if (window.vstai && window.vstai.setParam) window.vstai.setParam(+i, vals[i]);
    // Follow host-side changes (session restore, preset load, DAW automation): the
    // host pushes (index, value) so every control repaints to the real value.
    if (window.vstai && window.vstai.onParam) window.vstai.onParam(function(i, v){
      if (!(i in vals)) return; vals[i] = +v;
      var ls = listeners[i]; if (ls) for (var j = 0; j < ls.length; j++) ls[j]();
    });
  }
  if (window.vstai && window.vstai.onReady) window.vstai.onReady(ready); else ready();
})();
</script>
</body></html>
